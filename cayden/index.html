<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cayden's ELA Word Quest</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light;--navy:#0f1f3d;--navy2:#1d3566;--green:#1f8a4c;--green-soft:#dcf3e5;--gold:#f2b632;--gold-soft:#fff3d4;--coral:#e0572f;--ink:#16213f;--ink2:#5a6582;--paper:#f5f7fb;--card:#fff;--line:#dbe2ee;--display:"Oswald","Arial Narrow",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:10px 16px 40px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 10px}
.brand{margin-right:auto;font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--navy);letter-spacing:.02em;line-height:1.05;text-transform:uppercase}

.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:.9rem;min-height:44px}
.pill[aria-pressed="false"]{opacity:.55}.homeb{background:var(--navy);color:#fff;border-color:var(--navy)}
.hero{background:linear-gradient(150deg,var(--navy2),var(--navy));color:#fff;border-radius:24px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.duo{display:flex;align-items:flex-end}.duo .coach{width:clamp(90px,20vw,140px)}.duo .nana{width:clamp(80px,17vw,120px);margin-left:-10px}
.hero h1{font-family:var(--display);text-transform:uppercase;font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.05;margin:0 0 4px;letter-spacing:.02em}
.tag{margin:0 0 8px;color:#bfe0cc;font-weight:700}
.xp{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.xp .top{display:flex;justify-content:space-between;font-weight:700;gap:8px;flex-wrap:wrap}
.meter{height:12px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd873);border-radius:999px}
.lite{color:#c9d6f0!important;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.88rem}
.sec{font-family:var(--display);text-transform:uppercase;color:var(--navy);font-size:1.4rem;margin:20px 0 8px;letter-spacing:.02em}.sec .small{text-transform:none;font-family:var(--body);font-weight:500}
h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--navy);font-size:clamp(1.4rem,5vw,1.9rem);margin:6px 0 4px;line-height:1.1}
.sub{color:var(--ink2);margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:12px 14px;text-align:left;display:grid;gap:2px;min-height:92px}
.tile .ic{font-size:26px;line-height:1}.tile b{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}.tile small{color:var(--ink2);font-weight:600}
.tile{min-width:0}.tile b{overflow-wrap:anywhere;hyphens:auto}
.wotd .btn{white-space:nowrap;flex:none}
.tile .medal{position:absolute;top:8px;right:10px;font-size:22px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:11px 20px;font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;font-size:1.05rem;min-height:48px}
.btn.soft{background:#e7ecf6;color:var(--navy)}.btn.sun{background:var(--gold);color:var(--navy)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scoreline{display:flex;justify-content:space-between;font-family:var(--display);font-size:1.15rem;color:var(--navy);letter-spacing:.02em}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--green);transition:width .4s}

.qtext{font-size:clamp(1.12rem,4vw,1.3rem);font-weight:700;margin:0 0 12px;line-height:1.4}

.opt{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.06rem;font-weight:600;text-align:left;min-height:54px}
.opt.right{border-color:var(--green);background:var(--green-soft)}.opt.wrong{border-color:var(--coral);background:#fdece6;animation:shake .35s}

.fb{min-height:1.5em;margin-top:12px;font-weight:700}.fb.good{color:var(--green)}.fb.bad{color:var(--coral)}.fb .why{display:block;color:var(--ink);font-weight:500;margin-top:4px}
.coachcard{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-top:14px;text-align:left;width:100%}
.coachcard .coach{width:86px}.coachcard>span:last-child{display:grid;gap:2px}.coachcard b{font-family:var(--display);text-transform:uppercase;color:var(--green);letter-spacing:.03em}
.bubble{display:block;background:var(--green-soft);border-radius:12px;padding:8px 12px;font-weight:700}
.cheerpop{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:flex-end;gap:6px;pointer-events:none;animation:cheerIn 1.9s ease forwards}
.cheerpop .nana{width:92px}.cheerpop .say{background:var(--gold);color:var(--navy);font-family:var(--display);text-transform:uppercase;font-size:1.1rem;border-radius:14px 14px 4px 14px;padding:8px 12px;margin-bottom:64px;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:180px}
@keyframes cheerIn{0%{transform:translateY(140%)}15%{transform:translateY(0)}85%{transform:translateY(0)}100%{transform:translateY(140%)}}
.plist{display:grid;gap:10px}.pcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:grid}.pcard b{font-family:var(--display);text-transform:uppercase;font-size:1.15rem;letter-spacing:.02em}.pcard small{color:var(--ink2)}
.passage{font-size:1.12rem;line-height:1.75}.sent{cursor:pointer;border-radius:6px}.sent.on{background:var(--gold-soft);box-shadow:0 0 0 3px var(--gold-soft)}
.peek{margin-bottom:10px}.peek summary{font-weight:700;cursor:pointer}
.slots{min-height:64px;border:3px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}.wchip{background:#e7ecf6;color:var(--navy);border-radius:10px;padding:8px 13px;font-size:1.12rem;font-weight:700;min-height:46px}.slots .wchip{background:var(--gold-soft)}
textarea{width:100%;font:inherit;font-size:1rem;border:2px solid var(--line);border-radius:12px;padding:12px;line-height:1.6}
.check{display:grid;gap:6px;margin-top:10px;background:var(--gold-soft);border-radius:12px;padding:10px 12px}.check label{display:flex;gap:8px;align-items:flex-start}
.bossfig{font-size:76px;text-align:center;line-height:1}.bossfig.hit{animation:shake .4s}
.hp{height:16px;background:#fde2df;border-radius:999px;overflow:hidden;margin:6px auto 10px;max-width:320px}.hp i{display:block;height:100%;background:linear-gradient(90deg,#e0572f,#b0301b);transition:width .4s}
.gu{display:grid;gap:14px}.gu h3{font-family:var(--display);text-transform:uppercase;color:var(--navy);margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stats div{background:#eef2f9;border-radius:12px;padding:10px;display:grid}.stats b{font-family:var(--display);font-size:1.6rem;color:var(--navy)}.stats span{font-size:.85rem;color:var(--ink2)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:.95rem}
.small{font-size:.9rem;color:var(--ink2)}
.wotd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.wotd .ww{font-family:var(--display);font-size:1.7rem;color:var(--navy);text-transform:uppercase}
.weekly{margin-top:12px}
.whi{width:22px;height:14px;vertical-align:-2px}
.bellmsg{font-weight:700;color:var(--green);font-size:1.1rem}
.tool summary{font-family:var(--display);text-transform:uppercase;font-size:1.15rem;color:var(--navy);cursor:pointer}.tool ul{margin:8px 0 0;padding-left:20px}.tool li{margin:4px 0}
.overlay{position:fixed;inset:0;background:rgba(15,31,61,.6);display:grid;place-items:center;z-index:40;padding:16px}.overlay .panel{max-width:420px;text-align:center}
.gin{font:inherit;font-size:1.4rem;width:120px;text-align:center;padding:8px;border-radius:12px;border:2px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.duo{justify-content:center}.chips{justify-content:center}}
.coach .nod{animation:coNod 2.6s ease-in-out infinite;transform-origin:60px 100px}
.coach .thumb{animation:coThumb 1.4s ease-in-out infinite;transform-origin:30px 128px}
.coach .blink{animation:coBlink 4.6s infinite;transform-origin:60px 70px}
@keyframes coNod{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg) translateY(1px)}60%{transform:rotate(2deg)}}
@keyframes coThumb{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg) translateY(-3px)}}
@keyframes coBlink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.nana .jump{animation:naJump .9s ease-in-out infinite;transform-origin:60px 160px}
.nana .pomL{animation:naPomL .45s ease-in-out infinite alternate;transform-origin:42px 96px}
.nana .pomR{animation:naPomR .45s ease-in-out infinite alternate;transform-origin:78px 96px}
.nana .blink{animation:naBlink 4s infinite;transform-origin:60px 64px}
.nana .hairsw{animation:naHair .9s ease-in-out infinite;transform-origin:60px 40px}
@keyframes naJump{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
@keyframes naPomL{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
@keyframes naPomR{from{transform:rotate(14deg)}to{transform:rotate(-10deg)}}
@keyframes naBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes naHair{0%,100%{transform:rotate(0)}45%{transform:rotate(1.5deg)}}

/* Luna the Frenchie */
.wrap{padding-bottom:120px}
.lunadock{position:fixed;left:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:38;display:flex;align-items:flex-end;gap:4px;pointer-events:none}
.lunabtn{pointer-events:auto;width:80px;padding:0;background:none;border:0}
.lunabtn .luna{width:80px;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
.luna .bark{display:none}.luna.barking .bark{display:inline}.luna.barking .smile{display:none}
.luna .hop{animation:lnHop 1.6s ease-in-out infinite;transform-origin:60px 108px}
.luna .tail{animation:lnWag .3s ease-in-out infinite alternate;transform-origin:92px 88px}
.luna .earL{animation:lnEarL 2.6s ease-in-out infinite;transform-origin:40px 30px}
.luna .earR{animation:lnEarR 2.6s ease-in-out infinite;transform-origin:80px 30px}
.luna .head{animation:lnTilt 3.6s ease-in-out infinite;transform-origin:60px 64px}
.luna .blink{animation:lnBlink 4.4s infinite;transform-origin:60px 40px}
@keyframes lnHop{0%,100%{transform:translateY(0)}20%{transform:translateY(-7px)}40%{transform:translateY(0)}}
@keyframes lnWag{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes lnEarL{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-10deg)}}
@keyframes lnEarR{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(10deg)}}
@keyframes lnTilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes lnBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.lunadock.jump .lunabtn{animation:lnJump .6s ease-out}
@keyframes lnJump{0%{transform:translateY(0)}35%{transform:translateY(-30px) rotate(-8deg)}70%{transform:translateY(0)}85%{transform:translateY(-8px)}100%{transform:none}}
.lunadock.zoom .lunabtn{animation:lnZoom 1.5s ease-in-out}
@keyframes lnZoom{0%{transform:translateX(0)}46%{transform:translateX(calc(100vw - 110px))}50%{transform:translateX(calc(100vw - 110px)) scaleX(-1)}96%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0)}}
.lunabub{background:#fff;border:3px solid var(--gold);border-radius:16px 16px 16px 4px;padding:6px 11px;margin-bottom:56px;max-width:210px;box-shadow:0 4px 12px rgba(0,0,0,.15);font-weight:700;line-height:1.3}
.lunabub.long{max-width:min(320px,70vw)}
.lunabub b{display:block;font-family:var(--display);color:var(--navy);letter-spacing:.05em}
.lunabub span{font-size:.92rem;color:var(--ink)}
.quest,.lessonintro{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.quest{margin-top:12px;border-color:var(--gold);background:var(--gold-soft)}
.qluna .luna{width:72px;display:block}
.quest b,.lessonintro b{font-family:var(--display);text-transform:uppercase;color:var(--navy);letter-spacing:.02em}
.qt{display:block;font-weight:700;margin-top:2px}
.ideas{margin:8px 0 10px;padding-left:20px}.ideas li{margin:6px 0}
.lunaover .bigluna .luna{width:110px;display:block;margin:0 auto}
.chk{text-align:left;margin:8px auto;max-width:360px;padding-left:20px}.chk li{margin:4px 0}
.bigtime{font-family:var(--display);font-size:2.6rem;color:var(--navy);margin:4px 0}
.boxwrap{position:relative;width:200px;height:200px;margin:14px auto;border:4px dashed #c7d2ea;border-radius:18px}
.boxdot{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--green);left:-15px;top:calc(100% - 11px);transition:all 4s linear;box-shadow:0 0 0 6px rgba(31,138,76,.2)}
.boxdot.s0{left:-15px;top:-15px}.boxdot.s1{left:calc(100% - 11px);top:-15px}.boxdot.s2{left:calc(100% - 11px);top:calc(100% - 11px)}.boxdot.s3{left:-15px;top:calc(100% - 11px)}
.calmluna{position:absolute;inset:0;display:grid;place-items:center}.calmluna .luna{width:110px}
.qpass{margin-bottom:10px;background:#fbfaf6;font-size:1.05rem;line-height:1.7}
.tile b{overflow-wrap:normal;word-break:normal;hyphens:none}
@media (max-width:420px){.tile b{font-size:1rem}}

/* Life Skits stage */
.stage{position:relative;height:330px;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(180deg,#dff1ff 0,#eef7ff 55%,#e9dcc4 55%,#f3e8d4 100%)}
.props{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:46px;line-height:1.1}
.props span{display:inline-block;margin:0 4px;animation:propPop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes propPop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.actor{position:absolute;bottom:4px;width:128px}.actor svg{width:100%;height:auto;display:block}
.actor.coach{right:8px}.actor.nana{left:8px}.actor.luna{left:50%;margin-left:-55px;width:110px}.actor.narr{display:none}
.actor.enter{animation:actIn .5s ease-out}
@keyframes actIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sbub{position:absolute;top:78px;max-width:62%;background:#fff;border:3px solid var(--gold);border-radius:16px;padding:8px 12px;font-weight:600;line-height:1.35;box-shadow:0 4px 12px rgba(0,0,0,.12);animation:actIn .4s ease-out}
.sbub b{display:block;font-family:var(--display);text-transform:uppercase;color:var(--navy);letter-spacing:.03em;font-size:.95rem}
.sbub.right{left:10px}.sbub.left{right:10px}
.sbub.narr{left:50%;transform:translateX(-50%);top:auto;bottom:18px;max-width:88%;width:max-content;background:rgba(15,31,61,.88);color:#fff;border-color:transparent;font-style:italic;text-align:center;animation:none}
.actor.luna ~ .sbub{top:64px;left:50%;right:auto;transform:translateX(-50%);max-width:80%;text-align:center}
.sdots{display:flex;gap:6px;justify-content:center;margin-top:10px}.sdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.sdots i.done{background:var(--green)}.sdots i.cur{background:var(--navy)}
.hintme2{animation:hintGlow2 1.2s ease-in-out infinite}@keyframes hintGlow2{0%,100%{box-shadow:0 0 0 0 rgba(242,182,50,.8)}50%{box-shadow:0 0 0 12px rgba(242,182,50,0)}}
@media (max-width:420px){.stage{height:310px}.actor{width:112px}.sbub{max-width:64%;font-size:.95rem}}
.bstep{font-family:var(--display);font-size:1.6rem;color:var(--navy);margin:6px 0;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<div class="wrap"><div class="topbar"><div class="brand">Cayden's ELA Tutor<small>& Word Quest · Read closely. Think clearly. Write with purpose.</small></div>
<button class="pill homeb" id="homeBtn" hidden>🏠 Home</button><button class="pill" id="voiceBtn" aria-pressed="true">🔊 Voice</button></div>
<main id="app"></main></div><canvas id="confetti"></canvas>
<script>
const C = {"skills": [{"id": "pos", "icon": "🧠", "name": "Parts of Speech", "color": "#5b6ee1", "qs": [{"q": "The quickly melting snow flooded the street. What part of speech is “quickly”?", "c": ["Adverb", "Adjective", "Verb", "Noun"], "a": 0, "why": "“Quickly” tells how the snow is melting, so it is an adverb."}, {"q": "She felt nervous before the audition. What part of speech is “nervous”?", "c": ["Adjective", "Adverb", "Verb", "Noun"], "a": 0, "why": "“Nervous” describes “she” after the linking verb “felt,” so it is an adjective."}, {"q": "Although it rained, the game continued. What part of speech is “Although”?", "c": ["Conjunction", "Preposition", "Adverb", "Pronoun"], "a": 0, "why": "“Although” joins a dependent clause to the main clause. It is a subordinating conjunction."}, {"q": "The cat hid beneath the porch. What part of speech is “beneath”?", "c": ["Preposition", "Adverb", "Conjunction", "Adjective"], "a": 0, "why": "“Beneath” shows the relationship between “hid” and “the porch.” It starts a prepositional phrase."}, {"q": "Wow, that performance was incredible! What part of speech is “Wow”?", "c": ["Interjection", "Adverb", "Adjective", "Conjunction"], "a": 0, "why": "“Wow” shows strong feeling and stands apart from the sentence. It is an interjection."}, {"q": "Marcus and I finished the project. What part of speech is “I”?", "c": ["Pronoun", "Noun", "Verb", "Adjective"], "a": 0, "why": "“I” takes the place of the speaker’s name, so it is a pronoun."}, {"q": "Her courage inspired the whole team. What part of speech is “courage”?", "c": ["Noun", "Adjective", "Verb", "Adverb"], "a": 0, "why": "“Courage” names an idea. It is an abstract noun."}, {"q": "Running is my favorite way to relax. What part of speech is “Running” here?", "c": ["Noun (gerund)", "Verb", "Adjective", "Adverb"], "a": 0, "why": "“Running” is the subject of the sentence. A verb form used as a noun is called a gerund."}, {"q": "The running water was cold. What part of speech is “running” here?", "c": ["Adjective (participle)", "Noun", "Verb", "Adverb"], "a": 0, "why": "Here “running” describes the water, so it works as an adjective, called a participle."}, {"q": "Please hand me the script. What part of speech is “me”?", "c": ["Pronoun", "Noun", "Preposition", "Adverb"], "a": 0, "why": "“Me” replaces a person’s name and receives the script. It is a pronoun used as an indirect object."}, {"q": "The director was extremely pleased. What part of speech is “extremely”?", "c": ["Adverb", "Adjective", "Verb", "Noun"], "a": 0, "why": "“Extremely” tells how pleased. Adverbs can describe adjectives, too."}, {"q": "Neither the actors nor the crew knew the answer. What part of speech is “Neither … nor”?", "c": ["Correlative conjunction", "Preposition", "Pronoun", "Adverb"], "a": 0, "why": "“Neither … nor” is a pair of conjunctions that work together. They are called correlative conjunctions."}, {"q": "The team has been practicing all week. What is the verb?", "c": ["has been practicing", "team", "all week", "has"], "a": 0, "why": "The complete verb is the verb phrase “has been practicing.”"}, {"q": "We sang loudly at the concert. Which word is an adverb?", "c": ["loudly", "sang", "concert", "We"], "a": 0, "why": "“Loudly” tells how we sang."}, {"q": "The tall oak tree shaded the yard. What part of speech is “tall”?", "c": ["Adjective", "Adverb", "Noun", "Verb"], "a": 0, "why": "“Tall” describes the tree, so it is an adjective."}, {"q": "She sings beautifully. What part of speech is “sings”?", "c": ["Verb", "Noun", "Adjective", "Adverb"], "a": 0, "why": "“Sings” is the action the subject does."}, {"q": "They left the gym early. What part of speech is “They”?", "c": ["Pronoun", "Noun", "Conjunction", "Adverb"], "a": 0, "why": "“They” takes the place of the people’s names."}, {"q": "The keys are on the table. What part of speech is “on”?", "c": ["Preposition", "Adverb", "Conjunction", "Verb"], "a": 0, "why": "“On” shows where the keys are in relation to the table."}, {"q": "I wanted to go, but I was sick. What part of speech is “but”?", "c": ["Coordinating conjunction", "Preposition", "Adverb", "Interjection"], "a": 0, "why": "“But” joins two independent clauses. It is a coordinating conjunction (FANBOYS: for, and, nor, but, or, yet, so)."}, {"q": "Honesty is the best policy. What part of speech is “Honesty”?", "c": ["Noun", "Adjective", "Verb", "Adverb"], "a": 0, "why": "“Honesty” names an idea, so it is an abstract noun."}, {"q": "The loud crowd cheered wildly. Which word is an adverb?", "c": ["wildly", "loud", "crowd", "cheered"], "a": 0, "why": "“Wildly” tells how the crowd cheered."}, {"q": "To win the game was his goal. What is “To win” called?", "c": ["An infinitive", "A gerund", "A participle", "A preposition"], "a": 0, "why": "“To” plus a base verb is an infinitive. Here it works as the subject."}, {"q": "The broken window was replaced. What part of speech is “broken” here?", "c": ["Adjective (participle)", "Verb", "Noun", "Adverb"], "a": 0, "why": "“Broken” comes from a verb but describes the window, so it works as an adjective."}, {"q": "Which word in this sentence is a noun? “The brave firefighter rescued a kitten.”", "c": ["firefighter", "brave", "rescued", "a"], "a": 0, "why": "“Firefighter” names a person, so it is a noun."}, {"q": "Hey, wait for me! What part of speech is “Hey”?", "c": ["Interjection", "Pronoun", "Adverb", "Verb"], "a": 0, "why": "“Hey” is an exclamation that expresses feeling, so it is an interjection."}, {"q": "This is my favorite song. What part of speech is “This”?", "c": ["Pronoun", "Adjective", "Adverb", "Conjunction"], "a": 0, "why": "Here “This” stands alone in place of a noun, so it is a demonstrative pronoun."}, {"q": "This song is my favorite. What part of speech is “This” here?", "c": ["Adjective", "Pronoun", "Adverb", "Noun"], "a": 0, "why": "Here “This” comes before a noun (song) and points it out, so it works as an adjective."}, {"q": "We arrived yesterday. What part of speech is “yesterday”?", "c": ["Adverb", "Adjective", "Preposition", "Conjunction"], "a": 0, "why": "“Yesterday” tells when we arrived, so it works as an adverb."}, {"q": "The students who studied passed the test. What is “who studied”?", "c": ["An adjective clause", "An adverb clause", "An independent clause", "A prepositional phrase"], "a": 0, "why": "“Who studied” describes the students, so it is an adjective (relative) clause."}, {"q": "Which word is a linking verb? “The soup smells delicious.”", "c": ["smells", "soup", "delicious", "The"], "a": 0, "why": "“Smells” links the soup to a description, delicious. It shows a state, not an action."}]}, {"id": "grammar", "icon": "✏️", "name": "Grammar Fix", "color": "#e8588a", "qs": [{"q": "Neither of the students ___ finished the essay.", "c": ["has", "have"], "a": 0, "why": "“Neither” is singular, so it takes the singular verb “has.”"}, {"q": "The team ___ celebrating its big win.", "c": ["is", "are"], "a": 0, "why": "The team acts as one group (“its” win), so use the singular verb “is.”"}, {"q": "Between you and ___, the play was too long.", "c": ["me", "I"], "a": 0, "why": "“Between” is a preposition, so it needs the object pronoun “me.”"}, {"q": "___ going to be late if we don’t leave now.", "c": ["They’re", "Their", "There"], "a": 0, "why": "“They’re” means “they are.” “Their” shows ownership and “there” shows place."}, {"q": "The dog wagged ___ tail.", "c": ["its", "it’s"], "a": 0, "why": "“Its” shows ownership. “It’s” always means “it is” or “it has.”"}, {"q": "I could ___ gone to the party.", "c": ["have", "of"], "a": 0, "why": "The correct phrase is “could have.” “Could of” is a common mistake because it sounds similar."}, {"q": "The new schedule will ___ everyone.", "c": ["affect", "effect"], "a": 0, "why": "“Affect” is usually the verb (to influence). “Effect” is usually the noun (the result)."}, {"q": "She did ___ on the test.", "c": ["well", "good"], "a": 0, "why": "“Well” is an adverb that describes how she did. “Good” is an adjective."}, {"q": "Which sentence is correct?", "c": ["Jordan and I went to the game.", "Me and Jordan went to the game.", "Jordan and me went to the game."], "a": 0, "why": "Use “I” as a subject. Try it alone: “I went to the game,” not “Me went.”"}, {"q": "Yesterday, he ___ the ball over the fence.", "c": ["threw", "throwed", "thrown"], "a": 0, "why": "“Threw” is the past tense of “throw.” “Thrown” needs a helper like “has.”"}, {"q": "If I ___ you, I would study tonight.", "c": ["were", "was", "am"], "a": 0, "why": "For wishes and “if” situations that aren’t real, formal English uses “were.”"}, {"q": "There ___ many reasons to read every day.", "c": ["are", "is"], "a": 0, "why": "The subject is “reasons,” which is plural, so use “are.”"}, {"q": "Which sentence has NO error?", "c": ["Walking to school, I got caught in the rain.", "Walking to school, the rain soaked my shoes.", "The rain soaked my shoes walking to school."], "a": 0, "why": "The opening phrase must describe the person walking. In the other two, it sounds like the rain was walking."}, {"q": "This book is ___ than the last one.", "c": ["better", "more better", "best"], "a": 0, "why": "“Better” already compares two things. Never add “more” to it."}, {"q": "Each of the players ___ a uniform.", "c": ["has", "have"], "a": 0, "why": "“Each” is singular, so it takes “has.”"}, {"q": "To ___ should I address the letter?", "c": ["whom", "who"], "a": 0, "why": "After a preposition like “to,” use the object form “whom.”"}, {"q": "Which is a complete sentence?", "c": ["I went to bed early because I was tired.", "Because I was tired.", "After the game ended."], "a": 0, "why": "A complete sentence needs a subject and a verb and must express a complete thought."}, {"q": "Which sentence is a run-on?", "c": ["I love reading I read every night.", "I love reading, so I read every night.", "I love reading; I read every night."], "a": 0, "why": "Two complete sentences joined with no punctuation or conjunction make a run-on."}, {"q": "I need to ___ down for a nap.", "c": ["lie", "lay"], "a": 0, "why": "You “lie” down yourself. You “lay” something down, like a book."}, {"q": "The coach, along with the players, ___ ready.", "c": ["is", "are"], "a": 0, "why": "The subject is “the coach.” The phrase “along with the players” does not change the verb."}, {"q": "The list of chores ___ on the fridge.", "c": ["is", "are"], "a": 0, "why": "The subject is “list,” not “chores,” so use the singular verb “is.”"}, {"q": "Somebody left ___ jacket in the gym.", "c": ["a", "their own jackets"], "a": 0, "why": "“Somebody” is singular. Using “a jacket” avoids any agreement problem."}, {"q": "She and ___ are going to the concert.", "c": ["I", "me"], "a": 0, "why": "Use the subject pronoun “I.” Try it alone: “I am going,” not “Me am going.”"}, {"q": "The award was given to Maya and ___.", "c": ["me", "I"], "a": 0, "why": "After the preposition “to,” use the object pronoun “me.”"}, {"q": "I ___ my homework before dinner yesterday.", "c": ["finished", "finish", "have finished"], "a": 0, "why": "“Yesterday” shows a completed past action, so use the simple past “finished.”"}, {"q": "By next June, she ___ from high school.", "c": ["will have graduated", "graduated", "has graduated"], "a": 0, "why": "An action completed before a future time uses the future perfect: “will have graduated.”"}, {"q": "Which sentence keeps the verb tense consistent?", "c": ["He opened the door and walked inside.", "He opened the door and walks inside.", "He opens the door and walked inside."], "a": 0, "why": "Both verbs stay in the past tense."}, {"q": "Choose the correct word: The team did ___ than we expected.", "c": ["better", "gooder", "more good"], "a": 0, "why": "“Better” is the comparative form of “good” and “well.”"}, {"q": "Choose the correct word: There were ___ people at the game than last week.", "c": ["fewer", "less"], "a": 0, "why": "Use “fewer” for things you can count (people). Use “less” for amounts (less noise)."}, {"q": "Choose the correct word: The music was too loud, ___ we left early.", "c": ["so", "because"], "a": 0, "why": "“So” shows the result: loud music caused us to leave."}, {"q": "Which sentence uses parallel structure?", "c": ["I like hiking, swimming, and biking.", "I like hiking, swimming, and to bike.", "I like to hike, swimming, and biking."], "a": 0, "why": "Parallel structure keeps items in the same form: hiking, swimming, biking."}, {"q": "Choose the correct word: ___ turn is it to wash the dishes?", "c": ["Whose", "Who’s"], "a": 0, "why": "“Whose” asks about ownership. “Who’s” means “who is.”"}, {"q": "Choose the correct word: I would rather read ___ watch TV.", "c": ["than", "then"], "a": 0, "why": "Use “than” for comparisons. “Then” is about time."}, {"q": "Choose the correct word: Please ___ my apology.", "c": ["accept", "except"], "a": 0, "why": "“Accept” means to receive. “Except” means “but not.”"}, {"q": "Choose the correct word: The movie had a strong ___ on me.", "c": ["effect", "affect"], "a": 0, "why": "Here we need a noun (the result), so use “effect.”"}, {"q": "Which sentence avoids a double negative?", "c": ["I don’t have any homework.", "I don’t have no homework.", "I haven’t got no homework."], "a": 0, "why": "Use only one negative word: “don’t” with “any.”"}, {"q": "Which sentence is written in active voice?", "c": ["The coach called a timeout.", "A timeout was called by the coach.", "A timeout was called."], "a": 0, "why": "In active voice, the subject does the action: the coach called."}, {"q": "Choose the correct pronoun: The dog chased ___ own tail.", "c": ["its", "their"], "a": 0, "why": "One dog is singular, so use “its.”"}, {"q": "Which sentence is correct?", "c": ["Each student must bring a pencil.", "Each students must bring a pencil.", "Each student must brings a pencil."], "a": 0, "why": "“Each” goes with a singular noun and the base verb after “must.”"}, {"q": "Choose the correct word: He ran ___ to catch the bus.", "c": ["quickly", "quick"], "a": 0, "why": "Use the adverb “quickly” to describe how he ran."}]}, {"id": "punct", "icon": "❗", "name": "Punctuation", "color": "#f28c28", "qs": [{"q": "Which sentence uses a comma correctly?", "c": ["After the movie, we went out for pizza.", "After the movie we went, out for pizza.", "After, the movie we went out for pizza."], "a": 0, "why": "Put a comma after an introductory phrase like “After the movie.”"}, {"q": "Which sentence uses a semicolon correctly?", "c": ["I studied all night; I aced the test.", "I studied all night; and aced the test.", "I studied; all night I aced the test."], "a": 0, "why": "A semicolon joins two complete sentences that are closely related."}, {"q": "Which sentence uses a colon correctly?", "c": ["Bring three things: a pencil, paper, and a calculator.", "Bring: a pencil, paper, and a calculator.", "Bring three things, a pencil: paper, and a calculator."], "a": 0, "why": "A colon introduces a list after a complete sentence."}, {"q": "Which sentence shows the speaker is talking TO Nana?", "c": ["Let’s eat, Nana!", "Let’s eat Nana!", "Lets eat Nana!"], "a": 0, "why": "Use a comma before the name of the person you are speaking to. Commas save lives!"}, {"q": "Which sentence punctuates the quotation correctly?", "c": ["She said, “I’ll be there soon.”", "She said “I’ll be there soon”.", "She said, “I’ll be there soon”."], "a": 0, "why": "In American English, the period goes inside the closing quotation mark."}, {"q": "Which compound sentence is punctuated correctly?", "c": ["I wanted to go, but it was raining.", "I wanted to go but, it was raining.", "I wanted, to go but it was raining."], "a": 0, "why": "Put the comma before the conjunction that joins two complete sentences."}, {"q": "Which sentence uses the appositive correctly?", "c": ["My brother, a talented drummer, plays in a band.", "My brother a talented drummer, plays in a band.", "My brother, a talented drummer plays in a band."], "a": 0, "why": "An extra description in the middle of a sentence needs a comma on both sides."}, {"q": "One dog is wagging its tail. Which is correct?", "c": ["The dog’s tail", "The dogs’ tail", "The dogs tail"], "a": 0, "why": "For one owner, add apostrophe plus s: dog’s."}, {"q": "The locker room belongs to all the players. Which is correct?", "c": ["the players’ locker room", "the player’s locker room", "the players locker room"], "a": 0, "why": "For a plural noun ending in s, add only an apostrophe: players’."}, {"q": "Which sentence is punctuated correctly?", "c": ["On June 9, 2026, the play opened.", "On June 9 2026 the play opened.", "On June, 9 2026, the play opened."], "a": 0, "why": "Put commas around the year when a full date appears in a sentence."}, {"q": "Which sentence is correct?", "c": ["However, I still finished my homework.", "However I still finished my homework.", "However I still, finished my homework."], "a": 0, "why": "Put a comma after a transition word like “However” at the start of a sentence."}, {"q": "___ going to love this book.", "c": ["You’re", "Your"], "a": 0, "why": "“You’re” means “you are.” “Your” shows ownership."}, {"q": "Which series is punctuated correctly?", "c": ["We need eggs, milk, and bread.", "We need eggs milk, and bread.", "We need, eggs, milk, and bread."], "a": 0, "why": "Separate items in a series with commas."}, {"q": "Which sentence is punctuated correctly?", "c": ["Yes, I will be there.", "Yes I will be there.", "Yes I, will be there."], "a": 0, "why": "Put a comma after an introductory word like “Yes.”"}, {"q": "Which sentence is correct?", "c": ["It’s going to rain today.", "Its going to rain today.", "Its’ going to rain today."], "a": 0, "why": "“It’s” means “it is.”"}, {"q": "Which title is punctuated correctly for a short story?", "c": ["“The Tell-Tale Heart”", "The Tell-Tale Heart.", "(The Tell-Tale Heart)"], "a": 0, "why": "Titles of short works, like stories, poems and songs, go in quotation marks."}, {"q": "Which sentence uses commas correctly with a nonessential clause?", "c": ["My car, which is red, needs gas.", "My car which is red, needs gas.", "My car, which is red needs gas."], "a": 0, "why": "A “which” clause that adds extra information needs commas on both sides."}, {"q": "Which sentence does NOT need a comma?", "c": ["The student who won the prize is my cousin.", "My cousin, who won the prize, is proud.", "After the ceremony, we celebrated."], "a": 0, "why": "“Who won the prize” is essential to know which student, so no commas are needed."}, {"q": "Which sentence uses a dash correctly?", "c": ["She had one goal — to win.", "She had — one goal to win.", "She — had one goal to win."], "a": 0, "why": "A dash can set off an important idea at the end of a sentence."}, {"q": "Which sentence is punctuated correctly?", "c": ["Wait! Don’t touch that!", "Wait. Dont touch that!", "Wait, don’t touch that?"], "a": 0, "why": "Exclamation points show strong feeling, and “don’t” needs an apostrophe."}, {"q": "Which uses a comma between two adjectives correctly?", "c": ["It was a long, hot day.", "It was a long hot, day.", "It was a, long hot day."], "a": 0, "why": "Put a comma between two adjectives that each describe the noun equally."}, {"q": "Which sentence punctuates dialogue correctly?", "c": ["“Let’s go,” said Maria.", "“Let’s go.” said Maria.", "“Let’s go” said Maria."], "a": 0, "why": "Use a comma, not a period, inside the quotation marks before the speaker tag."}, {"q": "Which is the correct possessive for the children’s toys?", "c": ["the children’s toys", "the childrens’ toys", "the childrens toys"], "a": 0, "why": "“Children” is already plural without an s, so add apostrophe plus s."}, {"q": "Which sentence uses a semicolon correctly with a transition?", "c": ["I was tired; however, I finished my essay.", "I was tired, however; I finished my essay.", "I was tired however, I finished my essay."], "a": 0, "why": "Use a semicolon before “however” and a comma after it when joining two sentences."}, {"q": "Which sentence is correct?", "c": ["We visited Paris, France, last summer.", "We visited Paris France, last summer.", "We visited Paris, France last summer."], "a": 0, "why": "Put commas around the country when it follows the city in a sentence."}, {"q": "Which sentence uses a comma splice (an error)?", "c": ["I love music, I play guitar.", "I love music, and I play guitar.", "I love music; I play guitar."], "a": 0, "why": "A comma alone cannot join two complete sentences. That error is a comma splice."}, {"q": "Which is the correct way to write a book title in typed work?", "c": ["To Kill a Mockingbird (in italics)", "“To Kill a Mockingbird” (in quotes)", "To Kill a Mockingbird (in bold)"], "a": 0, "why": "Titles of long works, like books and movies, are italicized. Short works go in quotation marks."}, {"q": "Which sentence uses a colon correctly?", "c": ["Remember this rule: always check your work.", "Remember: this rule always check your work.", "Remember this: rule always check your work."], "a": 0, "why": "A colon can introduce an explanation after a complete sentence."}, {"q": "Which sentence is correct?", "c": ["The Joneses’ house is on the corner.", "The Jones’s house is on the corner.", "The Joneses house is on the corner."], "a": 0, "why": "The plural of Jones is Joneses, and the plural possessive adds an apostrophe: Joneses’."}, {"q": "Which contraction is spelled correctly?", "c": ["shouldn’t", "should’nt", "shouldnt’"], "a": 0, "why": "The apostrophe replaces the missing letter o in “not”: should + n’t."}]}, {"id": "vocab", "icon": "📚", "name": "Vocabulary", "color": "#23a37a", "qs": [{"q": "The coach was adamant: no one would skip practice. “Adamant” means…", "c": ["firm and unwilling to change", "confused", "friendly", "tired"], "a": 0, "why": "The coach would not allow anyone to skip, so he was firm."}, {"q": "Her meticulous notes covered every detail. “Meticulous” means…", "c": ["very careful and precise", "messy", "short", "boring"], "a": 0, "why": "Notes that cover every detail are careful and precise."}, {"q": "The ambiguous ending left readers arguing about what happened. “Ambiguous” means…", "c": ["open to more than one meaning", "happy", "very clear", "short"], "a": 0, "why": "Readers argued because the ending could be understood in more than one way."}, {"q": "He was reluctant to audition, but his friends encouraged him. “Reluctant” means…", "c": ["hesitant or unwilling", "eager", "angry", "proud"], "a": 0, "why": "He needed encouragement, so he was hesitant."}, {"q": "The resilient team bounced back after a tough loss. “Resilient” means…", "c": ["able to recover quickly", "fragile", "lazy", "loud"], "a": 0, "why": "“Bounced back” is the clue: resilient means able to recover."}, {"q": "The candid interview revealed the actor’s true feelings. “Candid” means…", "c": ["honest and direct", "secretive", "funny", "rude"], "a": 0, "why": "The interview revealed true feelings, so it was honest."}, {"q": "Scientists hope to mitigate the damage from the storm. “Mitigate” means…", "c": ["make less severe", "increase", "predict", "ignore"], "a": 0, "why": "People want storm damage to be smaller, so mitigate means to lessen it."}, {"q": "Her eloquent speech moved the audience to tears. “Eloquent” means…", "c": ["well-spoken and moving", "quiet", "very long", "confusing"], "a": 0, "why": "A speech that moves people to tears is powerful and well-spoken."}, {"q": "The arduous hike took all day and left us exhausted. “Arduous” means…", "c": ["very difficult and tiring", "short and easy", "beautiful", "quiet"], "a": 0, "why": "All day and exhausted are clues that the hike was difficult."}, {"q": "The noise was incessant; it never stopped. “Incessant” means…", "c": ["continuing without pause", "very loud", "pleasant", "sudden"], "a": 0, "why": "The sentence explains it: it never stopped."}, {"q": "She gave a terse reply: “No.” “Terse” means…", "c": ["brief and to the point", "long and detailed", "polite", "funny"], "a": 0, "why": "A one-word answer is brief."}, {"q": "The benevolent king gave food to the poor. “Benevolent” means…", "c": ["kind and generous", "cruel", "wealthy", "wise"], "a": 0, "why": "Giving food to people in need is kind and generous."}, {"q": "His frugal habits helped him save money. “Frugal” means…", "c": ["careful with money", "wasteful", "lazy", "creative"], "a": 0, "why": "Saving money is the clue: frugal means careful with money."}, {"q": "The novice actor forgot a few lines. “Novice” means…", "c": ["a beginner", "an expert", "someone famous", "a director"], "a": 0, "why": "A novice is new at something, so mistakes happen."}, {"q": "With enough time, the plan was feasible. “Feasible” means…", "c": ["possible to do", "impossible", "expensive", "silly"], "a": 0, "why": "With enough time it could be done, so it was possible."}, {"q": "Good news helped alleviate her worry. “Alleviate” means…", "c": ["ease or reduce", "cause", "ignore", "share"], "a": 0, "why": "Good news makes worry smaller."}, {"q": "The prolific author wrote fifty novels. “Prolific” means…", "c": ["producing a lot", "unknown", "very slow", "wealthy"], "a": 0, "why": "Fifty novels is a lot of work."}, {"q": "The skeptical judge asked for more proof. “Skeptical” means…", "c": ["doubtful", "convinced", "angry", "bored"], "a": 0, "why": "Asking for more proof shows doubt."}, {"q": "What does the prefix “mal-” mean in “malfunction”?", "c": ["bad or badly", "again", "before", "under"], "a": 0, "why": "Mal- means bad, as in malfunction (to work badly)."}, {"q": "What does the root “bene” mean in “benefit”?", "c": ["good", "bad", "life", "sound"], "a": 0, "why": "Bene means good, as in benefit and benevolent."}, {"q": "Which word is a synonym for “diligent”?", "c": ["hardworking", "careless", "sleepy", "quick"], "a": 0, "why": "Diligent means showing steady, careful effort."}, {"q": "Which word is an antonym for “transparent”?", "c": ["opaque", "clear", "obvious", "honest"], "a": 0, "why": "Transparent means see-through. Opaque means you cannot see through it."}, {"q": "She said, “Great, another pop quiz,” with a sigh. Her tone is…", "c": ["sarcastic", "sincere", "scared", "excited"], "a": 0, "why": "She says “great” but means the opposite. That is sarcasm."}, {"q": "The vivid description made the scene come alive. “Vivid” means…", "c": ["bright and detailed", "dull", "short", "scary"], "a": 0, "why": "A description that makes a scene come alive is bright and detailed."}, {"q": "The ancient ruins were fragile. “Fragile” means…", "c": ["easily broken", "very old", "enormous", "hidden"], "a": 0, "why": "Fragile things break easily."}, {"q": "The scientist wanted to verify the results. “Verify” means…", "c": ["confirm that something is true", "erase", "ignore", "guess"], "a": 0, "why": "Scientists check results to confirm they are true."}, {"q": "The new rule was controversial, and people argued about it for weeks. “Controversial” means…", "c": ["causing disagreement", "popular with everyone", "simple", "secret"], "a": 0, "why": "People argued, so the rule caused disagreement."}, {"q": "She tried to persuade her parents to let her go. “Persuade” means…", "c": ["convince", "warn", "thank", "forbid"], "a": 0, "why": "To persuade is to convince someone with reasons."}, {"q": "The instructions were concise: three short steps. “Concise” means…", "c": ["brief but complete", "confusing", "very long", "handwritten"], "a": 0, "why": "Three short steps are brief but complete."}, {"q": "The hikers were cautious near the cliff edge. “Cautious” means…", "c": ["careful to avoid danger", "reckless", "excited", "lost"], "a": 0, "why": "Near a cliff, careful people are cautious."}, {"q": "His inference was based on clues in the story. “Inference” means…", "c": ["a conclusion drawn from evidence", "a direct quote", "a question", "a summary"], "a": 0, "why": "An inference is a smart guess based on evidence."}, {"q": "The team’s morale was high after the win. “Morale” means…", "c": ["confidence and spirit", "money", "rules", "schedule"], "a": 0, "why": "After a win, a team feels confident and hopeful."}, {"q": "The desert is an arid region. “Arid” means…", "c": ["very dry", "very cold", "crowded", "green"], "a": 0, "why": "Deserts get little rain, so they are dry."}, {"q": "The speaker’s argument was coherent and easy to follow. “Coherent” means…", "c": ["logical and clear", "loud", "emotional", "short"], "a": 0, "why": "Easy to follow suggests logical and clear."}, {"q": "The puppy was docile and let the children pet it. “Docile” means…", "c": ["gentle and easy to handle", "wild", "sleepy", "tiny"], "a": 0, "why": "A puppy that calmly lets kids pet it is gentle."}, {"q": "The new evidence will substantiate her claim. “Substantiate” means…", "c": ["support with proof", "deny", "hide", "question"], "a": 0, "why": "Evidence that supports a claim substantiates it."}, {"q": "He made an impartial decision, not favoring either team. “Impartial” means…", "c": ["fair and unbiased", "quick", "angry", "unfair"], "a": 0, "why": "Not favoring either side means fair."}, {"q": "The fans were jubilant after the championship. “Jubilant” means…", "c": ["joyful and excited", "disappointed", "tired", "silent"], "a": 0, "why": "Winning a championship makes fans joyful."}, {"q": "The instructions were obscure, and no one understood them. “Obscure” means…", "c": ["unclear", "famous", "simple", "printed"], "a": 0, "why": "No one understood, so the instructions were unclear."}, {"q": "She showed empathy by listening to her friend’s problems. “Empathy” means…", "c": ["understanding others’ feelings", "anger", "boredom", "jealousy"], "a": 0, "why": "Listening with care shows you understand how someone feels."}, {"q": "The rain was sporadic, coming and going all day. “Sporadic” means…", "c": ["happening at irregular times", "constant", "heavy", "warm"], "a": 0, "why": "Coming and going means it happened now and then."}, {"q": "The villain was notorious for his crimes. “Notorious” means…", "c": ["famous for something bad", "unknown", "respected", "kind"], "a": 0, "why": "Notorious means well known for something bad."}, {"q": "The answer was so obvious it was trivial. “Trivial” means…", "c": ["of little importance", "very difficult", "secret", "funny"], "a": 0, "why": "Trivial means small or unimportant."}, {"q": "She was apprehensive about her first day at a new school. “Apprehensive” means…", "c": ["worried or nervous", "thrilled", "bored", "angry"], "a": 0, "why": "A first day at a new school can make someone worried."}, {"q": "What does the prefix “pre-” mean in “preview”?", "c": ["before", "after", "against", "again"], "a": 0, "why": "Pre- means before. A preview is a look before."}, {"q": "What does the suffix “-less” mean in “fearless”?", "c": ["without", "full of", "one who", "able to be"], "a": 0, "why": "-less means without. Fearless means without fear."}, {"q": "What does the root “chron” mean in “chronological”?", "c": ["time", "color", "sound", "earth"], "a": 0, "why": "Chron means time, as in chronological (in time order)."}, {"q": "What does the root “port” mean in “transport” and “portable”?", "c": ["carry", "see", "write", "break"], "a": 0, "why": "Port means carry. Portable means able to be carried."}, {"q": "Which word is an antonym for “generous”?", "c": ["stingy", "kind", "giving", "wealthy"], "a": 0, "why": "Generous means giving freely. Stingy means unwilling to give."}, {"q": "Which word is a synonym for “enormous”?", "c": ["gigantic", "tiny", "average", "narrow"], "a": 0, "why": "Enormous and gigantic both mean very large."}]}, {"id": "lit", "icon": "📖", "name": "Literature Lab", "color": "#8a4fd1", "qs": [{"q": "“The wind whispered through the trees.” This is an example of…", "c": ["personification", "simile", "hyperbole", "alliteration"], "a": 0, "why": "Wind can’t really whisper. Giving human actions to things is personification."}, {"q": "“Her smile was as bright as the sun.” This is an example of…", "c": ["simile", "metaphor", "onomatopoeia", "irony"], "a": 0, "why": "A simile compares two things using “like” or “as.”"}, {"q": "“Time is a thief.” This is an example of…", "c": ["metaphor", "simile", "alliteration", "foreshadowing"], "a": 0, "why": "A metaphor says one thing IS another, without “like” or “as.”"}, {"q": "“I’ve told you a million times!” This is an example of…", "c": ["hyperbole", "personification", "symbolism", "allusion"], "a": 0, "why": "Hyperbole is a huge exaggeration for effect."}, {"q": "“Peter Piper picked a peck of pickled peppers.” This is an example of…", "c": ["alliteration", "onomatopoeia", "simile", "theme"], "a": 0, "why": "Alliteration repeats the same starting sound in nearby words."}, {"q": "A fire station burns down. This is an example of…", "c": ["situational irony", "dramatic irony", "foreshadowing", "a flashback"], "a": 0, "why": "Situational irony is when the opposite of what you expect happens."}, {"q": "The audience knows the villain is hiding behind the door, but the hero does not. This is…", "c": ["dramatic irony", "situational irony", "a metaphor", "the resolution"], "a": 0, "why": "Dramatic irony is when the audience knows something a character doesn’t."}, {"q": "Early in a story, the character notices a small crack in the dam. Later, the dam breaks. The crack is…", "c": ["foreshadowing", "a flashback", "the climax", "an allusion"], "a": 0, "why": "Foreshadowing is a hint about what will happen later."}, {"q": "A story told by a character using “I” is written in…", "c": ["first-person point of view", "third-person point of view", "second-person point of view", "omniscient point of view"], "a": 0, "why": "First person uses “I” and “me” and is told by a character in the story."}, {"q": "The central message or life lesson of a story is its…", "c": ["theme", "plot", "setting", "tone"], "a": 0, "why": "The theme is the big idea the author wants readers to understand about life."}, {"q": "The author’s attitude toward the subject is called…", "c": ["tone", "mood", "setting", "conflict"], "a": 0, "why": "Tone is the author’s attitude. Mood is how the reader feels."}, {"q": "The feeling a story creates in the reader is called…", "c": ["mood", "tone", "theme", "plot"], "a": 0, "why": "Mood is the atmosphere or feeling the reader gets."}, {"q": "A sailor fights to survive a hurricane. This conflict is…", "c": ["character vs. nature", "character vs. self", "character vs. society", "character vs. character"], "a": 0, "why": "A struggle against weather or the natural world is character vs. nature."}, {"q": "Calling a romantic person “a real Romeo” is an example of…", "c": ["allusion", "alliteration", "onomatopoeia", "hyperbole"], "a": 0, "why": "An allusion is a reference to a famous person, story or event. Romeo comes from Shakespeare."}, {"q": "“Buzz,” “sizzle” and “crash” are examples of…", "c": ["onomatopoeia", "personification", "metaphor", "irony"], "a": 0, "why": "Onomatopoeia words sound like what they describe."}, {"q": "The point of highest tension or the turning point in a plot is the…", "c": ["climax", "exposition", "resolution", "rising action"], "a": 0, "why": "The climax is the turning point, where the main conflict comes to a head."}, {"q": "A character who grows or changes during a story is…", "c": ["a dynamic character", "a static character", "a flat character", "the narrator"], "a": 0, "why": "Dynamic characters change. Static characters stay the same."}, {"q": "A dove appears at the end of a war story to stand for peace. This is…", "c": ["symbolism", "hyperbole", "alliteration", "a simile"], "a": 0, "why": "Symbolism is when an object stands for a bigger idea."}, {"q": "The time and place of a story is the…", "c": ["setting", "theme", "tone", "climax"], "a": 0, "why": "The setting tells when and where the story happens."}, {"q": "The part of the story that introduces the characters and setting is the…", "c": ["exposition", "climax", "falling action", "resolution"], "a": 0, "why": "The exposition sets up the story at the beginning."}, {"q": "A story where the narrator knows every character’s thoughts uses…", "c": ["third-person omniscient", "first person", "third-person limited", "second person"], "a": 0, "why": "Omniscient means all-knowing: the narrator knows everyone’s thoughts."}, {"q": "A story told with “he” and “she” that follows only one character’s thoughts uses…", "c": ["third-person limited", "third-person omniscient", "first person", "second person"], "a": 0, "why": "Limited means the narrator only knows one character’s thoughts."}, {"q": "A scene that jumps back to show events from the past is a…", "c": ["flashback", "foreshadowing", "climax", "resolution"], "a": 0, "why": "A flashback interrupts the story to show something that happened earlier."}, {"q": "The main character of a story is called the…", "c": ["protagonist", "antagonist", "narrator", "author"], "a": 0, "why": "The protagonist is the main character."}, {"q": "The character or force that works against the main character is the…", "c": ["antagonist", "protagonist", "narrator", "foil"], "a": 0, "why": "The antagonist creates conflict for the protagonist."}, {"q": "A character struggles to decide whether to tell the truth. This conflict is…", "c": ["character vs. self", "character vs. nature", "character vs. society", "character vs. technology"], "a": 0, "why": "An inner struggle with one’s own feelings or choices is character vs. self."}, {"q": "A teen fights an unfair school rule that affects everyone. This conflict is…", "c": ["character vs. society", "character vs. self", "character vs. nature", "character vs. fate"], "a": 0, "why": "Struggling against rules, laws or community norms is character vs. society."}, {"q": "The events after the climax that lead to the ending are called the…", "c": ["falling action", "rising action", "exposition", "inciting incident"], "a": 0, "why": "Falling action follows the climax and leads to the resolution."}, {"q": "The event that starts the main conflict is the…", "c": ["inciting incident", "resolution", "falling action", "epilogue"], "a": 0, "why": "The inciting incident kicks off the main problem of the story."}, {"q": "The way an author reveals what a character is like is called…", "c": ["characterization", "personification", "foreshadowing", "setting"], "a": 0, "why": "Characterization shows personality through actions, words, thoughts and others’ reactions."}, {"q": "In poetry, a group of lines is called a…", "c": ["stanza", "paragraph", "chapter", "verse line"], "a": 0, "why": "A stanza is like a paragraph in a poem."}, {"q": "The pattern of rhyming words at the ends of lines is the…", "c": ["rhyme scheme", "meter", "stanza", "theme"], "a": 0, "why": "A rhyme scheme is labeled with letters, like ABAB."}, {"q": "“The classroom was a zoo.” This is an example of…", "c": ["metaphor", "simile", "onomatopoeia", "alliteration"], "a": 0, "why": "It says the classroom IS a zoo, without “like” or “as.”"}, {"q": "“The stars danced in the night sky.” This is an example of…", "c": ["personification", "hyperbole", "simile", "allusion"], "a": 0, "why": "Stars can’t really dance. That gives them a human action."}, {"q": "Language that appeals to the five senses is called…", "c": ["imagery", "irony", "dialogue", "theme"], "a": 0, "why": "Imagery helps readers see, hear, smell, taste and feel."}, {"q": "A character who is the opposite of another character, highlighting their traits, is a…", "c": ["foil", "protagonist", "narrator", "static character"], "a": 0, "why": "A foil contrasts with another character to show their qualities more clearly."}, {"q": "Words spoken by characters in a story are called…", "c": ["dialogue", "narration", "imagery", "exposition"], "a": 0, "why": "Dialogue is the conversation between characters."}, {"q": "A long speech by one character, often in a play, is a…", "c": ["monologue", "dialogue", "stanza", "sonnet"], "a": 0, "why": "A monologue is a long speech by one person."}, {"q": "A 14-line poem, often written by Shakespeare, is called a…", "c": ["sonnet", "haiku", "limerick", "ballad"], "a": 0, "why": "A sonnet has 14 lines."}, {"q": "A three-line Japanese poem with 5, 7 and 5 syllables is a…", "c": ["haiku", "sonnet", "limerick", "free verse poem"], "a": 0, "why": "A haiku traditionally has three lines of 5, 7 and 5 syllables."}]}, {"id": "structure", "icon": "🏗️", "name": "Sentence Structure & Style", "color": "#0e7490", "qs": [{"q": "Which is a simple sentence?", "c": ["The dog barked.", "The dog barked, and the cat ran.", "When the dog barked, the cat ran."], "a": 0, "why": "A simple sentence has one independent clause."}, {"q": "Which is a compound sentence?", "c": ["I studied, and I passed the test.", "I studied for the test.", "Because I studied, I passed."], "a": 0, "why": "A compound sentence joins two independent clauses with a conjunction or semicolon."}, {"q": "Which is a complex sentence?", "c": ["Because I studied, I passed the test.", "I studied, and I passed.", "I studied."], "a": 0, "why": "A complex sentence has one independent clause and at least one dependent clause."}, {"q": "Which is an independent clause?", "c": ["the bus arrived late", "because the bus arrived late", "when the bus arrived"], "a": 0, "why": "An independent clause can stand alone as a sentence."}, {"q": "Which is a dependent clause?", "c": ["although she was tired", "she was tired", "she went to bed"], "a": 0, "why": "“Although” makes the clause depend on another clause to be complete."}, {"q": "Which transition best shows contrast? “I wanted to go. ___, I had too much homework.”", "c": ["However", "Therefore", "For example", "Similarly"], "a": 0, "why": "“However” signals a contrast or change in direction."}, {"q": "Which transition best shows a result? “It rained all night. ___, the game was canceled.”", "c": ["As a result", "Meanwhile", "For instance", "Nevertheless"], "a": 0, "why": "“As a result” shows cause and effect."}, {"q": "Which transition best adds an example? “Many sports build teamwork. ___, basketball requires players to pass and communicate.”", "c": ["For example", "However", "In contrast", "Finally"], "a": 0, "why": "“For example” introduces a specific example."}, {"q": "Which sentence is the most concise?", "c": ["We canceled the meeting.", "Due to the fact that the meeting was canceled by us, it did not happen.", "The meeting, which we canceled, was canceled."], "a": 0, "why": "Concise writing says the idea clearly with no extra words."}, {"q": "Which is the best topic sentence for a paragraph about the benefits of reading?", "c": ["Reading every day strengthens the mind in many ways.", "I read a book yesterday.", "Some books have pictures.", "The library opens at nine."], "a": 0, "why": "A topic sentence states the main idea the paragraph will support."}, {"q": "Which sentence would best conclude a paragraph about exercise?", "c": ["Clearly, regular exercise helps both the body and the mind.", "Exercise can be done at a gym.", "My sneakers are blue.", "Some people run."], "a": 0, "why": "A concluding sentence sums up the main idea."}, {"q": "Which is the best way to combine: “The game was close. Our team won.”", "c": ["The game was close, but our team won.", "The game was close, our team won.", "The game was close our team won."], "a": 0, "why": "Use a comma plus a conjunction to join two sentences. The others are a comma splice and a run-on."}, {"q": "Which revision fixes the misplaced modifier? “She served cookies to the kids on paper plates.”", "c": ["She served the kids cookies on paper plates.", "On paper plates, the kids were served by her.", "She, on paper plates, served kids."], "a": 0, "why": "Keep “on paper plates” next to the cookies so it doesn’t sound like the kids are on plates."}, {"q": "In an argument essay, the claim is…", "c": ["the main position the writer argues", "a fun fact", "the title", "a question for the reader"], "a": 0, "why": "The claim is the writer’s main point that the essay supports with evidence."}, {"q": "In an argument essay, a counterclaim is…", "c": ["an opposing view the writer addresses", "the writer’s main point", "a summary", "a quotation"], "a": 0, "why": "A counterclaim is the other side, which strong writers respond to."}, {"q": "Which is the strongest evidence for “Teens need more sleep”?", "c": ["A study found teens who slept 9 hours earned higher grades.", "My friend is always tired.", "Sleeping is nice.", "Some people nap."], "a": 0, "why": "Research data is stronger evidence than opinions or personal stories."}, {"q": "What does a thesis statement do?", "c": ["States the main argument of an essay", "Lists the sources", "Gives the author’s name", "Ends the essay"], "a": 0, "why": "The thesis tells the reader the essay’s main point, usually in the introduction."}, {"q": "Which sentence uses the most precise word choice?", "c": ["The cheetah sprinted across the plain.", "The cheetah went across the plain.", "The cheetah moved across the place.", "The animal did a thing."], "a": 0, "why": "“Sprinted” and “plain” are specific, vivid words."}, {"q": "Which sentence has a formal tone appropriate for an essay?", "c": ["The results suggest that the policy was effective.", "The results were totally awesome.", "The policy was, like, good.", "This policy rocks!"], "a": 0, "why": "Formal writing avoids slang and uses precise language."}, {"q": "What is the purpose of a hook in an introduction?", "c": ["To grab the reader’s interest", "To list sources", "To conclude the essay", "To repeat the title"], "a": 0, "why": "A hook, like a question, fact or story, pulls readers in."}, {"q": "Which sentence contains a fragment?", "c": ["Running down the hall.", "She was running down the hall.", "He ran down the hall."], "a": 0, "why": "“Running down the hall” has no subject and main verb, so it’s a fragment."}, {"q": "Which word best replaces “said” to show anger? “Stop that!” she ___.", "c": ["snapped", "whispered", "giggled", "mumbled"], "a": 0, "why": "“Snapped” shows a sharp, angry tone."}, {"q": "What is the best order for a narrative?", "c": ["Exposition, rising action, climax, falling action, resolution", "Climax, exposition, resolution, rising action", "Resolution, climax, exposition", "Rising action, resolution, exposition, climax"], "a": 0, "why": "Most stories follow this plot structure."}, {"q": "When quoting a source in an essay, you should…", "c": ["use quotation marks and give credit to the source", "copy it without credit", "change one word and call it yours", "leave out the author’s name"], "a": 0, "why": "Always quote exactly and cite the source to avoid plagiarism."}, {"q": "Which sentence uses an effective rhetorical question as a hook?", "c": ["What would you do if you had only one day left to change the world?", "This essay is about change.", "I will tell you about change.", "Change happens."], "a": 0, "why": "A rhetorical question makes readers think and pulls them into the topic."}, {"q": "What does it mean to paraphrase?", "c": ["Restate an idea in your own words", "Copy the exact words", "Make up a fact", "Summarize only the title"], "a": 0, "why": "Paraphrasing keeps the meaning but uses your own words. You still give credit to the source."}, {"q": "Which is the best evidence to explain a character’s bravery?", "c": ["A quote showing the character running into the fire to save a friend", "The character’s hair color", "The name of the town", "The chapter number"], "a": 0, "why": "Evidence must directly support the point: an action that shows bravery."}, {"q": "Which sentence varies sentence beginnings best after “I went to practice.”?", "c": ["Afterward, I studied for my test.", "I studied for my test.", "I then studied for my test.", "I, after that, studied."], "a": 0, "why": "Starting with a transition word varies the rhythm of your writing."}, {"q": "Which is an example of showing, not telling?", "c": ["Her hands trembled as she read the letter.", "She was nervous.", "She felt bad.", "She was scared a lot."], "a": 0, "why": "Showing uses details (trembling hands) so readers can see the feeling."}, {"q": "What does “revise” mean in the writing process?", "c": ["Improve the ideas, organization and word choice", "Fix only spelling", "Throw the draft away", "Print the essay"], "a": 0, "why": "Revising improves the content. Editing fixes spelling, grammar and punctuation."}]}], "shuffle": ["Although it was raining, the team kept practicing.", "The actor, nervous but ready, stepped onto the stage.", "Reading every day builds a stronger vocabulary.", "If you study smart, the test will feel easier.", "My grandmother taught me to never give up.", "Before the game started, the coach gave a speech.", "Good writers revise their work more than once.", "Cayden practiced his lines until he knew them by heart.", "The storm passed, and the sky turned bright blue.", "The ending of the novel surprised every reader.", "The coach blew the whistle, and the players ran onto the field.", "Reading closely helps you find evidence in the text.", "Before you write, make a plan for your essay.", "Nana cheered loudly from the front row.", "A strong thesis tells the reader your main point.", "The poem uses imagery to paint a picture of the sea.", "Although the test was hard, Cayden stayed calm.", "Every great story has a problem to solve.", "Practice does not make perfect; practice makes progress.", "The library is a great place to study after school."], "passages": [{"id": "understudy", "title": "The Understudy", "type": "Fiction", "text": ["For six weeks, Jordan had sat in the back of the theater with a script in his lap.", "He was the understudy for the lead role, which meant he learned every line but rarely got to say them on stage.", "Two hours before opening night, the director called the cast together.", "“Malik has the flu,” she said. “Jordan, you’re on.”", "Jordan’s heart pounded. He had practiced alone in hi dy’s internal clock, called the circadian rhythm, shifts later.", "This means many teens don’t feel sleepy until eleven at night or later.", "Screens make the problem worse, because bright light can signal the brain to stay awake.", "Without enough sleep, it is harder to focus, remember information and control emotions.", "Experts suggest a few simple habits: keep a regular bedtime, put phones away an hour before bed, and get sunlight in the morning.", "Small changes can lead to better grades, better moods and more energy."], "qs": [{"q": "What is the central idea of the passage?", "c": ["Teens need enough sleep, and some habits can help them get it.", "Teens should stop using phones forever.", "Adults need more sleep than teens.", "Morning sunlight is dangerous."], "a": 0, "why": "The passage explains why teens are tired and gives habits for better sleep."}, {"q": "According to the passage, how much sleep should teens get?", "c": ["Eight to ten hours", "Five to six hours", "Twelve hours", "Four hours"], "a": 0, "why": "The passage says doctors recommend eight to ten hours."}, {"q": "What does “circadian rhythm” mean?", "c": ["The body’s internal clock", "A kind of music", "A sleep disorder", "A morning exercise"], "a": 0, "why": "The passage defines it right in the sentence: the body’s internal clock."}, {"q": "Why do screens make sleep harder?", "c": ["Bright light can signal the brain to stay awake.", "Screens are too loud.", "Screens make the room cold.", "Screens use too much electricity."], "a": 0, "why": "The passage says bright light can signal the brain to stay awake."}, {"q": "What is the author’s main purpose?", "c": ["To inform readers about teen sleep", "To tell a funny story", "To sell a new phone", "To describe a dream"], "a": 0, "why": "The passage shares facts and advice, so its purpose is to inform."}]}, {"id": "dahmer", "title": "Vernon Dahmer: A Voice for the Vote", "type": "History", "text": ["Vernon Dahmer was a farmer and businessman in the Ke  "a": 0, "why": "The passage describes the writers, musicians and artists of this creative movement."}, {"q": "What does the last sentence suggest?", "c": ["The Harlem Renaissance still influences culture today.", "The Harlem Renaissance was forgotten.", "Only musicians mattered.", "Harlem no longer exists."], "a": 0, "why": "It says its influence can still be felt today."}]}, {"id": "poem", "title": "Mississippi Morning (a poem)", "type": "Poetry", "text": ["The sun climbs slow above the pines,", "a golden ladder, rung by rung.", "The porch boards creak their morning lines,", "a song my grandmother once sung.", "The field is quiet, wet with dew,", "the red dirt road runs soft and wide.", "Each dawn, she said, begins brand new,", "so carry courage deep inside."], "qs": [{"q": "“The sun climbs slow above the pines, a golden ladder.” This is an example of…", "c": ["metaphor", "simile", "onomatopoeia", "alliteration"], "a": 0, "why": "The sunlight is called a golden ladder without using “like” or “as.”"}, {"q": "“The porch boards creak their morning lines” gives the boards human qualities. This is…", "c": ["personification", "hyperbole", "irony", "a simile"], "a": 0, "why": "Boards can’t really speak lines, so this is personification."}, {"q": "What is the rhyme scheme of the first four lines?", "c": ["ABAB", "AABB", "ABBA", "AAAA"], "a": 0, "why": "Pines and lines rhyme (A); rung and sung rhyme (B)."}, {"q": "What is the mood of the poem?", "c": ["Peaceful and hopeful", "Angry and loud", "Scary and dark", "Silly and wild"], "a": 0, "why": "Quiet fields, morning light and the message of courage create a peaceful, hopeful mood."}, {"q": "What is the theme of the poem?", "c": ["Every day is a new chance to be brave.", "Mornings are boring.", "Farms are hard work.", "Old houses are noisy."], "a": 0, "why": "The grandmother’s words say each dawn begins new, so carry courage."}]}], "sparks": [{"title": "The Mysterious Script", "prompt": "You find an old play script in the s const VOICE={clips:{},files:{},bufs:{},ready:false};
async function loadVoicePack(){
  try{
    const j=await (await fetch("voice/clips.json")).json();
    VOICE.clips=j.clips;VOICE.files=j.files;
    const c=ctx();if(!c)return;
    await Promise.all(Object.entries(j.files).map(async([name,url])=>{
      const ab=await (await fetch(url)).arrayBuffer();
      VOICE.bufs[name]=await new Promise((ok,no)=>{const p=c.decodeAudioData(ab,ok,no);if(p&&p.then)p.then(ok,no)});
    }));
    VOICE.ready=true;
  }catch(e){VOICE.ready=false}
}
function vnorm(t){return String(t).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim()}
function vsents(t){
  const out=[];let cur="";
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if(".!?".includes(t[i])){
      while(i+1<t.length&&"\"”’'".includes(t[i+1])){i++;cur+=t[i]}
      if(i+1===t.length||t[i+1]===" "){out.push(cur.trim());cur=""}
    }
  }
  if(cur.trim())out.push(cur.trim());
  return out;
}
/* Returns the list of Nana clips for a line (or list of lines), or null if any piece is missing. */
function clipSeq(parts){
  if(!VOICE.ready)return null;
  const seq=[];
  for(const p of (Array.isArray(parts)?parts:[parts])){
    const whole=VOICE.clips[vnorm(p)];
    if(whole){seq.push(whole);continue}
    for(const s of vsents(p)){const c=VOICE.clips[vnorm(s)];if(!c)return null;seq.push(c)}
  }
  return seq.length?seq:null;
}

function playSeq(seq,onend,gap=.28){
  const c=ctx();let t=c.currentTime+.05;
  seq.forEach(([f,start,dur],n)=>{
    const src=c.createBufferSource();src.buffer=VOICE.bufs[f];src.connect(c.destination);
    src.start(t,start,dur);t+=dur+gap;vSources.push(src);
    if(n===seq.length-1)src.onended=()=>{vSources=[];onend&&onend()};
  });
}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function pickVoice(){
  const en=voices.filter(v=>/^en/i.test(v.lang));
  const q=v=>/premium/i.test(v.name)?3:/enhanced|natural|neural|online/i.test(v.name)?2:0;
  const pref=["Ava","Zoe","Samantha","Allison","Susan","Nicky","Karen","Moira","Tessa","Aria","Jenny","Google US English"];
  for(const tier of [3,2]){for(const n of pref){const v=en.find(v=>v.name.includes(n)&&q(v)===tier);if(v)return v}const any=en.find(v=>q(v)===tier&&/en[-_]US/i.test(v.lang));if(any)return any}
  for(const n of pref){const v=en.find(v=>v.name.includes(n));if(v)return v}
  return voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;
}
let audioEl=null;
function stopTalking(){try{speechSynthesis.cancel()}catch(e){} if(audioEl){audioEl.pause();audioEl=null} stopClips()}
/* say() takes a line or a list of lines. It plays Nana's recordings when every piece is recorded,
   and falls back to the device's reading voice for anything new (like made-up silly words). */
function pickCoachVoice(){
  const en=voices.filter(v=>/^en/i.test(v.lang));
  const male=/(Aaron|Arthur|Daniel|Evan|Fred|Gordon|Nathan|Reed|Rishi|Tom|Alex|Oliver|Guy|David|Mark|James|Christopher|Eric|Roger|Ralph|Albert|Bruce|Male|Davis|Tony|Jason)/i;
  const q=v=>/premium/i.test(v.name)?3:/enhanced|natural|neural|online/i.test(v.name)?2:0;
  const m=en.filter(v=>male.test(v.name)).sort((a,b)=>q(b)-q(a)||(/en[-_]US/i.test(b.lang)?1:0)-(/en[-_]US/i.test(a.lang)?1:0));
  return m[0]||null;
}
/* Coach Croom speaks in a deep man's voice (device voice, low pitch) */
function sayCoach(text,{onend}={}){
  if(!S.voice){onend&&onend();return}
  stopTalking();if(Array.isArray(text))text=text.join(" ");
  try{const u=new SpeechSynthesisUtterance(text);const mv=pickCoachVoice();const v=mv||pickVoice();if(v)u.voice=v;
    u.pitch=mv?.7:.45;u.rate=.9;u.onend=()=>onend&&onend();speechSynthesis.speak(u)}catch(e){onend&&onend()}
}
/* Nana says one line, then Coach Croom answers */
function nanaThenCoach(nanaLine,coachLine){say(nanaLine,{onend:()=>setTimeout(()=>sayCoach(coachLine),250)})}
function say(text,{rate=.88,onword,onend}={}){
  if(!S.voice){onend&&onend();return}
  stopTalking();
  const seq=clipSeq(text);
  if(seq){try{playSeq(seq,onend);return}catch(e){}}
  if(Array.isArray(text))text=text.join(" ");
  try{
    const u=new SpeechSynthesisUtterance(text);const v=pickVoice();if(v)u.voice=v;
    u.rate=Math.min(1,rate+.05);u.pitch=1;
    if(onword)u.onboundary=e=>{if(e.name==="word"||e.charIndex!==undefined)onword(e.charIndex)};
    u.onend=()=>onend&&onend();
    speechSynthesis.speak(u);
  }catch(e){onend&&onend()}
}
let actx=null;
function ctx(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==="suspended")actx.resume();return actx}
function tone(f,t0,d,vol=.12,type="sine"){const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.05)}
function chime(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,i*.08,.5,.08,"triangle"))}
function boop(){tone(330,0,.18,.08,"sine");tone(262,.12,.25,.07,"sine")}

/* ============ WORD OF THE DAY / WEEKLY GOAL ============ */
function wotd(){const v=BANK.filter(q=>q.skill==="vocab"&&/“.+” means/.test(q.q));const d=new Date();const n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return v[n%v.length]}
function wotdCard(){const q=wotd();const word=(q.q.match(/“([^”]+)” means/)||[])[1]||"";return `<div class="panel wotd"><div><b>📖 Word of the Day</b><div class="ww">${esc(word)}</div><div class="small">${esc(q.c[q.a])}</div></div><button class="btn soft" id="wotdq">Quiz me</button></div>`}
const WEEK_GOAL=50;
function weekRight(){let n=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const v=S.days&&S.days[dayKey(d)];if(v)n+=v.right||0}return n}
function weeklyCard(){const n=weekRight(),p=Math.min(100,Math.round(n/WEEK_GOAL*100));return `<div class="panel weekly"><div class="scoreline" style="font-size:1rem"><span>🎯 Weekly Goal: ${WEEK_GOAL} right answers</span><span>${n} / ${WEEK_GOAL}</span></div><div class="bar"><i style="width:${p}%"></i></div>${n>=WEEK_GOAL?'<div class="small" style="color:var(--green);font-weight:700">🏆 Goal reached this week! Coach is proud.</div>':`<div class="small">${WEEK_GOAL-n} to go this week</div>`}</div>`}
