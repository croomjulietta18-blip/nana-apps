/* ============ SENTENCE SHUFFLE ============ */
function shuffleGame(){
  const list=shuffle(C.shuffle).slice(0,5);let n=0,right=0;
  function show(){
    const target=list[n].split(" ");let built=[],first=true;let bank=shuffle(target.map((w,i)=>({w,i})));if(bank.every((b,i)=>b.i===i))bank.reverse();
    function draw(){
      h(`<h2>🧩 Sentence Shuffle</h2><div class="scoreline"><span>Sentence ${n+1} / ${list.length}</span><span>⭐ ${right}</span></div>
        <div class="panel"><div class="slots">${built.map((b,j)=>`<button class="wchip" data-back="${j}">${esc(b.w)}</button>`).join("")||'<span class="small">Tap the words in order…</span>'}</div>
        <div class="bank">${bank.map((b,j)=>`<button class="wchip" data-take="${j}">${esc(b.w)}</button>`).join("")}</div>
        <div class="fb" id="fb"></div><div class="row" id="nav" style="justify-content:center;margin-top:8px"></div></div>
        <p class="small">Tip: look for the capital letter to find the first word, and punctuation to find the last.</p>`);
      app.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{built.push(bank.splice(+b.dataset.take,1)[0]);check()});
      app.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{bank.push(built.splice(+b.dataset.back,1)[0]);draw()});
    }
    function check(){
      if(bank.length){draw();return}
      const ok=built.map(b=>b.w).join(" ")===target.join(" ");draw();
      const q={id:"shuf-"+list[n],skill:"shuffle"};
      if(ok){chime();record(q,first);if(first)right++;cheer();if(first)say(pick(C.cheers));$("#fb").className="fb good";$("#fb").textContent="✔ Correct!";
        app.querySelectorAll(".wchip").forEach(x=>x.disabled=true);
        $("#nav").innerHTML=`<button class="btn" id="go">${n<list.length-1?"Next ▶":"Finish ✓"}</button>`;
        $("#go").onclick=()=>{n++;n<list.length?show():(S.rounds=(S.rounds||0)+1,save(),celebrate(),h(`<h2>Shuffle complete!</h2><div class="panel" style="text-align:center"><p style="font-size:1.3rem"><b>${right} / ${list.length}</b> on the first try</p><div class="row" style="justify-content:center"><button class="btn sun" id="again">Play again</button><button class="btn soft" id="hm">Home</button></div></div>`),$("#again").onclick=()=>go("shuffleGame"),$("#hm").onclick=()=>go("home"))}}
      else{if(first)record(q,false);first=false;boop();$("#fb").className="fb bad";$("#fb").textContent="Almost! Tap a word to move it back.";}
    }
    draw();
  }
  show();
}

ur space, and your schoolwork without reminders.", "Responsibility builds trust, and trust earns you more freedom."], "qs": [{"q": "You promised Mom you'd clean your room, but friends want to play online. What's responsible?", "c": ["Clean first, then play.", "Play and hope she forgets.", "Shove everything under the bed."], "a": 0, "why": "Keeping your word first builds trust. Then you can play without worry."}, {"q": "You broke Papaw's tool by accident. What should you do?", "c": ["Tell him and offer to help fix or replace it.", "Hide it.", "Blame your sister."], "a": 0, "why": "Owning a mistake shows maturity. Papaw will respect your honesty."}, {"q": "A project is due Friday. It's Monday. What's the best plan?", "c": ["Break it into small parts and do a little each day.", "Wait until Thursday night.", "Ask someone else to do it."], "a": 0, "why": "Small steps each day beat a stressful last-minute rush."}, {"q": "Practice starts at 4:00. What does being responsible look like?", "c": ["Be there a few minutes early, ready to go.", "Show up at 4:15.", "Skip it if you don't feel like going."], "a": 0, "why": "Being early shows respect for your team and your coach."}], "challenge": "Pick one chore and do it every day this week without being reminded."}, {"id": "friends", "icon": "🤝", "title": "Making Friends", "color": "#3d7fd6", "intro": "Making friends is a skill, and like any skill, you get better with practice.", "ideas": ["Start small: smile, say hi, and use their name.", "Ask about them: “What games do you play?” “What music do you like?”", "Really listen, and remember what they told you next time.", "Join clubs, teams, or groups where people like the same things you do."], "qs": [{"q": "You're new in a class. What's a great first move?", "c": ["Say hi to the person next to you and ask their name.", "Wait for everyone to talk to you first.", "Keep your headphones on."], "a": 0, "why": "Friendships start with one small hello."}, {"q": "A classmate says they love basketball. What's a good follow-up?", "c": ["“Who's your favorite team?”", "“Basketball is boring.”", "Change the subject to yourself."], "a": 0, "why": "Asking about what they like shows you're interested in them."}, {"q": "You'd like to hang out with someone from school. What could you do?", "c": ["Invite them to play a game or shoot hoops.", "Hope they invite you someday.", "Post about it and wait."], "a": 0, "why": "Taking the first step is how friendships grow."}, {"q": "Your friend told you about their big game last week. What does a good friend do today?", "c": ["Ask, “How did your game go?”", "Forget about it.", "Talk only about your own week."], "a": 0, "why": "Remembering what matters to them shows you care."}], "challenge": "Start a conversation with someone new this week and ask them two questions about themselves."}, {"id": "talk", "icon": "💬", "title": "Talk It Out", "color": "#8a4fd1", "intro": "Keeping everything inside is like carrying a heavy backpack all day. Talking lets you set some of it down.", "ideas": ["All feelings are normal: sad, mad, worried, embarrassed. Having them doesn't make you weak.", "When you bottle things up, they usually get bigger, not smaller.", "Pick your people: Mom, Nana, Papaw, a coach, a counselor, or a good friend.", "Try this starter: “Can I talk to you about something?” That's all it takes."], "qs": [{"q": "Something at school has bothered you for days. What's the strongest move?", "c": ["Tell Mom or Nana what's going on.", "Keep it to yourself forever.", "Take it out on your sister."], "a": 0, "why": "Talking to someone you trust makes the problem lighter and easier to solve."}, {"q": "You feel angry and don't know why. What helps first?", "c": ["Take a few slow breaths, then say or write what you're feeling.", "Punch a wall.", "Ignore it and hope it goes away."], "a": 0, "why": "Naming a feeling helps your brain calm down so you can figure it out."}, {"q": "A friend says “I'm fine” but seems down. What can you do?" lasses like honors or AP show colleges?", "c": ["That you're ready for harder work", "That you don't like easy classes", "Nothing at all"], "a": 0, "why": "Colleges like to see students who challenge themselves."}, {"q": "What's a good weekly study habit?", "c": ["Review notes a little each day instead of cramming.", "Only study the night before tests.", "Study with the TV and phone on."], "a": 0, "why": "Short daily reviews help your brain remember much better than cramming."}], "challenge": "Check your grades online this week and make a plan for any class below a B."}, {"id": "study", "icon": "🗒️", "title": "Study Skills & Notes", "color": "#0f5fa8", "intro": "In college, nobody hands you a study guide. Learning how to study is the skill that powers every other skill.", "ideas": ["Take notes in your own words. Write main ideas, key terms, and examples, not every word.", "Try Cornell notes: notes on the right, questions on the left, a short summary at the bottom.", "Quiz yourself instead of just rereading. Flashcards and practice questions build real memory.", "Study in short, focused sessions: 25 minutes on, 5 minutes off, phone in another room."], "qs": [{"q": "What's the most effective way to study for a test?", "c": ["Quiz yourself with flashcards and practice questions.", "Reread your notes over and over.", "Highlight the whole chapter."], "a": 0, "why": "Testing yourself makes your brain pull the information out, and that builds memory."}, {"q": "What should good notes look like?", "c": ["Main ideas, key terms, and examples in your own words", "Every word the teacher says", "Only doodles"], "a": 0, "why": "Putting ideas in your own words shows you understand them."}, {"q": "When is the best time to review new notes?", "c": ["The same day, then again a few days later", "Only the night before the test", "Never"], "a": 0, "why": "Reviewing soon, then spacing it out, locks information in."}, {"q": "Where should your phone be while you study?", "c": ["In another room or out of sight", "In your hand", "Face up with notifications on"], "a": 0, "why": "Even a phone you can see pulls your focus away."}], "challenge": "Take Cornell notes in one class this week, and write a 3-sentence summary at the bottom of each page."}, {"id": "creading", "icon": "📘", "title": "College-Level Reading", "color": "#1f8a66", "intro": "College courses assign a lot of reading. Strong readers don't just read the words; they think while they read.", "ideas": ["Preview first: read the title, headings, bold words, and questions at the end.", "Read with a pencil: underline the main idea, circle new words, and write questions in the margin.", "After each section, stop and summarize it in one sentence.", "Figure out new words from context clues, then check the dictionary."], "qs": [{"q": "What should you do before reading a textbook chapter?", "c": ["Preview the title, headings, bold words, and end questions.", "Start reading the last page.", "Skip to the pictures only."], "a": 0, "why": "Previewing gives your brain a map, so the reading makes more sense."}, {"q": "You finish a paragraph and can't remember what it said. What's the best fix?", "c": ["Reread it and summarize it in one sentence.", "Keep going and hope it makes sense later.", "Stop reading for the day."], "a": 0, "why": "Summarizing checks your understanding before you move on."}, {"q": "What's the main idea of a passage?", "c": ["The most important point the author is making", "The first sentence, always", "The longest sentence"], "a": 0, "why": "The main idea is the central point. It isn't always in the first sentence."}, {"q": "You see an unfamiliar word. What's a strong first step?", "c": ["Use context clues from the sentences around it.", "Skip the whole paragraph.", "Guess randomly and move on."], "a": 0, "why": "Context clues often reveal the meaning, and that's a skill the ACT and SAT test too."}], "challenge": "Read one article or chapter this week with a pencil in hand. Write a one-sentence summary after every section."}, {"id": "writing", "icon": "✍️", "title": "Academic Writing", "color": "#b8457a", "intro": "College professors expect clear, organized writing that makes an argument and backs it up with evidence.", "ideas": ["Start with a thesis: one sentence that states your main claim.", "Build each paragraph with a topic sentence, evidence, and your explanation of that evidence.", "Use evidence from credible sources, and always give credit. Copying without credit is plagiarism.", "Revise: read it out loud, cut extra words, and check grammar and punctuation."], "qs": [{"q": "What is a thesis statement?", "c": ["One sentence that states the main claim of your essay", "A list of your sources", "The last sentence of every paragraph"], "a": 0, "why": "The thesis tells the reader exactly what your essay will argue."}, {"q": "What makes a body paragraph strong?", "c": ["A topic sentence, evidence, and your explanation", "Only quotes, with no explanation", "One long sentence"], "a": 0, "why": "Evidence needs your explanation to show how it proves your point."}, {"q": "You use an idea from a website in your essay. What must you do?", "c": ["Give credit by citing the source.", "Nothing, the internet is free to copy.", "Change one word and call it yours."], "a": 0, "why": "Using someone's words or ideas without credit is plagiarism, and colleges take it very seriously."}, {"q": "What's the best way to catch mistakes in your writing?", "c": ["Read it out loud slowly before you turn it in.", "Turn it in right away.", "Only check the first paragraph."], "a": 0, "why": "Reading aloud helps you hear missing words and awkward sentences."}], "challenge": "Write one paragraph that states a claim, gives two pieces of evidence, and explains each one."}, {"id": "thinking", "icon": "🔎", "title": "Critical Thinking & Research", "color": "#8a4fd1", "intro": "Critical thinkers ask questions, check facts, and make decisions based on evidence, not just on what they hear.", "ideas": ["Separate fact from opinion: a fact can be proven, and an opinion is what someone believes.", "Check your sources: who wrote it, when, and why? Is it trustworthy?", "Look for evidence on more than one side of an issue before you decide.", "Ask “How do we know that?” It's the most powerful question in any class."], "qs": [{"q": "Which statement is a fact?", "c": ["Water freezes at 32°F.", "Summer is the best season.", "Math is the hardest class."], "a": 0, "why": "A fact can be proven true. The others are opinions."}, {"q": "Which source is usually most reliable for a research paper?", "c": ["A published article from an expert or a trusted organization", "An anonymous social media post", "A random comment section"], "a": 0, "why": "Credible sources name their authors and back up their claims."}, {"q": "A headline makes a shocking claim. What should a critical thinker do?", "c": ["Check other trusted sources before believing or sharing it.", "Share it right away.", "Believe it because it sounds exciting."], "a": 0, "why": "Checking facts before sharing keeps you from spreading false information."}, {"q": "Why look at more than one side of an issue?", "c": ["To understand it fully and make a fair, well-supported decision", "To confuse yourself", "It isn't necessary"], "a": 0, "why": "Considering other viewpoints makes your own argument stronger."}], "challenge": "Pick one news story this week and find the same story from two different trusted sources. What was the same, and what was different?"}, {"id": "tests", "icon": "📝", "title": "ACT & SAT Game Plan", "color": "#8a4fd1", "intro": "The ACT and SAT are college entrance tests. With a plan and practice, you can raise your score.", "ideas": ["The SAT is taken on a computer and scored from 400 to 1600. It covers Reading and Writing, and Math.", "The ACT is scored from 1 to 36. Its core sections are English, Math, and Reading. Science and Writing are optional.", "Practice with free official tests: the Bluebook app for the SAT, and the practice tests on ACT.org for the ACT.", "Ask your school counselor when the ACT and SAT are offered and how to sign up."], "qs": [{"q": "What's the best way to prepare for the ACT or SAT?", "c": ["Take official practice tests and review every mistake.", "Memorize the answers from last year.", "Don't practice so you stay fresh."], "a": 0, "why": "Practicing with real-style tests and learning from mistakes raises scores."}, {"q": "On a question you're unsure about, what's a smart strategy?", "c": ["Cross out answers you know are wrong, then choose the best one left.", "Leave it blank.", "Always pick the longest answer."], "a": 0, "why": "Eliminating wrong answers raises your chances, and neither test takes points off for wrong answers."}, {"q": "What should you do the night before test day?", "c": ["Get a good night's sleep and pack what you need.", "Stay up late cramming.", "Play video games until 2 a.m."], "a": 0, "why": "Sleep helps your brain focus and remember."}, {"q": "If your first score isn't what you wanted, what can you do?", "c": ["Practice your weak areas and take it again.", "Give up on college.", "Never test again."], "a": 0, "why": "Many students raise their scores on a second or third try."}], "challenge": "Take one full practice section this week, then review every question you missed."}, {"id": "ready", "icon": "🎓", "title": "College-Ready Habits", "color": "#1f6fb2", "intro": "In college, nobody reminds you. Build the habits now that will help you win later.", "ideas": ["Use a planner or phone calendar for every assignment and deadline.", "Speak up for yourself: email teachers politely when you need help.", "Balance school, work, rest, and fun. Protect your sleep.", "Stay connected to family. Call home. They're your biggest fans."], "qs": [{"q": "How should you email a teacher about a missed assignment?", "c": ["Politely: greet them, explain briefly, and ask how you can make it up.", "“wat did i miss”", "Don't email. Just hope it's fine."], "a": 0, "why": "Clear, polite emails show maturity and get better results."}, {"q": "What's the best way to keep track of deadlines?", "c": ["A planner or calendar you check every day", "Trying to remember everything", "Waiting for reminders"], "a": 0, "why": "Writing it down means nothing slips through the cracks."}, {"q": "You have a big test and your friends want to go out. What's a college-ready choice?", "c": ["Study first, then hang out for a little while if there's time.", "Go out and skip studying.", "Stay up all night doing both."], "a": 0, "why": "Balance means doing what matters first."}, {"q": "Why keep in touch with family when you're away at school?", "c": ["They support you and help you through hard times.", "You don't need to.", "Only when you need money."], "a": 0, "why": "Family is your team, no matter where you go."}], "challenge": "Set up a planner or phone calendar this week and add every upcoming assignment and test."}], "test": {"vocab": {"name": "Vocabulary in Context", "icon": "📚", "style": "SAT Reading & Writing / ACT Reading", "qs": [{"q": "Which word completes the text most logically? The scientist's findings were first met with doubt, but after other labs repeated her results, experts came to regard her conclusions as ______.", "c": ["credible", "dubious", "obscure", "trivial"], "a": 0, "why": "Other labs got the same results, so experts came to trust them. Credible means believable."}, {"q": "Which word completes the text most logically? Although the novelist is known for long, sprawling books, her latest work is surprisingly ______, telling its whole story in just ninety pages.", "c": ["concise", "verbose", "elaborate", "tedious"], "a": 0, "why": "“Although” signals a contrast with “long, sprawling.” Concise means short and to the point."}, {"q": "Which word completes the text most logically? Because the historian relied on letters written at the time of the events, her account is based on ______ sources rather than later retellings.", "c": ["primary", "secondary", "fictional", "anonymous"], "a": 0, "why": "Primary sources are firsthand records from the time of the events."}, {"q": "Which word completes the text most logically? The coach praised the team's ______: even after falling behind by twenty points, the players never stopped fighting.", "c": ["tenacity", "apathy", "arrogance", "timidity"], "a": 0, "why": "Never stopping shows tenacity, which means determination."}, {"q": "Which word completes the text most logically? The instructions were so ______ that even experienced builders could not agree on what the first step was.", "c": ["ambiguous", "explicit", "brief", "accurate"], "a": 0, "why": "If experts can't agree on the meaning, the instructions are unclear, or ambiguous."}, {"q": "Which word completes the text most logically? Rather than ______ the problem, the committee chose to face it directly.", "c": ["evade", "address", "examine", "solve"], "a": 0, "why": "“Rather than … face it directly” signals the opposite: evade means avoid."}, {"q": "Which word completes the text most logically? The drought had a ______ effect on local farms; crop yields fell by nearly half.", "c": ["detrimental", "negligible", "beneficial", "temporary"], "a": 0, "why": "Crops falling by half is harmful. Detrimental means causing harm."}, {"q": "Which word completes the text most logically? In her speech, the senator tried to ______ voters' concerns by explaining exactly how the new law would protect them.", "c": ["allay", "provoke", "ignore", "exaggerate"], "a": 0, "why": "Explaining how people are protected eases their worries. Allay means to calm or ease."}, {"q": "Which word completes the text most logically? The two theories were ______: if one was correct, the other could not be.", "c": ["incompatible", "identical", "complementary", "unrelated"], "a": 0, "why": "If both can't be true at once, they are incompatible."}, {"q": "Which word completes the text most logically? The documentary offers a ______ look at life in the Arctic, showing both its beauty and its hardships without exaggeration.", "c": ["balanced", "biased", "superficial", "sensational"], "a": 0, "why": "Showing both sides without exaggeration is balanced."}, {"q": "As used in the sentence, what does “novel” most nearly mean? The engineers proposed a novel solution that no one had ever tried before.", "c": ["new and original", "book-length", "fictional", "expensive"], "a": 0, "why": "“No one had ever tried before” shows that novel here means new."}, {"q": "As used in the sentence, what does “grave” most nearly mean? The doctor spoke in a grave voice as she explained the test results.", "c": ["serious", "buried", "loud", "cheerful"], "a": 0, "why": "A doctor explaining test results in a grave voice sounds serious."}]}, "grammar": {"name": "Grammar & Usage", "icon": "✏️", "style": "ACT English / SAT Standard English", "qs": [{"q": "Choose the best replacement for the bracketed words: The team of engineers [were] working late to finish the bridge design.", "c": ["was", "NO CHANGE", "have been", "are"], "a": 0, "why": "The subject is “team,” which is singular, so the verb is “was.” “Of engineers” doesn't change it."}, {"q": "Choose the best version: Maya loves to paint[; she] spends every Saturday at the art studio.", "c": ["NO CHANGE", "paint, she", "paint she", "paint, and, she"], "a": 0, "why": "A semicolon correctly joins two complete sentences. A comma alone would create a comma splice."}, {"q": "Choose the best version: The museum, which opened in 1998[,] attracts thousands of visitors each year.", "c": ["NO CHANGE", "1998", "1998;", "1998:"], "a": 0, "why": "The extra information “which opened in 1998” needs a comma on both sides."}, {"q": "Choose the best replacement: Neither the coach nor the players [was] ready for the storm.", "c": ["were", "NO CHANGE", "is", "has been"], "a": 0, "why": "With “neither … nor,” the verb agrees with the closer subject, “players,” so use “were.”"}, {"q": "Choose the best version: Running down the hallway, [the backpack fell off Jordan's shoulder.]", "c": ["Jordan felt his backpack slide off his shoulder.", "NO CHANGE", "the backpack fell off of Jordan's shoulder.", "Jordan's backpack fell off his shoulder."], "a": 0, "why": "The opening phrase must describe the person running. The correct choice puts Jordan right after the comma."}, {"q": "Choose the best transition: The new library stays open later. [However,] it offers free tutoring on weekends.", "c": ["Additionally,", "NO CHANGE", "Nevertheless,", "In contrast,"], "a": 0, "why": "The second sentence adds another benefit, so “Additionally” fits. “However” signals a contrast that isn't there."}, {"q": "Choose the best transition: Many students expected the test to be difficult. [For example,] most found it easier than they feared.", "c": ["However,", "NO CHANGE", "Similarly,", "Therefore,"], "a": 0, "why": "The second sentence contrasts with the first, so “However” fits."}, {"q": "Choose the best version: She [returned back] to her hometown after college.", "c": ["returned", "NO CHANGE", "went back and returned", "returned again back"], "a": 0, "why": "“Returned” already means “went back,” so “back” is repetitive. Shorter is better when the meaning is the same."}, {"q": "Choose the best version: The camp offers swimming, hiking, and [to paddle a canoe].", "c": ["canoeing", "NO CHANGE", "you can canoe", "to go canoeing"], "a": 0, "why": "Items in a list should match in form: swimming, hiking, canoeing."}, {"q": "Choose the best replacement: The award was shared by Keisha and [I].", "c": ["me", "NO CHANGE", "myself", "mine"], "a": 0, "why": "After the word “by,” use the object pronoun “me.” Test it alone: “shared by me.”"}, {"q": "Choose the best replacement: By the time the concert started, the band [practices] for six hours.", "c": ["had practiced", "NO CHANGE", "will practice", "is practicing"], "a": 0, "why": "An action finished before another past event uses the past perfect: “had practiced.”"}, {"q": "Choose the best replacement: The team celebrated [it's] first championship.", "c": ["its", "NO CHANGE", "its'", "it is"], "a": 0, "why": "“Its” shows ownership. “It's” means “it is.”"}, {"q": "Choose the best version: The recipe calls for three ingredients[:] flour, sugar, and butter.", "c": ["NO CHANGE", "ingredients;", "ingredients, and", "ingredients so"], "a": 0, "why": "A colon correctly introduces a list after a complete sentence."}, {"q": "Which choice is most concise and clear? ", "c": ["The meeting was canceled because of rain.", "The meeting was canceled due to the fact that it was raining outside.", "Because of the rain that was falling, the meeting was canceled and did not happen.", "The meeting, because of rain falling, was canceled."], "a": 0, "why": "Choose the shortest version that keeps the full meaning."}]}, "lit": {"name": "Literature & Reading", "icon": "📖", "style": "ACT Reading (Literary Narrative) / SAT Craft & Structure", "qs": [{"q": "Based on the passage, Grandpa Eli is best described as…", "c": ["patient and reflective", "impatient and demanding", "nervous and unsure", "boastful and competitive"], "a": 0, "why": "He never hurried, fished quietly, and smiled at complaints. That shows patience.", "p": "Grandpa Eli never hurried. He fished the way other men prayed, quietly and with his whole attention. When I complained that the fish weren't biting, he only smiled and handed me the thermos. “The river doesn't owe us anything,” he said. “We come to listen.” It took me years to understand that the fish were never the point."}, {"q": "The comparison “He fished the way other men prayed” mainly suggests that Grandpa Eli…", "c": ["treats fishing as something peaceful and meaningful", "goes to church every day", "fishes very quickly", "dislikes fishing"], "a": 0, "why": "Comparing fishing to prayer shows it is calm, focused, and important to him.", "p": "Grandpa Eli never hurried. He fished the way other men prayed, quietly and with his whole attention. When I complained that the fish weren't biting, he only smiled and handed me the thermos. “The river doesn't owe us anything,” he said. “We come to listen.” It took me years to understand that the fish were never the point."}, {"q": "What does the narrator mean by “the fish were never the point”?", "c": ["The time together and the lessons mattered more than catching fish.", "They never caught a single fish.", "Fishing is a waste of time.", "Grandpa Eli didn't like eating fish."], "a": 0, "why": "“Never the point” means the real value was the experience, not the fish.", "p": "Grandpa Eli never hurried. He fished the way other men prayed, quietly and with his whole attention. When I complained that the fish weren't biting, he only smiled and handed me the thermos. “The river doesn't owe us anything,” he said. “We come to listen.” It took me years to understand that the fish were never the point."}, {"q": "When Tamara hears someone playing her piece, she most likely feels…", "c": ["doubtful and intimidated", "bored", "relieved", "angry at her mother"], "a": 0, "why": "Hearing someone play her piece perfectly, and tightening her grip, shows nervousness.", "p": "The rain had followed Tamara all the way from the bus stop, and by the time she reached the audition hall, her carefully pressed shirt clung to her like a second skin. She paused at the door. Inside, someone was playing her piece, the same piece, flawlessly. Tamara's hand tightened on the door handle. Then she remembered her mother's voice: “Nobody else can play it like you.” She pushed the door open."}, {"q": "The detail that her shirt “clung to her like a second skin” mainly shows that…", "c": ["the rain had soaked her", "she bought new clothes", "she was cold-hearted", "the audition was over"], "a": 0, "why": "The shirt clinging “like a second skin” shows it was soaking wet.", "p": "The rain had followed Tamara all the way from the bus stop, and by the time she reached the audition hall, her carefully pressed shirt clung to her like a second skin. She paused at the door. Inside, someone was playing her piece, the same piece, flawlessly. Tamara's hand tightened on the door handle. Then she remembered her mother's voice: “Nobody else can play it like you.” She pushed the door open."}, {"q": "Remembering her mother's words serves as the passage's…", "c": ["turning point, when Tamara chooses courage", "introduction of the setting", "description of the weather", "ending of the audition"], "a": 0, "why": "Remembering her mother's words changes her decision. That's the turning point.", "p": "The rain had followed Tamara all the way from the bus stop, and by the time she reached the audition hall, her carefully pressed shirt clung to her like a second skin. She paused at the door. Inside, someone was playing her piece, the same piece, flawlessly. Tamara's hand tightened on the door handle. Then she remembered her mother's voice: “Nobody else can play it like you.” She pushed the door open."}, {"q": "Which theme is best supported by the passage?", "c": ["Believing in yourself can help you face fear.", "Rainy days ruin everything.", "New clothes bring success.", "You should win at any cost."], "a": 0, "why": "Tamara overcomes her doubt by remembering someone who believes in her.", "p": "The rain had followed Tamara all the way from the bus stop, and by the time she reached the audition hall, her carefully pressed shirt clung to her like a second skin. She paused at the door. Inside, someone was playing her piece, the same piece, flawlessly. Tamara's hand tightened on the door handle. Then she remembered her mother's voice: “Nobody else can play it like you.” She pushed the door open."}, {"q": "The phrase “argues with the sky in green” is an example of…", "c": ["personification", "onomatopoeia", "alliteration", "hyperbole"], "a": 0, "why": "Trees can't really argue. Giving a human action to the tree is personification.", "p": "The oak outside my window / has lost a hundred storms— / still, every April, / it argues with the sky / in green."}, {"q": "In the poem, the tree is best described as…", "c": ["resilient, returning to life after hardship", "weak and dying", "afraid of storms", "newly planted"], "a": 0, "why": "It survives many storms and grows green again every spring. That's resilience.", "p": "The oak outside my window / has lost a hundred storms— / still, every April, / it argues with the sky / in green."}, {"q": "In the poem, the word “still” mainly signals…", "c": ["that the tree keeps growing despite the storms", "that the tree is not moving", "that the weather is calm", "that the poem is ending"], "a": 0, "why": "“Still” here means “even so,” showing the tree continues in spite of hardship.", "p": "The oak outside my window / has lost a hundred storms— / still, every April, / it argues with the sky / in green."}]}}, "tips": [{"k": "kindness", "t": "Kindness is free, and it always comes back around. Who can you be kind to today?"}, {"k": "responsibility", "t": "Responsibility means doing what you said you'd do, even when nobody is watching."}, {"k": "initiative", "t": "Champions don't wait to be told. Ask Mom what you can help with before she asks you."}, {"k": "initiative", "t": "Your little sister watches everything you do. Be the big brother she brags about."}, {"k": "initiative", "t": "Nana and Papaw love hearing from you. A quick call makes their whole day."}, {"k": "friends", "t": "Want to make a friend? Say hi first, ask a question, and really listen to the answer."}, {"k": "goodfriend", "t": "A good friend shows up, keeps their word, and has your back when things get tough."}, {"k": "compassion", "t": "Sit with someone who's sitting alone. That one move can change somebody's whole day."}, {"k": "talk", "t": "Don't keep it all inside. Talking to Mom, Nana, or a friend makes heavy things lighter."}, {"k": "talk", "t": "Strong people ask for help. Saying I'm having a hard day takes real courage."}, {"k": "time", "t": "Game time is great, but family, school, and friends come first. Keep your priorities in order."}, {"k": "time", "t": "Homework first, then play. Future Cayden will thank you."}, {"k": "calm", "t": "Feeling nervous? Try box breathing. In for four, hold for four, out for four, hold for four."}, {"k": "calm", "t": "When worry shows up, name five things you can see. It brings your mind back to right now."}, {"k": "compassion", "t": "Everyone is fighting a battle you can't see. Lead with kindness."}, {"k": "compassion", "t": "Be the first to say hello. Confidence grows every time you try."}, {"k": "gpa", "t": "Every class counts toward college, starting in ninth grade. Stack those wins."}, {"k": "study", "t": "Study tip: quiz yourself instead of rereading. That's how your brain really remembers."}, {"k": "creading", "t": "Strong readers stop after each section and sum it up in one sentence."}, {"k": "writing", "t": "Every strong essay starts with a clear thesis: one sentence that says what you're proving."}, {"k": "thinking", "t": "Critical thinkers always ask one question: how do we know that?"}, {"k": "tests", "t": "On the ACT and SAT, cross out the answers you know are wrong. Then pick the best one left."}, {"k": "ready", "t": "College-ready habit: write every assignment in a planner, so nothing slips through the cracks."}, {"k": "late", "t": "Early is on time, and on time is late. Pack your bag the night before."}, {"k": "room", "t": "Try the ten-minute room reset: trash out, clothes away, bed made."}, {"k": "health", "t": "Sleep is your recharge. Phone away an hour before bed."}], "barks": ["Keep going!", "Keep playing!", "You got this!", "Don't quit now!", "Let's gooo!", "I believe in you!", "One more!", "Proud of you, best friend!", "Nice one!", "That's my buddy!"], "quests": ["Ask Mom, “What can I help with?” before she asks you.", "Carry in the groceries or help put them away.", "Read a book or play a game with your little sister. She picks!", "Help your little sister with her homework, and be patient.", "Call or FaceTime Nana and Papaw and ask about their day.", "Help Papaw with a yard or garage job.", "Help Nana in the kitchen or set the table.", "Take out the trash without being asked.", "Clean up after dinner and wipe the table.", "Write Mom a thank-you note for something she did.", "Hold the door for someone and say good morning to a teacher.", "Invite someone new to sit with you or join your game.", "Check on a friend who seemed down.", "Put your phone away during family dinner.", "Make your bed and tidy your room before school.", "Give Nana and Papaw a big hug and tell them one thing you love about them."], "skits": [{"id": "late", "icon": "⏰", "title": "Late Again?", "color": "#1f6fb2", "intro": "Early is on time, and on time is late. Being on time shows people you respect them.", "scenes": [{"who": "narr", "props": "😴⏰", "line": "7:42 a.m. Cayden's alarm has been going off for twenty minutes. The bus comes at 7:50."}, {"who": "luna", "props": "🐶⏰", "line": "Wake up, best friend! The bus is coming!"}, {"who": "narr", "props": "🏃‍♂️🚌💨", "line": "Cayden runs out the door with one shoe on, and the bus pulls away without him."}, {"who": "coach", "props": "🏫🕗", "line": "Cayden, being late tells people their time doesn't matter. Being on time tells them you respect them. In my book, early is on time, and on time is late."}, {"who": "nana", "props": "🎒👕🌙", "line": "Here's the secret, baby. Get ready the night before. Lay out your clothes, pack your bag, and charge your phone before bed."}, {"who": "coach", "props": "⏰⏰", "line": "Set two alarms, and put one across the room so you have to get up. Then give yourself ten extra minutes."}, {"who": "luna", "props": "🐾✅", "line": "If you're going to be late, tell someone right away!"}], "ideas": ["Early is on time. Plan to arrive 5 to 10 minutes before you need to be there.", "Get ready the night before: clothes, backpack, c function synthBark(n=2){const c=ctx();if(!c)return;
  for(let k=0;k<n;k++){const t=c.currentTime+k*.26;
    try{
      const o=c.createOscillator(),o2=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
      o.type="sawtooth";o2.type="square";
      o.frequency.setValueAtTime(330,t);o.frequency.linearRampToValueAtTime(560,t+.035);o.frequency.exponentialRampToValueAtTime(230,t+.16);
      o2.frequency.setValueAtTime(165,t);o2.frequency.linearRampToValueAtTime(280,t+.035);o2.frequency.exponentialRampToValueAtTime(115,t+.16);
      f.type="bandpass";f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(600,t+.16);f.Q.value=2.2;
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.32,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.19);
      const g2=c.createGain();g2.gain.value=.35;o2.connect(g2).connect(f);o.connect(f);f.connect(g).connect(c.destination);
      o.start(t);o2.start(t);o.stop(t+.22);o2.stop(t+.22);
      const len=Math.floor(c.sampleRate*.08),bf=c.createBuffer(1,len,c.sampleRate),dd=bf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
      const nz=c.createBufferSource();nz.buffer=bf;const nf=c.createBiquadFilter();nf.type="bandpass";nf.frequency.value=1400;nf.Q.value=1.5;const ng=c.createGain();ng.gain.value=.14;
      nz.connect(nf).connect(ng).connect(c.destination);nz.start(t);
    }catch(e){}}}

const LUNA_BARKS=[[0.1, 0.255], [0.705, 0.285], [1.34, 0.335], [2.025, 0.255], [2.63, 0.255]];let lunaBuf=null;

function barkSound(n=2){const c=ctx();if(!c)return;if(!lunaBuf)return synthBark(n);
  let t=c.currentTime+.02;
  for(let k=0;k<n;k++){let i;do{i=Math.floor(Math.random()*LUNA_BARKS.length)}while(i===lastBark&&LUNA_BARKS.length>1);lastBark=i;
    const [st,du]=LUNA_BARKS[i];const src=c.createBufferSource(),g=c.createGain();src.buffer=lunaBuf;src.playbackRate.value=.96+Math.random()*.08;g.gain.value=.9;
    src.connect(g).connect(c.destination);src.start(t,st,du);t+=du*.72+Math.random()*.05}}

    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn sun" id="ok">OK, see you tomorrow!</button><button class="btn soft" id="more">Family says OK (+15 min)</button></div>`);
  sayCoach("That's today's game time! Family, school, and friends come first. See you tomorrow!");
  $("#ok",o).onclick=()=>{o.remove();go("home");limitShown=true};
  $("#more",o).onclick=()=>{o.remove();gate(()=>{S.extra[dayKey()]=(S.extra[dayKey()]||0)+15;save();limitShown=false;toast("+15 minutes added for today");go("home")})};
}

/* --- Breathe with Luna --- */
function breathe(){
  h(`<h2>🧘 Breathe with Luna</h2><p class="sub">Box breathing calms your body and mind. Follow the square: in, hold, out, hold. Four rounds.</p>
    <div class="panel" style="text-align:center"><div class="boxwrap"><div class="boxdot" id="bd"></div><span class="calmluna">${LUNA_SVG}</span></div>
    <p class="bstep" id="bs">Tap Start when you're ready</p><p class="small" id="br"></p>
    <div class="row" style="justify-content:center"><button class="btn sun" id="bgo">▶ Start</button><button class="btn soft" id="bst">■ Stop</button></div></div>
    <div class="panel" style="margin-top:12px"><b>5-4-3-2-1 grounding</b><p class="small" style="margin:4px 0">When worry feels big, name: <b>5</b> things you see · <b>4</b> you can touch · <b>3</b> you hear · <b>2</b> you smell · <b>1</b> you taste.</p><p class="small">If worry feels too big or won't go away, talk to Mom, Nana, Papaw, or a school counselor. Asking for help is a strong move.</p></div>`);
  let timer=null;const steps=["Breathe in…","Hold…","Breathe out…","Hold…"];
  $("#bgo").onclick=()=>{clearInterval(timer);let n=0,sec=0;const bd=$("#bd");
    const tick=()=>{if(!document.body.contains(bd)){clearInterval(timer);return}
      const st=Math.floor(n/4)%4,round=Math.floor(n/16)+1;if(round>4){clearInterval(timer);$("#bs").textContent="Great job. Notice how you feel now. 💙";$("#br").textContent="";bd.className="boxdot";lunaBark("So calm! Proud of you!");return}
      if(n%4===0){$("#bs").textContent=steps[st];bd.className="boxdot s"+st;tone(st===0?392:st===2?330:0||262,0,.25,.04,"sine")}
      $("#br").textContent=`Round ${round} of 4 · ${4-(n%4)}`;n++};
    tick();timer=setInterval(tick,1000)};
  $("#bst").onclick=()=>{clearInterval(timer);$("#bs").textContent="Stopped. Tap Start any time.";$("#bd").className="boxdot"};
}

/* --- lesson lists and lesson screens --- */
function lessonTiles(list,route,store){return list.map(l=>{const r=store[l.id];return `<button class="tile" data-r="${route}" data-a="${l.id}" style="--c:${l.color}"><span class="ic">${l.icon}</span><b>${esc(l.title)}</b><small>${r&&r.best!=null?`Best ${r.best}/${l.qs.length}${r.ch?" · ✔ challenge":""}`:"New"}</small></button>`}).join("")}
function lifeHub(){
  h(`<h2>🐾 Life Skills with Luna</h2><p class="sub">Being a great person is a skill too. Learn it, practice it, live it.</p>
    <div class="tiles">${lessonTiles(LS.life,"lifeLesson",S.life)}<button class="tile" data-r="breathe" data-a="" style="--c:#5b6ee1"><span class="ic">🌬️</span><b>Breathe with Luna</b><small>Calm down in 1 minute</small></button></div>`);
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>go(b.dataset.r,b.dataset.a));
  lunaBark("Let's learn together!");
}
function collegeHub(){
  h(`<h2>🎓 College Prep</h2><p class="sub">Build the academic skills college requires: studying, reading, writing, and thinking. Then practice for the ACT and SAT.</p>
    <div class="tiles">${lessonTiles(LS.college,"collegeLesson",S.college)}</div>
    <h2 class="sec">ACT & SAT Practice <span class="small">original practice in the style of the real tests</span></h2>
    <div class="tiles">${Object.entries(LS.test).map(([k,t])=>{const r=S.tests[k];return `<button class="tile" data-r="testSet" data-a="${k}" style="--c:#4a2a86"><span class="ic">${t.icon}</span><b>${esc(t.name)}</b><small>${r?`Best ${r.best}/${t.qs.length}`:t.style}</small></button>`}).join("")}
      <button class="tile" data-r="testSet" data-a="mixed" style="--c:#101c4a"><span class="ic">🎯</span><b>Mixed Practice</b><small>15 questions from all three</small></button></div>`);
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>go(b.dataset.r,b.dataset.a));
}
function lessonScreen(l,kind,store,back){
  h(`<h2>${l.icon} ${esc(l.title)}</h2>
    <div class="panel lessonintro"><span class="qluna">${LUNA_SVG}</span><span><b>Coach Croom & Luna</b><span class="bubble">“${esc(l.intro)}”</span></span></div>
    <div class="panel" style="margin-top:12px"><b>🏀 Game plan</b><ul class="ideas">${l.ideas.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
    <div class="row"><button class="btn soft" id="hear">🔊 Hear it</button>${l.id==="calm"?`<button class="btn soft" id="br">🌬️ Breathe with Luna</button>`:""}</div></div>
    <div class="panel" style="margin-top:12px"><b>🎯 This week's challenge</b><p style="margin:4px 0">${esc(l.challenge)}</p>${store[l.id]&&store[l.id].ch?`<span class="bellmsg">✔ Challenge completed!</span>`:`<button class="btn soft" id="chd">✓ I did the challenge</button>`}</div>
    <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn soft" id="bk">◀ All lessons</button><button class="btn sun" id="qs">What would you do? ▶</button></div>`);
  sayCoach(l.intro);
  $("#hear").onclick=()=>sayCoach([l.intro,...l.ideas]);
  const brb=$("#br");if(brb)brb.onclick=()=>go("breathe");
  $("#bk").onclick=()=>go(back);
  const chd=$("#chd");if(chd)chd.onclick=()=>{const r=store[l.id]||(store[l.id]={});r.ch=true;addXP(25);S.coins=(S.coins||0)+5;save();celebrate();lunaBark("Proud of you, best friend!",{say:"Challenge complete! That's how champions grow."});toast("+25 XP · 🪙 +5 coins");lessonScreen(l,kind,store,back)};
  $("#qs").onclick=()=>{stopTalking();
    const pool=l.qs.map((q,i)=>({...q,id:`${kind}-${l.id}-${i}`,skill:kind}));
    runQuiz(pool,`${l.icon} ${esc(l.title)}`,(right,total)=>{const r=store[l.id]||(store[l.id]={});r.best=Math.max(r.best||0,right);r.last=right;save();celebrate();chime();lunaZoom();
      h(`<h2>Nice work! ${l.icon}</h2><div class="panel" style="text-align:center"><p style="font-size:1.3rem"><b>${right} / ${total}</b> smart choices on the first try</p><p><b>🎯 Your challenge:</b> ${esc(l.challenge)}</p>
        <div class="row" style="justify-content:center"><button class="btn sun" id="bk2">Back to the lesson</button><button class="btn soft" id="hm">More lessons</button></div></div>`);
      nanaThenCoach("Round complete!","Now go put it into action this week.");$("#bk2").onclick=()=>lessonScreen(l,kind,store,back);$("#hm").onclick=()=>go(back)});
  };
}
function lifeLesson(id){const l=LS.life.find(x=>x.id===id);if(!l)return go("lifeHub");lessonScreen(l,"life",S.life,"lifeHub")}
function collegeLesson(id){const l=LS.college.find(x=>x.id===id);if(!l)return go("collegeHub");lessonScreen(l,"college",S.college,"collegeHub")}
function testSet(k){
  let pool,name;
  if(k==="mixed"){pool=shuffle(Object.entries(LS.test).flatMap(([kk,t])=>t.qs.map((q,i)=>({...q,id:`test-${kk}-${i}`,skill:"test-"+kk})))).slice(0,15);name="🎯 Mixed ACT/SAT Practice"}
  else{const t=LS.test[k];if(!t)return go("collegeHub");pool=shuffle(t.qs.map((q,i)=>({...q,id:`test-${k}-${i}`,skill:"test-"+k})));name=`${t.icon} ${t.name}`}
  runQuiz(pool,name,(right,total)=>{if(k!=="mixed"){const r=S.tests[k]||(S.tests[k]={best:0});r.best=Math.max(r.best,right);r.last=right}else{S.tests.mixed={best:Math.max((S.tests.mixed&&S.tests.mixed.best)||0,right),last:right}}
    addXP(right*3);save();celebrate();chime();lunaZoom();
    const pct=Math.round(right/total*100);
    h(`<h2>Practice complete! 📝</h2><div class="panel" style="text-align:center"><p style="font-size:1.3rem"><b>${right} / ${total}</b> (${pct}%)</p><p>${pct>=80?"Excellent! You're test-ready in this area.":pct>=60?"Solid work. Review the explanations and try again.":"Every miss is a lesson. Read the explanations, then run it back."}</p>
      <p class="small">These are original practice questions in the style of the ACT and SAT. For full official practice tests, use the free Bluebook app (SAT) and ACT.org.</p>
      <div class="row" style="justify-content:center"><button class="btn sun" id="ag">Practice again</button><button class="btn soft" id="bk">College Prep</button></div></div>`);
    nanaThenCoach("Round complete!",pct>=80?"Nailed it! You are test-ready.":"Keep going. Every question makes you stronger.");$("#ag").onclick=()=>go("testSet",k);$("#bk").onclick=()=>go("collegeHub")});
}
Object.assign(ROUTES,{lifeHub,lifeLesson,collegeHub,collegeLesson,testSet,breathe});
/* --- Life Skits: short animated scenes with Coach Croom, Nana and Luna --- */
S.skits=S.skits||{};
function actorSvg(w){return w==="coach"?COACH_SVG:w==="nana"?NANA_SVG:w==="luna"?LUNA_SVG:""}
function actorName(w){return w==="coach"?"Coach Croom":w==="nana"?"Nana":w==="luna"?"Luna":""}
function skitHub(){
  h(`<h2>🎬 Life Skits</h2><p class="sub">Watch Coach Croom, Nana, and Luna act it out, then make your game plan.</p>
    <div class="tiles">${LS.skits.map(k=>{const r=S.skits[k.id];return `<button class="tile" data-a="${k.id}" style="--c:${k.color}"><span class="ic">${k.icon}</span><b>${esc(k.title)}</b><small>${r&&r.best!=null?`Best ${r.best}/${k.qs.length}${r.ch?" · ✔ challenge":""}`:"▶ Watch"}</small></button>`}).join("")}</div>`);
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>go("skit",b.dataset.a));
}
function skit(id){
  const k=LS.skits.find(x=>x.id===id);if(!k)return go("skitHub");
  let n=0,playing=true,timer=null;
  h(`<h2>${k.icon} ${esc(k.title)}</h2><p class="sub">A Life Skit · ${k.scenes.length} scenes</p>
    <div class="stage" id="stg"><div class="props" id="props"></div><div class="actor" id="act"></div><div class="sbub" id="sb"></div></div>
    <div class="sdots">${k.scenes.map((_,j)=>`<i data-j="${j}"></i>`).join("")}</div>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn soft" id="pv">◀</button><button class="btn soft" id="pp">⏸ Pause</button><button class="btn soft" id="nx">▶</button></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sun" id="gp">Game plan & questions ▶</button></div>`);
  const stg=$("#stg");
  const alive=()=>document.body.contains(stg);
  function next(ms){clearTimeout(timer);timer=setTimeout(()=>{if(!alive()||!playing)return;if(n<k.scenes.length-1){n++;show()}else end()},ms)}
  function end(){if(!alive())return;playing=false;$("#pp").textContent="↺ Replay";const r=S.skits[k.id]||(S.skits[k.id]={});r.watched=true;save();lunaZoom();$("#gp").classList.add("hintme2")}
  function show(){
    if(!alive())return;const sc=k.scenes[n];
    app.querySelectorAll(".sdots i").forEach((d,j)=>d.className=j<n?"done":j===n?"cur":"");
    const segs=(window.Intl&&Intl.Segmenter)?[...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(sc.props)].map(x=>x.segment).filter(x=>x.trim()):[sc.props];
    $("#props").innerHTML=segs.map((g,j)=>`<span style="animation-delay:${j*.18}s">${g}</span>`).join("");
    const act=$("#act"),sb=$("#sb");
    act.className="actor "+sc.who;act.innerHTML=actorSvg(sc.who);void act.offsetWidth;act.classList.add("enter");
    const side=sc.who==="nana"?"left":"right";
    sb.className="sbub "+(sc.who==="narr"?"narr":side);
    sb.innerHTML=sc.who==="narr"?esc(sc.line):sc.who==="luna"?`<b>WOOF! WOOF!</b><span>(${esc(sc.line)})</span>`:`<b>${actorName(sc.who)}</b><span>${esc(sc.line)}</span>`;
    if(sc.who==="luna"){barkSound(3);const l=act.querySelector(".luna");if(l){l.classList.add("barking");setTimeout(()=>l.classList.remove("barking"),700)}}
    const readMs=1800+sc.line.length*55;
    if(S.voice&&sc.who!=="luna"){let done=false;const fin=()=>{if(done)return;done=true;next(900)};setTimeout(()=>(sc.who==="coach"?sayCoach:say)(sc.line,{onend:fin}),150);setTimeout(fin,readMs+6000)}
    else next(readMs);
  }
  $("#pp").onclick=()=>{if(!playing&&n>=k.scenes.length-1){n=0;playing=true;$("#pp").textContent="⏸ Pause";show();return}playing=!playing;$("#pp").textContent=playing?"⏸ Pause":"▶ Play";if(playing)show();else{clearTimeout(timer);stopTalking()}};
  $("#nx").onclick=()=>{clearTimeout(timer);stopTalking();if(n<k.scenes.length-1){n++;show()}else end()};
  $("#pv").onclick=()=>{clearTimeout(timer);stopTalking();if(n>0)n--;show()};
  $("#gp").onclick=()=>{playing=false;clearTimeout(timer);stopTalking();lessonScreen(k,"skits",S.skits,"skitHub")};
  show();
}
Object.assign(ROUTES,{skitHub,skit});

home();
loadVoicePack();
