<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Princess RhyLein's Reading Magic</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reading Magic">
<meta name="theme-color" content="#8a1f5b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --plum:#8a1f5b; --plum-deep:#5c1140; --lilac:#fbe6f1; --lilac-2:#f5cfe3;
  --gold:#f4b23c; --gold-soft:#fff3d6; --rose:#e8588a; --mint:#2f9e7a; --mint-soft:#dcf3ea;
  --sky:#3d7fd6; --ink:#2a1840; --ink-2:#5d4a78; --paper:#fffaf2; --card:#ffffff; --line:#e4d7f3;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Century Gothic","Avenir Next",system-ui,sans-serif;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,#f6ecff 0,transparent 38%),radial-gradient(circle at 92% 30%,#fff1d9 0,transparent 32%);
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:6px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--plum);display:flex;align-items:center;gap:8px;margin-right:auto;line-height:1.1}
.brand .crown{width:40px;height:40px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:.95rem;min-height:44px}
.pill[aria-pressed="false"]{opacity:.55}
.home-btn{background:var(--plum);color:#fff;border-color:var(--plum)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(160deg,#a8327a,#5c1140);color:#fff;border-radius:28px;padding:22px;position:relative;overflow:hidden}
.hero h1{font-family:var(--display);font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.05;margin:0 0 4px;text-wrap:balance}
.hero p{margin:0;font-size:1.1rem;opacity:.95}
.hero{grid-template-columns:1fr!important;text-align:center}.hero .heroimg{width:100%;max-width:600px;margin-inline:auto;aspect-ratio:16/9;object-fit:cover;border-radius:20px;display:block;box-shadow:0 6px 18px rgba(0,0,0,.25)}.hero .stats,.hero .row{justify-content:center}
.spark{position:absolute;color:var(--gold);font-size:18px;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{background:rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:18px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:center;min-height:96px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{grid-row:span 2;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px}
.tile b{font-family:var(--display);font-size:1.25rem;line-height:1.1}
.tile small{color:var(--ink-2);font-size:.9rem;line-height:1.3}
.tile.new{border-color:var(--gold);background:var(--gold-soft)}
.tag{display:inline-block;background:var(--rose);color:#fff;font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}
.note{margin-top:16px;color:var(--ink-2);text-align:center}

/* screens */
.screen h2{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.2rem);color:var(--plum);margin:6px 0 2px;line-height:1.1}
.screen .sub{color:var(--ink-2);margin:0 0 16px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--plum);color:#fff;border-radius:999px;padding:12px 22px;font-family:var(--display);font-weight:700;font-size:1.15rem;min-height:52px}
.btn.soft{background:var(--lilac);color:var(--plum)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* story */
.book{background:var(--card);border-radius:26px;border:2px solid var(--line);overflow:hidden}
.book .art{height:170px;display:grid;place-items:center;font-size:84px;position:relative}
.book .text{padding:18px 20px 8px;font-size:clamp(1.2rem,3.6vw,1.45rem);line-height:1.7;min-height:170px}
.book .text p{margin:0 0 .7em}
.w{border-radius:8px;padding:0 2px;cursor:pointer}
.w.on{background:var(--gold);color:var(--ink)}
.book .foot{display:flex;align-items:center;gap:10px;padding:12px 16px 16px;flex-wrap:wrap}
.book .pg{margin-left:auto;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.voice-badge{font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--mint-soft);color:var(--mint)}
.voice-badge.tts{background:var(--lilac);color:var(--plum)}
.q{background:var(--lilac);border-radius:16px;padding:10px 14px;margin:0 0 10px}
.q button{font-size:.95rem;color:var(--plum);font-weight:700;text-decoration:underline;padding:4px 0}
.q .ans{display:block;color:var(--ink-2);font-size:1rem;margin-top:2px}

/* quest */
.target{font-family:var(--display);font-size:1.3rem;text-align:center;margin-bottom:12px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:700;padding:22px 6px;min-height:100px}
.card.right{border-color:var(--mint);background:var(--mint-soft)}
.card.wrong{border-color:var(--rose);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dots{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--gold)}.dot.cur{background:var(--plum)}
.big-say{display:flex;justify-content:center;margin-bottom:10px}

/* word wall */
.levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.levels button{padding:8px 16px;border-radius:999px;border:2px solid var(--line);font-weight:700;min-height:44px;background:var(--card)}
.levels button[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.wall button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 4px;font-size:1.3rem;font-weight:700;position:relative;min-height:56px}
.wall button.learned{background:var(--gold-soft);border-color:var(--gold)}
.wall button.learned::after{content:"★";position:absolute;top:2px;right:6px;font-size:.8rem;color:var(--gold)}

/* parts */
.builder{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
.col{display:grid;gap:8px}
.col button{background:var(--card);border:2px solid var(--line);border-radius:14px;font-size:1.5rem;font-weight:700;padding:8px;min-height:54px}
.col button[aria-pressed="true"]{border-color:var(--plum);background:var(--lilac);color:var(--plum)}
.plus{font-family:var(--display);font-size:2rem;color:var(--ink-2);padding-top:40px}
.result{margin-top:16px;text-align:center;font-size:clamp(2.4rem,10vw,3.6rem);font-weight:700;letter-spacing:.02em}
.result .on{color:var(--rose)}.result .rime{color:var(--plum)}
.verdict{text-align:center;font-weight:700;min-height:1.6em}

/* book parts */
.bookpic{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.bookpic svg{width:100%;height:auto;max-width:360px}
.hot{cursor:pointer}
.hot:hover .hl,.hot.sel .hl{stroke:var(--gold);stroke-width:5}
.partlist{display:grid;gap:8px}
.partlist button{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:48px}
.partlist button.sel{border-color:var(--gold);background:var(--gold-soft)}
.partlist b{font-family:var(--display);font-size:1.15rem}

/* friends */
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media (max-width:560px){.friends{grid-template-columns:1fr 1fr;gap:10px}.friend{padding:10px}.friend b{font-size:1.05rem}.friend span{font-size:.9rem}}
.friend{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:grid;gap:6px}
.friend .face{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:block}
.friend.talk{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.friend.talk .face{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.friend b{font-family:var(--display);font-size:1.25rem}
.friend span{color:var(--ink-2)}

/* sentence */
.slots{min-height:72px;border:3px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
.chip{background:var(--lilac);color:var(--plum);border-radius:14px;padding:10px 16px;font-size:1.4rem;font-weight:700;min-height:54px}
.slots .chip{background:var(--gold-soft);color:var(--ink)}
.pic{font-size:60px;text-align:center}

/* grown-up */
.gu{display:grid;gap:14px}
.gu h3{font-family:var(--display);margin:0 0 6px;color:var(--plum);font-size:1.3rem}
.meter{height:16px;background:var(--lilac);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:700}
select{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:44px}
textarea{width:100%;font:inherit;font-size:1rem;border:2px solid var(--line);border-radius:12px;padding:10px;-webkit-user-select:text;user-select:text;background:#fff;color:var(--ink)}
.small{font-size:.92rem;color:var(--ink-2)}
.rqlist{display:grid;gap:12px}
.rqcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;min-height:84px}
.rqcard.locked{opacity:.6;background:#faf7fd}
.rqcard .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px}
.rqt{display:grid}.rqt b{font-family:var(--display);font-size:1.25rem;line-height:1.15}.rqt small{color:var(--ink-2);font-size:.95rem}
.qtext{font-family:var(--display);font-size:clamp(1.3rem,4.5vw,1.7rem);text-align:center;margin:0 0 10px;line-height:1.25;color:var(--ink)}
.answers{display:grid;gap:10px}
.ans{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 16px;font-size:1.2rem;font-weight:700;text-align:left;min-height:60px}
.ans.right{border-color:var(--mint);background:var(--mint-soft)}
.ans.wrong{border-color:var(--rose);animation:shake .35s;opacity:.6}
.lookback{background:var(--gold-soft);border-radius:16px;padding:12px 14px;margin:8px 0 12px}
.lbhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lbhead span{font-size:28px}.lbhead b{font-family:var(--display);margin-right:auto}
.lbtext{font-size:1.15rem;line-height:1.6;margin-top:6px}.lbtext p{margin:0 0 .5em}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.gstats div{background:var(--lilac);border-radius:16px;padding:10px 12px;display:grid}
.gstats b{font-family:var(--display);font-size:1.8rem;color:var(--plum);line-height:1.1;font-variant-numeric:tabular-nums}
.gstats span{font-size:.85rem;color:var(--ink-2)}
.gchart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:130px;align-items:end;border-bottom:1px solid var(--line)}
.gbar{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;padding:0;min-width:0}
.gbar i{display:block;width:70%;max-width:22px;background:var(--plum);border-radius:4px 4px 0 0}
.gbar span{font-size:.7rem;color:var(--ink-2);height:16px}
.gwords{margin:0;padding-left:18px;font-size:.95rem}
.ok{color:var(--mint);font-weight:700}

/* celebrate + overlay */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.overlay{position:fixed;inset:0;background:rgba(42,24,64,.6);display:grid;place-items:center;z-index:40;padding:16px}
.overlay .panel{max-width:440px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plum-deep);color:#fff;padding:12px 20px;border-radius:20px;font-weight:700;z-index:60;max-width:min(90vw,420px);width:max-content;text-align:center}

@media (max-width:560px){
  .hero{grid-template-columns:1fr;text-align:center}.hero .heroimg{margin:0 auto}
  .stats{justify-content:center}
  .bookpic{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .tile{grid-template-columns:1fr;text-align:center;justify-items:center;padding:14px 8px}
  .tile .ic{grid-row:auto}
  .tile small{display:none}
  .choices{gap:8px}
}

/* wand page turn */
.book.flipout{animation:flipout .38s ease-in forwards;transform-origin:left center}
.book.flipin{animation:flipin .42s ease-out;transform-origin:left center}
@keyframes flipout{to{transform:perspective(1200px) rotateY(-88deg);opacity:.2}}
@keyframes flipin{from{transform:perspective(1200px) rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
.wandfx{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.wandfx .pr img{width:120px;height:120px;display:block;animation:wiggle .3s ease-in-out 3 alternate}
@keyframes wiggle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.wandfx .pr{position:absolute;top:30%;left:-140px;font-size:64px;line-height:1;animation:fly .95s ease-in-out forwards;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.wandfx .pr b{position:absolute;right:-26px;top:-8px;font-size:40px;font-weight:400;animation:wave .3s ease-in-out 3 alternate}
.wandfx.back .pr{left:auto;right:-140px;animation-name:flyback}
.wandfx.back .pr b{right:auto;left:-26px;transform:scaleX(-1)}
@keyframes fly{0%{transform:translate(0,0)}50%{transform:translate(55vw,-40px)}100%{transform:translate(calc(100vw + 240px),10px)}}
@keyframes flyback{0%{transform:translate(0,0)}50%{transform:translate(-55vw,-40px)}100%{transform:translate(calc(-100vw - 240px),10px)}}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}
.wandfx .sp{position:absolute;font-size:22px;color:var(--gold);animation:spk .9s ease-out forwards;opacity:0}
@keyframes spk{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.2) rotate(40deg)}100%{opacity:0;transform:scale(.6) translateY(30px) rotate(160deg)}}


/* prince & frog */
.pfw{text-align:center;margin:0 0 12px}
.pf{position:relative;width:118px;height:118px;margin:0 auto;border-radius:50%;border:4px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.15);background:#fff}
.pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.pf-f{opacity:0;transform:scale(.2) rotate(-40deg)}
.pf.frog{border-color:var(--mint)}
.pf.frog .pf-p{opacity:0;transform:scale(.2) rotate(40deg)}
.pf.frog .pf-f{opacity:1;transform:none}
.pf-poof{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;opacity:0;pointer-events:none}
.pf.poof .pf-poof{animation:poof .7s ease-out}
@keyframes poof{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.8)}}
.pf.frog.poof{animation:hop .45s ease-in-out 2}
@keyframes hop{50%{transform:translateY(-14px)}}
.pf.shine{animation:shine 1s ease-out}
@keyframes shine{0%{box-shadow:0 0 0 0 rgba(244,178,60,.9)}100%{box-shadow:0 0 0 26px rgba(244,178,60,0)}}
.pfcap{margin:6px 0 0;font-weight:700;color:var(--plum);min-height:1.5em}
.qflip.flipout{animation:flipout .38s ease-in forwards;transform-origin:left center}
.qflip.flipin{animation:flipin .42s ease-out;transform-origin:left center}
@media (max-width:560px){.pf{width:96px;height:96px}}


/* hint helper above the turn-the-page button */
.hintme{position:relative;animation:hintGlow 1.2s ease-in-out infinite}
.hintme::before{content:"";position:absolute;left:50%;bottom:calc(100% + 16px);width:62px;height:62px;margin-left:-31px;border-radius:50%;background:#fff url("img/friends/fairy.jpg") center/cover no-repeat;border:3px solid #f4b23c;box-shadow:0 4px 10px rgba(0,0,0,.2);animation:hintBob .7s ease-in-out infinite alternate;pointer-events:none;z-index:5}
.hintme::after{content:"▼";position:absolute;left:50%;bottom:calc(100% - 2px);transform:translateX(-50%);color:#f4b23c;font-size:22px;line-height:1;animation:hintBob .7s ease-in-out infinite alternate;pointer-events:none;z-index:5;text-shadow:0 2px 3px rgba(0,0,0,.15)}
@keyframes hintBob{from{translate:0 -8px}to{translate:0 0}}
@keyframes hintGlow{0%,100%{box-shadow:0 0 0 0 rgba(244,178,60,.8)}50%{box-shadow:0 0 0 10px rgba(244,178,60,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="bar">
    <div class="brand">
      <img class="crown" src="img/rhylein-face.png" alt="" style="border-radius:50%">
      <span>Princess RhyLein's<br>Reading Magic</span>
    </div>
    <button class="pill home-btn" id="homeBtn" hidden>🏰 Castle</button>
    <button class="pill" id="voiceBtn" aria-pressed="true">🔊 Voice</button>
    <button class="pill" id="musicBtn" aria-pressed="false">🎵 Music</button>
  </div>
  <main id="app"></main>
</div>
<canvas id="confetti"></canvas>

<script>
/* ============ DATA ============ */
const LEVELS = {
  1:"a and away big blue can come down find for funny go help here I in is it jump little look make me my not one play red run said see the three to two up we where yellow you all am are at ate be black brown but came did do eat four get good have he into like must new no now on our out please pretty ran ride saw say she so soon that there they this too under want was well went what white who will with yes".split(" "),
  2:"after again an any as ask by could every fly from give going had has her him his how just know let live may of old once open over put round some stop take thank them then think walk were when".split(" "),
  3:"always around because been before best both buy call cold does don't fast first five found gave goes green its made many off or pull read right sing sit sleep tell their these those upon us use very wash which why wish work would write your about better bring carry clean cut done draw drink eight fall far full got grow hold hot hurt if keep kind".split(" ")
};
const LEVEL_NAME = {1:"Kindergarten",2:"First Grade",3:"Second Grade"};
const ALL_WORDS = [...LEVELS[1],...LEVELS[2],...LEVELS[3]];
/* Start with Kindergarten words; move up only after every word in a level is learned */
function curLevel(){for(const l of [1,2,3]){if(LEVELS[l].some(w=>!S.learned.includes(w)))return l}return 3}

/* Nana's voice pack: every line and word the app says, recorded in Nana Julietta's voice.
   voice/clips.json maps each line (lowercased, no punctuation) to [file, start, length] inside the audio files. */
const VOICE={clips:{},files:{},bufs:{},ready:false};
async function loadVoicePack(){
  try{
    const j=await (await fetch("voice/clips.json")).json();

/* Returns the list of Nana clips for a line (or list of lines), or null if any piece is missing. */

    const whole=VOICE.clips[vnorm(p)];
    if(whole){seq.push(whole);continue}
    for(const s of vsents(p)){const c=VOICE.clips[vnorm(s)];if(c){seq.push(c);continue}

      const ws=vnorm(s).split(" ").filter(Boolean);if(!ws.length||!ws.every(w=>VOICE.clips[w]))return null;

    }

    l.frequency.value=9;lg.gain.value=22;l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.0001,t+.35);g.gain.linearRampToValueAtTime(.07,t+.42);g.gain.exponentialRampToValueAtTime(.001,t+1);
    o.connect(g).connect(c.destination);o.start(t+.35);l.start(t+.35);o.stop(t+1.05);l.stop(t+1.05);
    [1.02,1.14].forEach((d,i)=>{const b=c.createOscillator(),bg=c.createGain();b.type="sine";

function quest(){

  let idx=0,firstTry=true,gotIt=0;
  function round(){
    const w=set[idx];
    let others=shuffle(lvWords.filter(x=>x!==w&&x.length<=w.length+2)).slice(0,2);if(others.length<2)others=shuffle(lvWords.filter(x=>x!==w)).slice(0,2);

      <div class="panel qflip">

        <div class="choices">${ch.map(c=>`<button class="card" data-w="${esc(c)}">${esc(c)}</button>`).join("")}</div>
        <div class="dots">${set.map((_,j)=>`<span class="dot ${j<idx?"done":j===idx?"cur":""}"></span>`).join("")}</div>
      </div></section>`);
    const speak=()=>say(["Find the word:",w],{rate:.8});
    $("#hear").onclick=speak;speak();
    app.querySelectorAll(".card").forEach(b=>b.onclick=()=>{
      if(b.dataset.w===w){
        b.classList.add("right");chime();pfRight();D().tries++;if(firstTry){D().right++;learn(w);gotIt++}save();
        say([pick(cheers),w],{rate:.9});
        app.querySelectorAll(".card").forEach(x=>x.disabled=true);
        const pan=app.querySelector(".qflip");
        setTimeout(()=>{if(!stillHere(pan))return;idx++;firstTry=true;idx<set.length?wandTurn(round):finish()},1900);
      }else{b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");pfWrong();firstTry=false;say([pick(tries),"Find the word:",w],{rate:.85})}
    });
  }

    h(`<section class="screen"><h2>Quest complete! 🏆</h2><div class="panel" style="text-align:center">
      <p style="font-size:1.3rem">You learned <b>${gotIt}</b> new word${gotIt===1?"":"s"}!</p>

    say(["Quest complete!",`You learned ${gotIt} new words.`]);

const PART_NAMES={dan:"Dan is a name! Names start with a capital letter, so we write it with a big D.",jan:"Jan is a name, too! Names start with a capital letter, so we write it with a big J."};
const PART_EXTRA={bet:"",ban:"",jig:"A jig is a happy, bouncy dance.",vat:"A vat is a big tub.",cop:"Cop is another word for a police officer."};
const SILLY_LINE="Hee hee! That's a silly, made-up word. Let's try another sound!";
function giggle(){[784,988,880,1175].forEach((f,i)=>tone(f,i*.09,.16,.045,"sine"))}

    const w=on+rime,cap=w.charAt(0).toUpperCase()+w.slice(1),name=PART_NAMES[w],real=!name&&(FAMILIES[rime].includes(w)||(w in PART_EXTRA));

    $("#ver").innerHTML=name?`<span class="ok">✔ “${cap}” is a name! Names start with a capital letter, so we write a big ${on.toUpperCase()}.</span>`

      :`<span class="small">😄 Hee hee! “${w}” is a silly, made-up word. Let's try another sound!</span>`;
    if(speak){if(name){chime();say([cap,name])}else if(real){chime();say(PART_EXTRA[w]||w,{rate:.8})}else{giggle();say(SILLY_LINE)}}
  }
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{on=b.dataset.o;app.querySelectorAll("[data-o]").forEach(x=>setPill(x,x===b));upd(true)});

  upd(false);
}

/* ============ MAKE A SENTENCE ============ */
function sentence(n=0){
  const s=SENTENCES[n%SENTENCES.length];let built=[],frog=false;let bank=shuffle(s.w.map((w,i)=>({w,i})));
  if(bank.every((b,i)=>b.i===i))bank.reverse();
  function draw(){
    h(`<section class="screen"><h2>Make a Sentence</h2><p class="sub">Tap the words in order to match the picture. Sentence ${n%SENTENCES.length+1} of ${SENTENCES.length}.</p>
      <div class="panel qflip">
        ${princeHtml(frog)}
        <div class="pic">${s.pic}</div>
        <div class="slots" id="slots">${built.map((b,j)=>`<button class="chip" data-back="${j}">${esc(b.w)}</button>`).join("")||'<span class="small">Tap words below to build your sentence…</span>'}</div>
        <div class="bank">${bank.map((b,j)=>`<button class="chip" data-take="${j}">${esc(b.w)}</button>`).join("")}</div>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn soft" id="hint">🔊 Hear the sentence</button><button class="btn soft" id="skip">Next ▶</button></div>
      </div></section>`);
    app.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{const it=bank.splice(+b.dataset.take,1)[0];built.push(it);say(it.w.replace(/[.?]/,""),{rate:.8});check()});
    app.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{bank.push(built.splice(+b.dataset.back,1)[0]);draw()});
    $("#hint").onclick=()=>say(s.w.join(" "),{rate:.8});
    $("#skip").onclick=()=>sentence(n+1);
  }
  function check(){
    if(bank.length){draw();return}
    const ok=built.every((b,i)=>b.w===s.w[i]);draw();
    if(ok){frog=false;pfRight();S.sentencesDone++;D().sentences++;save();chime();celebrate();say([pick(cheers),s.w.join(" ")],{rate:.85});const pan=app.querySelector(".qflip");setTimeout(()=>{if(stillHere(pan))wandTurn(()=>sentence(n+1))},2800)}
    else{frog=true;pfWrong();say("Almost! Tap a word in your sentence to move it back.")}
  }
  draw();
}

/* ============ GROWN-UP CORNER ============ */
function grownup(){
  const pct=Math.round(S.learned.length/2);
  const byLevel=[1,2,3].map(l=>LEVELS[l].filter(w=>S.learned.includes(w)).length);
  const last=n=>{const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayKey(d);out.push({k,d,v:(S.days&&S.days[k])||{sec:0,words:[],quests:0,right:0,tries:0,sentences:0,stories:0}})}return out};
  const wk=last(7),two=last(14);
  const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x.v),0);
  const wkMin=Math.round(sum(wk,v=>v.sec)/60),wkWords=sum(wk,v=>v.words.length),wkRight=sum(wk,v=>v.right),wkTries=sum(wk,v=>v.tries);
  const acc=wkTries?Math.round(wkRight/wkTries*100):null;
  const wkQR=sum(wk,v=>v.qRight||0),wkQT=sum(wk,v=>v.qTries||0);const comp=wkQT?Math.round(wkQR/wkQT*100):null;
  const bestLines=RQ.map(st=>{const r=(S.comp||{})[st.id];return `${st.title} (${st.level}): ${r?`best ${r.best}/${st.qs.length}, last ${r.last}/${st.qs.length}, read ${r.tries}×`:"not read yet"}`});
  let streak=0;for(let i=0;;i++){const d=new Date();d.setDate(d.getDate()-i);const v=S.days&&S.days[dayKey(d)];if(v&&v.sec>=60)streak++;else if(i>0)break;else continue;if(i>400)break}
  const maxMin=Math.max(5,...two.map(x=>Math.round(x.v.sec/60)));
  const dname=d=>d.toLocaleDateString(undefined,{weekday:"short"});
  const dlong=d=>d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  const bars=two.map(x=>{const m=Math.round(x.v.sec/60);const h=m?Math.max(4,Math.round(m/maxMin*100)):0;const tip=`${dlong(x.d)}: ${m} min, ${x.v.words.length} new word${x.v.words.length===1?"":"s"}`;return `<button class="gbar" title="${esc(tip)}" aria-label="${esc(tip)}" data-tip="${esc(tip)}"><i style="height:${h}%"></i><span>${dname(x.d).slice(0,2)}</span></button>`}).join("");
  const recent=wk.slice().reverse().filter(x=>x.v.words.length).map(x=>`<li><b>${dlong(x.d)}:</b> ${x.v.words.map(esc).join(", ")}</li>`).join("")||'<li class="small">New words will show here as they are learned.</li>';
  const report=`${S.child}'s Reading Magic report ✨ (${dlong(new Date())})\n\nThis week:\n⏱️ ${wkMin} minutes of reading\n⭐ ${wkWords} new sight words\n🎯 ${acc===null?"No word quests yet":acc+"% right on the first try"}\n📖 ${comp===null?"No story questions yet":comp+"% of story questions right on the first try"}\n🔥 ${streak} day reading streak\n\nAll time:\n⭐ ${S.learned.length} of 200 sight words (K: ${byLevel[0]}/${LEVELS[1].length}, 1st: ${byLevel[1]}/${LEVELS[2].length}, 2nd: ${byLevel[2]}/${LEVELS[3].length})\n⏱️ ${S.minutes} minutes total\n📖 Stories finished: ${S.storyDone}\n\nReading Quest:\n${bestLines.join("\n")}\n\n🏰 ${S.questsDone} word quests\n🧩 ${S.sentencesDone} sentences built\n\nDay by day:\n${wk.map(x=>`${dlong(x.d)}: ${Math.round(x.v.sec/60)} min${x.v.words.length?", new words: "+x.v.words.join(", "):""}`).join("\n")}`;
  h(`<section class="screen"><h2>Grown-up Corner</h2><p class="sub">For parents, grandparents and teachers.</p>
  <div class="gu">
    <div class="panel"><h3>Progress</h3>
      <div class="meter" aria-label="${pct}% of words learned"><i style="width:${pct}%"></i></div>
      <dl class="kv" style="margin-top:12px">
        <dt>Words learned</dt><dd>${S.learned.length} / 200</dd>
        <dt>Kindergarten</dt><dd>${byLevel[0]} / ${LEVELS[1].length}</dd>
        <dt>First grade</dt><dd>${byLevel[1]} / ${LEVELS[2].length}</dd>
        <dt>Second grade</dt><dd>${byLevel[2]} / ${LEVELS[3].length}</dd>
        <dt>Minutes played</dt><dd>${S.minutes}</dd>
        <dt>Stories finished</dt><dd>${S.storyDone}</dd>
      </dl>
    </div>
    <div class="panel"><h3>Growth</h3>
      <div class="gstats">
        <div><b>${wkMin}</b><span>minutes this week</span></div>
        <div><b>${wkWords}</b><span>new words this week</span></div>
        <div><b>${acc===null?"–":acc+"%"}</b><span>words right on first try</span></div>
        <div><b>${comp===null?"–":comp+"%"}</b><span>story questions right</span></div>
        <div><b>${streak}</b><span>day streak 🔥</span></div>
      </div>
      <p class="small" style="margin:14px 0 6px">Minutes of reading, last 14 days (tap a bar)</p>
      <div class="gchart">${bars}</div>
      <p class="small" id="gtip" style="min-height:1.4em;margin:6px 0 0"></p>
      <p class="small" style="margin:12px 0 4px"><b>Reading Quest scores</b></p>
      <ul class="gwords">${bestLines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
      <p class="small" style="margin:12px 0 4px"><b>New words, last 7 days</b></p>
      <ul class="gwords">${recent}</ul>
    </div>
    <div class="panel"><h3>Send progress to Nana</h3>
      <p class="small">Tap <b>Send to Nana</b> and choose Messages or Mail. Send it once a week to keep track of growth.</p>
      <textarea id="rep" rows="10" readonly>${esc(report)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn gold" id="share">💌 Send to Nana</button><button class="btn soft" id="copy">Copy</button></div>
    </div>
    <div class="panel"><h3>Play time</h3>
      <label class="small" for="limit">Show a gentle break screen after:</label><br>
      <select id="limit">${[0,10,15,20,30].map(m=>`<option value="${m}" ${S.limit===m?"selected":""}>${m?m+" minutes":"No limit"}</option>`).join("")}</select>
      <p class="small" style="margin-top:10px"><label><input type="checkbox" id="unlockAll" ${S.unlockAll?"checked":""}> Open all Reading Quest stories now</label></p>
      <p class="small" style="margin-top:10px"><label for="cname">Reader's name:</label> <input id="cname" value="${esc(S.child)}" style="font:inherit;padding:8px 10px;border-radius:12px;border:2px solid var(--line);min-height:44px;-webkit-user-select:text;user-select:text"></p>
    </div>
    <div class="panel"><h3>Put Reading Magic on the Home Screen</h3>
      <p class="small"><b>iPhone or iPad:</b> open this page in Safari. Tap the Share button, choose <b>Add to Home Screen</b>, then tap <b>Add</b>. If you see <b>Open as Web App</b>, turn it on.</p>
      <p class="small">Turn the ringer switch off silent mode (or turn up the volume) so the reading voice can be heard.</p>
      <p class="small"><b>For the few lines that use the device voice:</b> on the iPhone or iPad, open Settings → Accessibility → Spoken Content → Voices → English. Download <b>Ava (Premium)</b> or <b>Zoe (Premium)</b>, then reopen Reading Magic. The app picks it automatically.</p>
    </div>
    <div class="panel"><h3>Nana's voice</h3>
      <p class="small">Reading Magic talks in Nana's own voice: the Reading Quest stories and questions, the 200 words, the Magic Friends, book parts, sentences and cheers. A copy of her voice was made from her own recording, and every line was checked. The 💜 button plays her original storytelling recording. Only made-up silly words, the slow sound-it-out button, and the word "an" use the device voice.</p><p class="small" id="vstat"></p>
      <div class="row"><button class="btn gold" id="testg">💜 Play Nana's recording</button><button class="btn soft" id="testv">🔊 Test Nana's voice</button></div>
    </div>
    <div class="panel"><h3>Start over</h3>
      <p class="small">Clears stars, minutes and progress on this device.</p>
      <div class="row"><button class="btn soft" id="reset1">Reset progress…</button><button class="btn" id="reset2" hidden style="background:var(--rose)">Yes, erase progress</button></div>
    </div>
  </div></section>`);
  $("#share").onclick=async()=>{const t=$("#rep").value;if(navigator.share){try{await navigator.share({title:`${S.child}'s Word Magic report`,text:t});return}catch(e){if(e&&e.name==="AbortError")return}}$("#copy").click()};
  app.querySelectorAll(".gbar").forEach(b=>b.onclick=()=>{$("#gtip").textContent=b.dataset.tip});
  $("#copy").onclick=async()=>{const t=$("#rep");try{await navigator.clipboard.writeText(t.value);toast("Copied! Paste it into a text or email.")}catch(e){t.style.userSelect="text";t.focus();t.select();toast("Press and hold to copy the note.")}};
  $("#limit").onchange=e=>{S.limit=+e.target.value;breakShown=false;save();toast(S.limit?`Break screen after ${S.limit} minutes`:"No time limit")};
  $("#cname").onchange=e=>{S.child=e.target.value.trim()||"RhyLein";save();grownup()};
  $("#unlockAll").onchange=e=>{S.unlockAll=e.target.checked;save();toast(S.unlockAll?"All stories are open":"Stories open one at a time")};
  $("#testg").onclick=e=>playGrandma(e.currentTarget);
  $("#testv").onclick=()=>say("Hello little reader. I'm so glad you're here.");
  $("#vstat").textContent=VOICE.ready?"✔ Nana's voice is loaded.":"Nana's voice is still loading…";
  $("#reset1").onclick=()=>{$("#reset2").hidden=false};
  $("#reset2").onclick=()=>{Object.assign(S,{learned:[],minutes:0,seconds:0,storyDone:0,sentencesDone:0,questsDone:0,days:{},comp:{}});save();toast("Progress erased");grownup()};
}


/* ============ AUTO PAGE TURN ============
   After a page is finished being read aloud, if nobody taps for 10 seconds, turn to the next page. */
const IDLE_MS=10000;let lastAct=Date.now(),talkSince=0;
["pointerdown","keydown","touchstart","wheel"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
function busyTalking(){try{return (vSources&&vSources.length>0)||speechSynthesis.speaking||(audioEl&&!audioEl.paused)}catch(e){return false}}
setInterval(()=>{
  const talking=busyTalking();if(!talking)talkSince=0;else if(!talkSince)talkSince=Date.now();
  const busy=(talking&&Date.now()-talkSince<90000)||(typeof turning!=="undefined"&&turning)||document.hidden||document.querySelector(".overlay");
  if(busy)lastAct=Date.now();
  const idle=Date.now()-lastAct,h=hintTarget();
  document.querySelectorAll(".hintme").forEach(x=>{if(x!==h||idle<2000)x.classList.remove("hintme")});
  if(h&&!h.disabled&&idle>=2000)h.classList.add("hintme");
  if(busy)return;
  const b=autoNext();
  if(!b||b.disabled){lastAct=Date.now();return}
  if(idle>=IDLE_MS){lastAct=Date.now();b.classList.remove("hintme");b.click()}
},500);
function hintTarget(){return document.querySelector(".book")?document.querySelector("#next"):null}
function autoNext(){return document.querySelector(".book")?document.querySelector("#next"):null}

home();
loadVoicePack().then(()=>{const v=document.getElementById("vstat");if(v)v.textContent=VOICE.ready?"✔ Nana's voice is loaded.":""});
</script>
