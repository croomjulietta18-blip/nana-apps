<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TK's English Adventure Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TK's Quest">
<meta name="theme-color" content="#101c4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&family=M+PLUS+Rounded+1c:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --navy:#101c4a;--navy-2:#1b2c6b;--sea:#1fa3c4;--sea-soft:#dff4fa;--sun:#f6b73c;--sun-soft:#fff3d6;
  --coral:#ef6a5b;--mint:#23a37a;--mint-soft:#dcf3ea;--ink:#16213f;--ink-2:#55607f;--paper:#f6f8fc;--card:#fff;--line:#dbe2ef;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;--ja:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;--r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.ja{font-family:var(--ja)}
.wrap{max-width:860px;margin:0 auto;padding:10px 16px 40px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 10px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font-family:var(--display);font-weight:800;color:var(--navy);line-height:1.05;font-size:1.1rem}
.brand small{display:block;font-family:var(--body);font-weight:700;color:var(--sea);font-size:.78rem}
.brand .mini{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none}
.brand .mini svg{width:46px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:.9rem;min-height:44px}
.pill[aria-pressed="false"]{opacity:.55}
.homeb{background:var(--navy);color:#fff;border-color:var(--navy)}
.hero{background:radial-gradient(circle at 85% 20%,#2a4aa8 0,transparent 45%),linear-gradient(160deg,var(--navy-2),var(--navy));color:#fff;border-radius:26px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero .tkart svg{width:clamp(110px,26vw,170px);height:auto;display:block}
.hero h1{font-family:var(--display);font-size:clamp(1.6rem,5.6vw,2.4rem);line-height:1.05;margin:0 0 4px}
.hero .tag{margin:0 0 10px;color:#bfe9f5;font-weight:800}
.hero .route{font-weight:800;color:var(--sun);letter-spacing:.02em}
.xp{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;margin-top:8px}
.xp .top{display:flex;justify-content:space-between;font-weight:800;font-size:.95rem;gap:8px;flex-wrap:wrap}
.meter{height:12px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ffd978);border-radius:999px;transition:width .6s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.9rem}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--sun);color:var(--navy);font-family:var(--display);font-weight:800;font-size:1.2rem;border-radius:999px;padding:12px 22px;min-height:52px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:11px 20px;font-family:var(--display);font-weight:800;font-size:1.1rem;min-height:50px}
.btn.soft{background:var(--sea-soft);color:var(--navy)}
.btn.sun{background:var(--sun);color:var(--navy)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{font-family:var(--display);color:var(--navy);font-size:clamp(1.5rem,5vw,2rem);margin:6px 0 0;line-height:1.1}
.sub{color:var(--ink-2);margin:2px 0 14px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
/* map */
.map{position:relative;display:grid;gap:14px;margin-top:6px}
.map .end{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink-2)}
.map .end span{font-size:30px}
.node{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;position:relative}
.node .ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;color:#fff}
.node b{font-family:var(--display);font-size:1.25rem;line-height:1.1;display:block}
.node .ja{color:var(--ink-2);font-size:.9rem}
.node .dots{display:flex;gap:5px;margin-top:4px}
.node .dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.node .dots i.on{background:var(--mint)}
.node .badge{font-size:30px;filter:grayscale(1);opacity:.35}
.node .badge.got{filter:none;opacity:1}
.node.next{border-color:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.path{width:4px;height:14px;background:repeating-linear-gradient(var(--sea) 0 6px,transparent 6px 10px);margin:-10px 0 -10px 43px}
/* mission */
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.part{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:grid;grid-template-columns:48px 1fr;gap:4px 12px;align-items:center;min-height:86px}
.part .ic{grid-row:span 2;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--sea-soft)}
.part b{font-family:var(--display);font-size:1.15rem;line-height:1.1}
.part small{color:var(--ink-2)}
.part.done{border-color:var(--mint);background:var(--mint-soft)}
.part.done b::after{content:" ✓";color:var(--mint)}
/* word card */
.wcard{text-align:center;padding:22px 16px}
.wcard .en{font-family:var(--display);font-size:clamp(2.2rem,10vw,3.4rem);color:var(--navy);line-height:1.05}
.wcard .ex{font-size:1.25rem;margin:10px 0 4px}
.hint{display:inline-flex;align-items:center;gap:8px;background:var(--sun-soft);border-radius:12px;padding:6px 12px;font-size:1.1rem;margin-top:8px}
.hint button{font-size:1rem}
.hintbtn{background:var(--sun-soft);color:#8a5a00;border-radius:999px;padding:6px 14px;font-weight:800;min-height:40px}
.prog{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}
.prog i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog i.on{background:var(--sun)}.prog i.cur{background:var(--navy)}
/* quiz */
.qtext{font-family:var(--display);font-size:clamp(1.25rem,4.6vw,1.6rem);text-align:center;margin:4px 0 12px;line-height:1.25}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:13px 16px;font-size:1.15rem;font-weight:800;text-align:left;min-height:58px}
.opt.ja{font-weight:700}
.opt .oja{font-family:var(--ja);font-weight:600;color:var(--ink-2);font-size:.9em}
.qja{text-align:center;color:var(--ink-2);font-size:1rem;margin:-6px 0 12px}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.wrong{border-color:var(--coral);background:#fdecea;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;text-align:center;font-weight:800;margin-top:12px}
.fb.good{color:var(--mint)}.fb.bad{color:var(--coral)}
.xpgain{display:inline-block;background:var(--sun);color:var(--navy);border-radius:999px;padding:2px 10px;margin-left:6px;font-size:.9rem;animation:pop .5s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
/* story */
.story{display:grid;gap:8px}
.line{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;font-size:1.12rem}
.line.on{border-color:var(--sun);background:var(--sun-soft)}
.line .ja{display:block;color:var(--ink-2);font-size:.95rem;margin-top:4px}
/* build */
.slots{min-height:66px;border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
.wchip{background:var(--sea-soft);color:var(--navy);border-radius:12px;padding:9px 15px;font-size:1.3rem;font-weight:800;min-height:50px}
.slots .wchip{background:var(--sun-soft)}
/* dashboard */
.gu{display:grid;gap:14px}
.gu h3{font-family:var(--display);color:var(--navy);margin:0 0 6px;font-size:1.25rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stats div{background:var(--sea-soft);border-radius:14px;padding:10px 12px;display:grid}
.stats b{font-family:var(--display);font-size:1.7rem;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:.85rem;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:.95rem}
textarea{width:100%;font:inherit;font-size:.95rem;border:2px solid var(--line);border-radius:12px;padding:10px;-webkit-user-select:text;user-select:text}
select{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:44px}
.small{font-size:.9rem;color:var(--ink-2)}
.overlay{position:fixed;inset:0;background:rgba(16,28,74,.6);display:grid;place-items:center;z-index:40;padding:16px}
.overlay .panel{max-width:420px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:18px;font-weight:800;z-index:60;max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
/* TK character animation */
.tk .head{animation:tkTilt 3.2s ease-in-out infinite;transform-origin:60px 96px}
.tk .hair{animation:tkHair 1.6s ease-in-out infinite;transform-origin:60px 40px}
.tk .blink{animation:tkBlink 4.2s infinite;transform-origin:60px 62px}
.tk .wave{animation:tkWave 1.3s ease-in-out infinite;transform-origin:92px 118px}
@keyframes tkTilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes tkHair{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes tkBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes tkWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
.coach .nod{animation:coNod 2.6s ease-in-out infinite;transform-origin:60px 100px}
.coach .thumb{animation:coThumb 1.4s ease-in-out infinite;transform-origin:30px 128px}
.coach .blink{animation:coBlink 4.6s infinite;transform-origin:60px 70px}
@keyframes coNod{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg) translateY(1px)}60%{transform:rotate(2deg)}}
@keyframes coThumb{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg) translateY(-3px)}}
@keyframes coBlink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.coachcard{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:14px;text-align:left}
.coachcard .coach{width:92px}
.coachcard b{font-family:var(--display);color:var(--navy);font-size:1.1rem}
.coachcard>span:last-child{display:grid;gap:2px}.bubble{display:block;background:var(--mint-soft);border-radius:14px;padding:8px 12px;margin-top:4px;font-weight:700}
.bubble .ja{display:block;font-weight:500;color:var(--ink-2);font-size:.92rem}
.nana .jump{animation:naJump .9s ease-in-out infinite;transform-origin:60px 160px}
.nana .pomL{animation:naPomL .45s ease-in-out infinite alternate;transform-origin:42px 96px}
.nana .pomR{animation:naPomR .45s ease-in-out infinite alternate;transform-origin:78px 96px}
.nana .blink{animation:naBlink 4s infinite;transform-origin:60px 64px}
.nana .hairsw{animation:naHair .9s ease-in-out infinite;transform-origin:60px 40px}
@keyframes naJump{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
@keyframes naPomL{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
@keyframes naPomR{from{transform:rotate(14deg)}to{transform:rotate(-10deg)}}
@keyframes naBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes naHair{0%,100%{transform:rotate(0)}45%{transform:rotate(1.5deg)}}
.team{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media (min-width:640px){.team{grid-template-columns:1fr 1fr}}
.coachcard .nana{width:84px}
.cheerpop{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:flex-end;gap:6px;pointer-events:none;animation:cheerIn 1.9s ease forwards}
.cheerpop .tkpop{width:104px;height:104px;border-radius:50%;animation:tkBounce .5s ease-in-out 3 alternate;box-shadow:0 6px 16px rgba(0,0,0,.25)}
@keyframes tkBounce{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
.cheerpop .say{background:var(--sun);color:var(--navy);font-family:var(--display);font-weight:800;font-size:1.15rem;border-radius:16px 16px 4px 16px;padding:8px 12px;margin-bottom:70px;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:170px}
@keyframes cheerIn{0%{transform:translateY(140%)}15%{transform:translateY(0)}85%{transform:translateY(0)}100%{transform:translateY(140%)}}
.combo{display:inline-block;background:var(--coral);color:#fff;border-radius:999px;padding:2px 10px;margin-left:6px;font-size:.9rem;animation:pop .5s}
.chal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:10px}
.cbtn{border-radius:var(--r);padding:14px;text-align:left;color:#fff;display:grid;gap:2px;min-height:96px;position:relative;overflow:hidden}
.cbtn b{font-family:var(--display);font-size:1.25rem;line-height:1.1}
.cbtn small{opacity:.92;font-weight:700;position:relative}
.cbtn .big{position:absolute;right:8px;bottom:0;font-size:44px;opacity:.35}
.cbtn.locked{filter:grayscale(.9);opacity:.6}
.timer{height:14px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));transition:width 1s linear}
.scoreline{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--navy)}
.boss{text-align:center;font-size:72px;line-height:1;margin:4px 0}
.boss.hit{animation:shake .4s}
.hp{height:16px;background:#fde2df;border-radius:999px;overflow:hidden;margin:6px auto 10px;max-width:320px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ef6a5b,#c0392b);transition:width .4s}
.hearts{font-size:1.5rem;letter-spacing:4px}
.bigword{font-family:var(--display);font-size:clamp(2rem,9vw,3rem);color:var(--navy);text-align:center;line-height:1.1;margin:4px 0 10px}
.cover{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 8px 22px rgba(16,28,74,.3)}
.cover img{display:block;width:100%;height:auto}
.coverbtn{position:absolute;left:5%;top:73.2%;width:39.4%;height:12.7%;border-radius:14px}
.coverbtn:focus-visible{outline:4px solid #fff}
.xpbox{margin-top:12px;background:var(--navy);color:#fff;border-color:var(--navy)}
.xpbox .top{display:flex;justify-content:space-between;font-weight:800;gap:8px;flex-wrap:wrap}
.xpbox .meter{height:12px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin-top:6px}
.xpbox .small{color:#bfe9f5}
.tkhello{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-weight:800}.tkhello img{width:64px;height:64px;border-radius:50%;flex:none}
.xpbox .chip{background:rgba(255,255,255,.14)}
.cay .sway{animation:cySway 2.6s ease-in-out infinite;transform-origin:60px 175px}
.cay .staff{animation:cyStaff 1.6s ease-in-out infinite;transform-origin:92px 118px}
.cay .blink{animation:cyBlink 4.4s infinite;transform-origin:72px 62px}
.cay .bloom{animation:cyBloom 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.cay .fall{animation:cyFall 2.8s ease-in infinite}
@keyframes cySway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes cyStaff{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes cyBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes cyBloom{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes cyFall{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-6px,26px) rotate(90deg);opacity:0}}
.cousin{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;background:#fff8d6;border:2px solid #ffd21f;border-radius:var(--r);padding:10px 14px;margin-top:12px}
.cousin .cay{width:92px;height:auto}
.cousin b{font-family:var(--display);color:#9a6a00;font-size:1.15rem}
.cousin>span:last-child{display:grid;gap:2px}
.cousin .bubble{display:block;background:#fff;border-radius:12px;padding:8px 12px;font-weight:700}
.cousin .bubble .ja{display:block;font-weight:500;color:var(--ink-2);font-size:.92rem}
.cypop .cay{width:100px;height:auto}
.coach .nod{animation:coNod 2.6s ease-in-out infinite;transform-origin:60px 100px}
.coach .thumb{animation:coThumb 1.4s ease-in-out infinite;transform-origin:30px 128px}
.coach .blink{animation:coBlink 4.6s infinite;transform-origin:60px 70px}
@keyframes coNod{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg) translateY(1px)}60%{transform:rotate(2deg)}}
@keyframes coThumb{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg) translateY(-3px)}}
@keyframes coBlink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.nana .jump{animation:naJump .9s ease-in-out infinite;transform-origin:60px 160px}
.nana .pomL{animation:naPomL .45s ease-in-out infinite alternate;transform-origin:42px 96px}
.nana .pomR{animation:naPomR .45s ease-in-out infinite alternate;transform-origin:78px 96px}
.nana .blink{animation:naBlink 4s infinite;transform-origin:60px 64px}
.nana .hairsw{animation:naHair .9s ease-in-out infinite;transform-origin:60px 40px}
@keyframes naJump{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
@keyframes naPomL{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
@keyframes naPomR{from{transform:rotate(14deg)}to{transform:rotate(-10deg)}}
@keyframes naBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes naHair{0%,100%{transform:rotate(0)}45%{transform:rotate(1.5deg)}}
.cb .bounce{animation:cbBounce 1.8s ease-in-out infinite;transform-origin:60px 160px}
.cb .wave{animation:cbWave 1.3s ease-in-out infinite;transform-origin:90px 104px}
.cb .blink{animation:cbBlink 4s infinite;transform-origin:60px 66px}
.cb .locs{animation:cbSway 1.8s ease-in-out infinite;transform-origin:60px 40px}
.cb .twinkle{animation:cbTw 2s ease-in-out infinite}
@keyframes cbBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes cbWave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(18deg)}}
@keyframes cbBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes cbSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}

nging loudly.", "He was on television."], "a": 0, "why": "He jumped over a bench and grabbed the handle like an anime hero.", "qj": "女の子はなぜTKに「映画スターなの？」と聞いたの？", "cj": ["アクションヒーローのようにスーツケースをつかまえたから。", "大声で歌っていたから。", "テレビに出ていたから。"]}, {"q": "How was the weather in Mississippi?", "c": ["Hot and humid", "Cold and snowy", "Cool and windy"], "a": 0, "why": "The air was hot and humid, just like summer in Okinawa.", "qj": "ミシシッピの天気はどうだった？", "cj": ["暑くてむしむし", "寒くて雪", "すずしくて風が強い"]}]}, "words": [{"en": "traveler", "ja": "旅人", "ex": "TK is a fast traveler."}, {"en": "humid", "ja": "むしむしした", "ex": "Summer in Mississippi is humid."}, {"en": "hallway", "ja": "通路・ろうか", "ex": "The suitcase rolled down the hallway."}, {"en": "adventure", "ja": "冒険", "ex": "The adventure starts now."}, {"en": "grab", "ja": "つかむ", "ex": "Grab the handle quickly!"}, {"en": "welcome", "ja": "ようこそ", "ex": "Welcome to America!"}], "listen": [{"en": "Your American adventure starts now!", "c": ["The adventure is beginning.", "The adventure is over.", "The adventure is next year."], "a": 0, "ja": "冒険が始まる。", "cj": ["冒険が始まっている。", "冒険は終わった。", "冒険は来年だ。"]}, {"en": "The air was hot and humid.", "c": ["The weather was hot and sticky.", "The weather was cold.", "It was snowing."], "a": 0, "ja": "暑くてむしむししていた。", "cj": ["天気は暑くてべたべたしていた。", "天気は寒かった。", "雪がふっていた。"]}, {"en": "I am just a very fast traveler.", "c": ["He travels quickly.", "He is very tired.", "He is a pilot."], "a": 0, "ja": "とても速い旅人だ。", "cj": ["彼は速く旅をする。", "彼はとてもつかれている。", "彼はパイロットだ。"]}], "grammar": [{"q": "TK ___ off the plane yesterday.", "c": ["stepped", "steps", "stepping"], "a": 0, "qj": "TKはきのう飛行機を降りました。", "cj": ["過去形", "現在形", "-ing形"], "why": "Yesterday means the past, so use the past tense: stepped."}, {"q": "Nana and Papaw ___ waiting at the gate.", "c": ["were", "was", "is"], "a": 0, "qj": "ナナとパパウはゲートで待っていました。", "cj": ["複数・過去", "単数・過去", "単数・現在"], "why": "Nana and Papaw is plural, so use were."}, {"q": "There ___ many people at the airport.", "c": [" achers.”", "ja": "ナナはTKをハグしました。「英語がとてもすてきよ」TKはにっこり。「いい先生がいたからね」"}], "qs": [{"q": "Where was the anime convention?", "c": ["Los Angeles", "New Orleans", "Okinawa"], "a": 0, "why": "The final stop was a giant anime convention in Los Angeles.", "qj": "アニメ・コンベンションはどこで開かれた？", "cj": ["ロサンゼルス", "ニューオーリンズ", "沖縄"]}, {"q": "What problem happened before the contest?", "c": ["Cayden's walking stick broke.", "TK lost his sunglasses.", "The stage caught fire."], "a": 0, "why": "Right before they went on stage, Cayden's walking stick broke in half.", "qj": "コンテストの前にどんな問題が起きた？", "cj": ["ケイデンのつえが折れた。", "TKがサングラスをなくした。", "ステージが火事になった。"]}, {"q": "How did TK solve the problem?", "c": ["He borrowed tape and fixed the stick.", "He bought a new costume.", "He cried and went home."], "a": 0, "why": "TK stayed calm, borrowed tape from Mia, and fixed it in thirty seconds.", "qj": "TKはどうやって問題を解決した？", "cj": ["テープを借りてつえを直した。", "新しい衣装を買った。", "泣いて家に帰った。"]}, {"q": "What does “hype man” mean in the story?", "c": ["Someone who gets the crowd excited for another person", "A person who sells hot dogs", "A security guard"], "a": 0, "why": "TK cheered for Cayden and got the crowd excited. That is a hype man.", "qj": "物語の「hype man」とはどういう意味？", "cj": ["ほかの人のために観客を盛り上げる人", "ホットドッグを売る人", "警備員"]}]}, "words": [{"en": "convention", "ja": "大会・コンベンション", "ex": "The anime convention was huge."}, {"en": "contest", "ja": "コンテスト", "ex": "Cayden entered the costume contest."}, {"en": "calm", "ja": "落ち着いた", "ex": "TK stayed calm."}, {"en": "borrow", "ja": "借りる", "ex": "Can I borrow some tape?"}, {"en": "crowd", "ja": "観客・群衆", "ex": "The crowd cheered."}, {"en": "wonderful", "ja": "すばらしい", "ex": "Your English sounds wonderful."}], "listen": [{"en": "Can I borrow some tape?", "c": ["TK is asking to use some tape.", "TK is selling tape.", "TK is throwing tape away."], "a": 0, "ja": "テープを借りてもいい？", "cj": ["TKはテープを使わせてと頼んでいる。", "TKはテープを売っている。", "TKはテープをすてている。"]}, {"en": "Give it up for Cayden!", "c": ["Clap and cheer for Cayd /* ============ ENGINE (Nana's voice + sounds) ============ */
const VOICE={clips:{},files:{},bufs:{},ready:false};
async function loadVoicePack(){
  try{
    const j=await (await fetch("voice/clips.json")).json();
    VOICE.clips=j.clips;VOICE.files=j.files;
    const c=ctx();if(!c)return;
    await Promise.all(Object.entries(j.files).map(async([name,url])=>{
      const ab=await (await fetch(url)).arrayBuffer();
      VOICE.bufs[name]=await new Promise((ok,no)=>{const p=c.decodeAudioData(ab,ok,no);if(p&&p.then)p.then(ok,no)});
    }));
    VOICE.ready=true;
  }catch(e){VOICE.ready=false}
}
function vnorm(t){return String(t).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim()}
function vsents(t){
  const out=[];let cur="";
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if(".!?".includes(t[i])){
      while(i+1<t.length&&"\"”’'".includes(t[i+1])){i++;cur+=t[i]}
      if(i+1===t.length||t[i+1]===" "){out.push(cur.trim());cur=""}
    }
  }
  if(cur.trim())out.push(cur.trim());
  return out;
}
/* Returns the list of Nana clips for a line (or list of lines), or null if any piece is missing. */
function clipSeq(parts){
  if(!VOICE.ready)return null;
  const seq=[];
  for(const p of (Array.isArray(parts)?parts:[parts])){
    const whole=VOICE.clips[vnorm(p)];
    if(whole){seq.push(whole);continue}
    for(const s of vsents(p)){const c=VOICE.clips[vnorm(s)];if(!c)return null;seq.push(c)}
  }
  return seq.length?seq:null;
}
let vSources=[],vTimer=null;
function stopClips(){vSources.forEach(s=>{try{s.onended=null;s.stop()}catch(e){}});vSources=[];clearTimeout(vTimer)}
function playSeq(seq,onend,gap=.28){
  const c=ctx();let t=c.currentTime+.05;
  seq.forEach(([f,start,dur],n)=>{
    const src=c.createBufferSource();src.buffer=VOICE.bufs[f];src.connect(c.destination);
    src.start(t,start,dur);t+=dur+gap;vSources.push(src);
    if(n===seq.length-1)src.onended=()=>{vSources=[];onend&&onend()};
  });
}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function pickVoice(){
  const en=voices.filter(v=>/^en/i.test(v.lang));
  const q=v=>/premium/i.test(v.name)?3:/enhanced|natural|neural|online/i.test(v.name)?2:0;
  const pref=["Ava","Zoe","Samantha","Allison","Susan","Nicky","Karen","Moira","Tessa","Aria","Jenny","Google US English"];
  for(const tier of [3,2]){for(const n of pref){const v=en.find(v=>v.name.includes(n)&&q(v)===tier);if(v)return v}const any=en.find(v=>q(v)===tier&&/en[-_]US/i.test(v.lang));if(any)return any}
  for(const n of pref){const v=en.find(v=>v.name.includes(n));if(v)return v}
  return voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;
}
let audioEl=null;
function stopTalking(){try{speechSynthesis.cancel()}catch(e){} if(audioEl){audioEl.pause();audioEl=null} stopClips()}
/* say() takes a line or a list of lines. It plays Nana's recordings when every piece is recorded,
   and falls back to the device's reading voice for anything new (like made-up silly words). */
function say(text,{rate=.88,onword,onend}={}){
  if(!S.voice){onend&&onend();return}
  stopTalking();
  const seq=clipSeq(text);
  if(seq){try{playSeq(seq,onend);return}catch(e){}}
  if(Array.isArray(text))text=text.join(" ");
  try{
    const u=new SpeechSynthesisUtterance(text);const v=pickVoice();if(v)u.voice=v;
    u.rate=Math.min(1,rate+.05);u.pitch=1;
    if(onword)u.onboundary=e=>{if(e.name==="word"||e.charIndex!==undefined)onword(e.charIndex)};
    u.onend=()=>onend&&onend();
    speechSynthesis.speak(u);
  }catch(e){onend&&onend()}
}
let actx=null;
function ctx(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==="suspended")actx.resume();return actx}
function tone(f,t0,d,vol=.12,type="sine"){const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.05)}
function chime(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,i*.08,.5,.08,"triangle"))}
function boop(){tone(330,0,.18,.08,"sine");tone(262,.12,.25,.07,"sine")}

const cv=document.getElementById("confetti"),cx2=cv.getContext("2d");let bits=[];
function celebrate(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#f4b23c","#e8588a","#5b1f96","#3d7fd6","#2f9e7a"];
  for(let i=0;i<90;i++)bits.push({x:innerWidth/2,y:innerHeight/2.4,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,r:Math.random()*6+4,c:cols[i%5],a:1,s:Math.random()<.4});
  if(bits.length<=90)requestAnimationFrame(drawBits);
}
function drawBits(){cx2.clearRect(0,0,cv.width,cv.height);bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.35;b.a-=.012;cx2.globalAlpha=Math.max(b.a,0);cx2.fillStyle=b.c;if(b.s){cx2.font=b.r*3+"px serif";cx2.fillText("★",b.x,b.y)}else cx2.fillRect(b.x,b.y,b.r,b.r*1.6)});bits=bits.filter(b=>b.a>0&&b.y<cv.height+40);if(bits.length)requestAnimationFrame(drawBits);else cx2.clearRect(0,0,cv.width,cv.height)}

let combo=0;
const CAYDEN_CHEERS=["That’s my cousin!","Let’s go, TK!","Unstoppable!"];
function sayCayden(t,now){if(!S.voice)return;const c=VOICE.ready&&VOICE.clips["cayden|"+vnorm(t)];if(!c)return;
  if(now){stopTalking();try{playSeq([c])}catch(e){};return}
  let tries=0;const go=()=>{const busy=vSources.length||(window.speechSynthesis&&speechSynthesis.speaking);if(busy&&tries++<25){setTimeout(go,200);return}if(!busy){try{playSeq([c])}catch(e){}}};setTimeout(go,300)}
const CHEERS=["Yes! 🎉","I got it!","Awesome! ⭐","Nailed it!","Too easy! 😎","Keep going! 💪"];
function cheer(text){const cyLine=(!text&&combo>=3)?pick(CAYDEN_CHEERS):null;if(cyLine)sayCayden(cyLine);document.querySelectorAll(".cheerpop").forEach(x=>x.remove());const c=document.createElement("div");c.className="cheerpop";c.innerHTML=`<div class="say">${esc(cyLine?cyLine+" 🔥 x"+combo:(text||pick(CHEERS)))}</div>${(combo>=3||/BADGE|RECORD|CHAMPION/.test(text||""))?`<span class="cypop">${CAYDEN_SVG}</span>`:`<img class="tkpop" src="img/tk-anime.png" alt="">`}`;document.body.appendChild(c);setTimeout(()=>c.remove(),2000)}
function comboTag(){return combo>=2?`<span class="combo">🔥 Combo x${combo}</span>`:""}
/* Scoring: the tapped answer is compared with the correct answer by its ORIGINAL index, never by screen position. */
function award(mid,part,firstTry){
  const st=stat(mid,part);st.tries++;D().tries++;
  let gain=0;
  if(firstTry){st.right++;D().right++;S.streakRight++;combo++;gain=10+Math.min(combo-1,5)*2}else{S.streakRight=0;combo=0;gain=5}
  addXP(gain);cheer();return gain;
}
function addXP(n){
  const before=level().i;S.xp+=n;D().xp+=n;save();
  const after=level();
  if(after.i>before){setTimeout(()=>{celebrate();chime();toast(`⭐ Level up! ${after.name} · ${after.ja}`);say("Level up!")},900)}
}
function markDone(mid,part){
  S.done[mid]=S.done[mid]||{};const was=!!S.done[mid][part];S.done[mid][part]=true;
  if(!was)addXP(20);
  const all=PARTS.every(p=>S.done[mid][p[0]]);
  if(all&&!S.badges.includes(mid)){S.badges.push(mid);S.souvenirs=S.souvenirs||[];if(!S.souvenirs.includes(mid))S.souvenirs.push(mid);addXP(50);save();return true}
  save();return false;
}

/* --- Multiple choice engine (Listen + Story questions) --- */
function quiz({mi,part,items,title,sub,intro,render,onDone}){
  let i=0,firstRight=0;
  function show(){
    const it=items[i];let first=true,solved=false;
    const order=shuffle(it.c.map((_,j)=>j));
    h(`<h2>${title}</h2><p class="sub">${sub} · ${i+1} / ${items.length}</p>
      <div class="panel">${render(it,i)}
        <div class="opts">${order.map(j=>`<button class="opt ${it.jaOpts?"ja":""}" data-j="${j}">${optHtml(it,j)}</button>`).join("")}</div>
        <div class="fb" id="fb" aria-live="polite"></div>
        <div class="row" id="nav" style="justify-content:center;margin-top:8px"></div>
        <div class="prog">${items.map((_,j)=>`<i class="${j<i?"on":j===i?"cur":""}"></i>`).join("")}</div>
      </div>`);
    wireHints();
    const readIt=()=>say(it.speak);
    const hb=$("#hearq");if(hb)hb.onclick=readIt;
    if(i===0&&intro)say([intro,...[].concat(it.speak)]);else readIt();
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(solved)return;
      const j=Number(b.dataset.j);
      if(j===it.a){
        solved=true;b.classList.add("right");chime();
        const gain=award(MISSIONS[mi].id,part,first);if(first)firstRight++;
        app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        const fb=$("#fb");fb.className="fb good";fb.innerHTML=`✔ Correct! ${it.why?esc(it.why):""}<span class="xpgain">+${gain} XP</span>${comboTag()}`;
        say([pick(Q.cheers)].concat(it.why?[it.why]:[]));
        $("#nav").innerHTML=`<button class="btn" id="go">${i<items.length-1?"Next ▶":"Finish ✓"}</button>`;
        $("#go").onclick=()=>{i++;i<items.length?show():onDone(firstRight)};
      }else{
        first=false;b.classList.add("wrong");b.disabled=true;boop();
        const fb=$("#fb");fb.className="fb bad";fb.innerHTML=`✖ Not quite. Try again! <span class="ja">もう一度！</span>`;
        say(pick(Q.tries));
      }
    });
  }
  show();
}

        <div class="panel">
          <div class="slots">${built.map((b,j)=>`<button class="wchip" data-back="${j}">${esc(b.w)}</button>`).join("")||'<span class="small">Tap the words below…</span>'}</div>
          <div class="bank">${bank.map((b,j)=>`<button class="wchip" data-take="${j}">${esc(b.w)}</button>`).join("")}</div>
          <div class="fb" id="fb"></div>
          <div class="row" id="nav" style="justify-content:center;margin-top:8px"><button class="btn soft" id="hint">🔊 Hear the sentence</button></div>
        </div>`);
      app.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{const it=bank.splice(+b.dataset.take,1)[0];built.push(it);say(it.w.replace(/[.?!,]/g,""),{rate:.8});check()});
      app.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{bank.push(built.splice(+b.dataset.back,1)[0]);draw()});
      $("#hint").onclick=()=>say(target.join(" "));
    }
    function check(){
      if(bank.length){draw();return}
      const ok=built.every((b,i)=>b.w===target[i]);draw();
      if(ok){
        chime();const gain=award(m.id,"build",first);if(first)firstRight++;
        $("#fb").className="fb good";$("#fb").innerHTML=`✔ Correct! “${esc(target.join(" "))}”<span class="xpgain">+${gain} XP</span>${comboTag()}`;
        say([pick(Q.cheers),target.join(" ")]);
        app.querySelectorAll(".wchip").forEach(x=>x.disabled=true);
        $("#nav").innerHTML=`<button class="btn" id="go">${n<m.build.length-1?"Next ▶":"Finish ✓"}</button>`;
        $("#go").onclick=()=>{n++;n<m.build.length?show():finishPart(mi,"build",`You built <b>${firstRight} / ${m.build.length}</b> sentences on the first try.`)};
      }else{
        first=false;boop();$("#fb").className="fb bad";$("#fb").innerHTML=`Almost! Tap a word to move it back. <span class="ja">言葉をタップしてもどそう</span>`;say(pick(Q.tries));
      }
    }
    draw();
  }
  show();
}

/* ============ CHALLENGES ============ */
const ALLWORDS=MISSIONS.flatMap(m=>m.words.map(w=>({...w,mid:m.id})));
const jaShort=t=>t.replace(/（.*?）/g,"");
function vocabQ(){const w=pick(ALLWORDS);const oth=shuffle(ALLWORDS.filter(x=>x.en!==w.en)).slice(0,2),others=oth.map(x=>x.en);const re=new RegExp("\\b"+w.en.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*","i");const blank=w.ex.replace(re,"_____");return{big:null,q:blank,c:[w.en,...others],cj:[w.ja,...oth.map(x=>x.ja)].map(jaShort),a:0,jaOpts:false,speak:w.ex,prompt:"Which word fits? · どの単語が入る？"}}
function listenQ(){const m=pick(MISSIONS),l=pick(m.listen);return{big:"🎧",c:l.c,cj:l.cj,a:l.a,jaOpts:false,speak:l.en,prompt:"Listen. What does it mean? · 聞いて選ぼう"}}
function storyQ(){const m=pick(MISSIONS),q=pick(m.story.qs);return{big:null,q:q.q,qj:q.qj,c:q.c,cj:q.cj,a:q.a,speak:[q.q,...q.c],prompt:"From “"+m.story.title+"”"}}
function mixQ(){const r=Math.random();return r<.45?vocabQ():r<.8?listenQ():storyQ()}
function challengeButtons(){
  S.best=S.best||{};const dailyDone=S.dailyDone===dayKey();const bossOpen=S.badges.length>=2;
  return `<div class="chal">
    <button class="cbtn" id="c_light" style="background:linear-gradient(150deg,#ef6a5b,#e8952c)"><span class="big">⚡</span><b>⚡ Lightning Round</b><small>60 seconds. Beat your record!</small><small>🏆 Best: ${S.best.lightning||0}</small></button>
    <button class="cbtn" id="c_daily" style="background:linear-gradient(150deg,#1a8fb0,#1f8a66)"><span class="big">📅</span><b>📅 Daily Challenge</b><small>5 questions · Double XP</small><small>${dailyDone?"✔ Done today! Come back tomorrow":"Ready today!"}</small></button>
    <button class="cbtn ${bossOpen?"":"locked"}" id="c_boss" style="background:linear-gradient(150deg,#5b2a86,#101c4a)"><span class="big">🐉</span><b>🐉 Boss Challenge</b><small>${bossOpen?"Defeat the Word Dragon!":"🔒 Earn 2 badges to unlock"}</small><small>${S.bossWins?`🏆 Wins: ${S.bossWins}`:"3 lives ❤️❤️❤️"}</small></button>
  </div>`}
function wireChallenges(){
  $("#c_light").onclick=()=>go("lightning");
  $("#c_daily").onclick=()=>{if(S.dailyDone===dayKey()){toast("Done for today! Come back tomorrow. · また明日！");return}go("daily")};
  $("#c_boss").onclick=()=>{if(S.badges.length<2){toast("Earn 2 mission badges to unlock the Boss! · バッジを2つ集めよう");return}go("boss")};
}
/* One question. Right/wrong is decided by the option's ORIGINAL index (q.a), never its screen position. */
function askQ(q,onAnswer){
  window.__q=q;
  const order=shuffle(q.c.map((_,j)=>j));let first=true,solved=false;
  const box=$("#qbox");
  box.innerHTML=`${q.big?`<div class="bigword">${esc(q.big)}</div>`:`<p class="qtext">${esc(q.q)}</p>${qjHtml(q)}`}<p class="small" style="text-align:center;margin:0 0 8px">${esc(q.prompt)} <button class="hintbtn" id="rep" aria-label="Play again">🔊</button></p>
    <div class="opts">${order.map(j=>`<button class="opt ${q.jaOpts?"ja":""}" data-j="${j}">${optHtml(q,j)}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div>`;
  $("#rep").onclick=()=>say(q.speak);say(q.speak);
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(solved)return;const j=Number(b.dataset.j);
    if(j===q.a){solved=true;b.classList.add("right");chime();box.querySelectorAll(".opt").forEach(x=>x.disabled=true);$("#fb").className="fb good";$("#fb").textContent="✔ Correct!";onAnswer(true,first)}
    else{first=false;b.classList.add("wrong");b.disabled=true;boop();$("#fb").className="fb bad";$("#fb").textContent="✖ Not quite!";onAnswer(false,false)}
  });
}
function lightning(){
  S.best=S.best||{};let score=0,left=60,timer=null,over=false;
  h(`<h2>⚡ Lightning Round</h2><p class="sub">Answer as many as you can in 60 seconds! · 60秒でいくつ答えられる？</p>
    <div class="panel"><div class="scoreline"><span>⭐ Score: <span id="sc">0</span></span><span>⏱️ <span id="tl">60</span>s</span></div><div class="timer"><i id="tb" style="width:100%"></i></div><div id="qbox"></div></div>`);
  function next(){if(over)return;askQ(Math.random()<.6?vocabQ():listenQ(),(ok)=>{if(over)return;if(ok){score++;combo++;addXP(5);cheer(combo>=3?`Combo x${combo}! 🔥`:null);$("#sc").textContent=score;setTimeout(next,650)}else{combo=0;setTimeout(()=>{if(!over)next()},700)}})}
  timer=setInterval(()=>{left--;const tl=$("#tl"),tb=$("#tb");if(!tl){clearInterval(timer);over=true;return}tl.textContent=left;tb.style.width=(left/60*100)+"%";if(left<=0){clearInterval(timer);over=true;end()}},1000);
  function end(){stopTalking();const rec=score>(S.best.lightning||0);if(rec)S.best.lightning=score;save();celebrate();chime();
    h(`<h2>⚡ Time's up!</h2><div class="panel" style="text-align:center"><p style="font-size:1.4rem">You answered <b>${score}</b> correctly!</p>${rec?`<p style="font-size:2.4rem;margin:4px 0">🏆</p><p><b>New record!</b> · 新記録！</p>`:`<p>Your record: <b>${S.best.lightning}</b>. Can you beat it?</p>`}<p class="small">+${score*5} XP</p><div class="row" style="justify-content:center"><button class="btn sun" id="again">⚡ Play again</button><button class="btn soft" id="hm">Home</button></div></div>`);
    say(rec?"Excellent!":"Awesome!");cheer(rec?"NEW RECORD! 🏆":"Great job! 💪");$("#again").onclick=()=>go("lightning");$("#hm").onclick=()=>go("home")}
  next();
}
function daily(){
  const qs=[mixQ(),mixQ(),mixQ(),mixQ(),mixQ()];let i=0,right=0;
  h(`<h2>📅 Daily Challenge</h2><p class="sub">5 questions · Double XP today! · 今日はXP2倍！</p><div class="panel"><div class="scoreline"><span>Question <span id="qi">1</span> / 5</span><span>⭐ <span id="sc">0</span></span></div><div id="qbox" style="margin-top:10px"></div><div class="row" id="nav" style="justify-content:center;margin-top:8px"></div></div>`);
  function show(){$("#qi").textContent=i+1;$("#nav").innerHTML="";askQ(qs[i],(ok,first)=>{if(!ok){combo=0;return}if(first){right++;combo++}addXP(first?20:10);cheer();$("#sc").textContent=right;$("#nav").innerHTML=`<button class="btn" id="go">${i<4?"Next ▶":"Finish ✓"}</button>`;$("#go").onclick=()=>{i++;i<5?show():end()}})}
  function end(){S.dailyDone=dayKey();S.dailyCount=(S.dailyCount||0)+1;save();celebrate();chime();
    h(`<h2>📅 Daily Challenge complete!</h2><div class="panel" style="text-align:center"><p style="font-size:1.3rem"><b>${right} / 5</b> right on the first try!</p><p style="font-size:2rem">${"⭐".repeat(right)}${"☆".repeat(5-right)}</p><p class="small">Come back tomorrow for a new challenge. · また明日チャレンジしよう！</p><button class="btn" id="hm">Home</button></div>`);
    say("Mission complete!");cheer("See you tomorrow! 👋");$("#hm").onclick=()=>go("home")}
  show();
}
function boss(){
  const N=10;let hits=0,lives=3;
  h(`<h2>🐉 Boss Challenge</h2><p class="sub">Defeat the Word Dragon! Each right answer is a hit. You have 3 lives. · ドラゴンをたおせ！</p>
    <div class="panel"><div class="boss" id="dragon">🐉</div><div class="hp"><i id="hp" style="width:100%"></i></div>
    <div class="scoreline"><span class="hearts" id="hearts">❤️❤️❤️</span><span>Hits: <span id="hits">0</span> / ${N}</span></div><div id="qbox" style="margin-top:10px"></div></div>`);
  function show(){askQ(mixQ(),(ok)=>{
    if(ok){hits++;combo++;addXP(10);cheer(combo>=3?`Combo x${combo}! 🔥`:"Hit! 💥");const d=$("#dragon");d.classList.remove("hit");void d.offsetWidth;d.classList.add("hit");$("#hp").style.width=((N-hits)/N*100)+"%";$("#hits").textContent=hits;
      if(hits>=N)setTimeout(win,700);else setTimeout(show,800)}
    else{lives--;combo=0;$("#hearts").textContent="❤️".repeat(Math.max(lives,0))+"🤍".repeat(3-Math.max(lives,0));if(lives<=0)setTimeout(lose,700)}
  })}
  function win(){S.bossWins=(S.bossWins||0)+1;addXP(100);save();celebrate();setTimeout(celebrate,500);chime();
    h(`<h2>🏆 You defeated the Word Dragon!</h2><div class="panel" style="text-align:center"><p style="font-size:3rem;margin:0">🏆🐉💫</p><p style="font-size:1.2rem"><b>+100 XP bonus!</b> Boss wins: ${S.bossWins}</p><p class="ja">ドラゴンをたおした！すごい！</p><div class="row" style="justify-content:center"><button class="btn sun" id="again">Fight again</button><button class="btn soft" id="hm">Home</button></div></div>`);
    say("Excellent!");cheer("CHAMPION! 🏆");$("#again").onclick=()=>go("boss");$("#hm").onclick=()=>go("home")}
  function lose(){save();
    h(`<h2>🐉 The dragon got away…</h2><div class="panel" style="text-align:center"><p style="font-size:1.2rem">You made <b>${hits}</b> hits. Practice the missions and try again!</p><p class="ja">ミッションで練習して、もう一度！</p><div class="row" style="justify-content:center"><button class="btn sun" id="again">Try again</button><button class="btn soft" id="mp">Quest Map</button></div></div>`);
    say("Good try. One more time.");cheer("You’ll get him next time! 💪");$("#again").onclick=()=>go("boss");$("#mp").onclick=()=>go("map")}
  show();
}

/* ============ FAMILY DASHBOARD ============ */
function family(){
  const L=level();
  const last=n=>{const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push({d,v:(S.days&&S.days[dayKey(d)])||{sec:0,xp:0,right:0,tries:0,words:[]}})}return o};
  const wk=last(7),sum=f=>wk.reduce((a,x)=>a+f(x.v),0);
  const wkMin=Math.round(sum(v=>v.sec)/60),wkXP=sum(v=>v.xp),wkR=sum(v=>v.right),wkT=sum(v=>v.tries);
  const acc=wkT?Math.round(wkR/wkT*100):null;
  const dl=d=>d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  const rows=MISSIONS.map(m=>{const s=S.stats[m.id]||{};const cell=p=>{const x=s[p];return x&&x.tries?`${Math.round(x.right/x.tries*100)}%`:(S.done[m.id]&&S.done[m.id][p]?"✓":"–")};return {m,cells:["words","listen","story","build"].map(p=>p==="words"?(S.done[m.id]&&S.done[m.id].words?"✓":"–"):cell(p))}});
  const report=`TK's English Adventure Quest report ✨ (${dl(new Date())})\n\nLevel: ${L.name} (${L.ja}), ${S.xp} XP\nBadges: ${S.badges.length} of ${MISSIONS.length}\n⚡ Lightning Round best: ${(S.best&&S.best.lightning)||0}\n📅 Daily Challenges done: ${S.dailyCount||0}\n🐉 Boss wins: ${S.bossWins||0}\n🔥 ${streakDays()} day streak\n\nThis week:\n⏱️ ${wkMin} minutes\n⭐ ${wkXP} XP earned\n🎯 ${acc===null?"No answers yet":acc+"% right on the first try"}\n\nMissions (first-try accuracy: Listen / Story / Build):\n${rows.map(r=>`${r.m.icon} ${r.m.title}: words ${r.cells[0]}, listen ${r.cells[1]}, story ${r.cells[2]}, build ${r.cells[3]}`).join("\n")}\n\nWords learned (${S.words.length}): ${S.words.join(", ")||"none yet"}\n\nDay by day:\n${wk.map(x=>`${dl(x.d)}: ${Math.round(x.v.sec/60)} min, ${x.v.xp} XP`).join("\n")}`;
  h(`<h2>Family Dashboard · <span class="ja">家族用</span></h2><p class="sub">TK's progress, settings and reports.</p>
  <div class="gu">
    <div class="panel"><h3>This week</h3><div class="stats">
      <div><b>${wkMin}</b><span>minutes</span></div><div><b>${wkXP}</b><span>XP earned</span></div>
      <div><b>${acc===null?"–":acc+"%"}</b><span>right first try</span></div><div><b>${streakDays()}</b><span>day streak 🔥</span></div>
      <div><b>${L.name}</b><span>${S.xp} XP total</span></div><div><b>${S.badges.length}/${MISSIONS.length}</b><span>badges</span></div><div><b>${(S.best&&S.best.lightning)||0}</b><span>⚡ Lightning best</span></div><div><b>${S.bossWins||0}</b><span>🐉 boss wins</span></div></div></div>
    <div class="panel"><h3>Missions</h3><table><thead><tr><th>Mission</th><th>Words</th><th>Listen</th><th>Story</th><th>Build</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.m.icon} ${esc(r.m.title)}</td>${r.cells.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>
      <p class="small">Percent = answers right on the first try.</p></div>
    <div class="panel"><h3>Send progress to Nana</h3><textarea id="rep" rows="9" readonly>${esc(report)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn sun" id="share">💌 Send to Nana</button><button class="btn soft" id="copy">Copy</button></div></div>
    <div class="panel"><h3>Japanese hints · ヒント</h3>
      <select id="hm"><option value="fade" ${S.hintMode==="fade"?"selected":""}>Fade as he improves (recommended)</option><option value="on" ${S.hintMode==="on"?"selected":""}>Always show</option><option value="off" ${S.hintMode==="off"?"selected":""}>Off (English only)</option></select>
      <p class="small">In fade mode, hints show at first and hide behind a ヒント button after three first-try answers in a row. A wrong answer brings them back.</p></div>
    <div class="panel"><h3>Nana's voice</h3><p class="small">Every English word, sentence, story and question is read in Nana's own voice. The 🔈 buttons next to Japanese hints use the device's Japanese voice.</p>
      <div class="row"><button class="btn soft" id="tv">🔊 Test Nana's voice</button></div><p class="small" id="vs"></p></div>
    <div class="panel"><h3>Add to Home Screen</h3><p class="small">On iPhone or iPad, open this page in Safari, tap Share, then <b>Add to Home Screen</b>.</p></div>
    <div class="panel"><h3>Start over</h3><div class="row"><button class="btn soft" id="r1">Reset progress…</button><button class="btn" id="r2" hidden style="background:var(--coral)">Yes, erase progress</button></div></div>
  </div>`);
  $("#share").onclick=async()=>{const t=$("#rep").value;if(navigator.share){try{await navigator.share({title:"TK's English report",text:t});return}catch(e){if(e&&e.name==="AbortError")return}}$("#copy").click()};
  $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#rep").value);toast("Copied!")}catch(e){const t=$("#rep");t.focus();t.select();toast("Press and hold to copy.")}};
  $("#hm").onchange=e=>{S.hintMode=e.target.value;save();toast("Saved")};
  $("#tv").onclick=()=>say("Welcome back, TK! Ready for your next mission?");$("#vs").textContent=VOICE.ready?"✔ Nana's voice is loaded.":"Nana's voice is loading…";
  $("#r1").onclick=()=>{$("#r2").hidden=false};
  $("#r2").onclick=()=>{Object.assign(S,{xp:0,streakRight:0,done:{},badges:[],days:{},seconds:0,minutes:0,words:[],stats:{},best:{},dailyDone:null,dailyCount:0,bossWins:0});save();toast("Progress erased");family()};
}

/* ============ AUTO PAGE TURN ============
   After a page is finished being read aloud, if nobody taps for 10 seconds, turn to the next page. */
const IDLE_MS=10000;let lastAct=Date.now(),talkSince=0;
["pointerdown","keydown","touchstart","wheel"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
function busyTalking(){try{return (vSources&&vSources.length>0)||speechSynthesis.speaking||(audioEl&&!audioEl.paused)}catch(e){return false}}
setInterval(()=>{
  const talking=busyTalking();if(!talking)talkSince=0;else if(!talkSince)talkSince=Date.now();
  const busy=(talking&&Date.now()-talkSince<90000)||(typeof turning!=="undefined"&&turning)||document.hidden||document.querySelector(".overlay");
  if(busy)lastAct=Date.now();
  const idle=Date.now()-lastAct,h=hintTarget();
  document.querySelectorAll(".hintme").forEach(x=>{if(x!==h||idle<2000)x.classList.remove("hintme")});
  if(h&&!h.disabled&&idle>=2000)h.classList.add("hintme");
  if(busy)return;
  const b=autoNext();
  if(!b||b.disabled){lastAct=Date.now();return}
  if(idle>=IDLE_MS){lastAct=Date.now();b.classList.remove("hintme");b.click()}
},500);
function hintTarget(){return document.querySelector(".story")?document.querySelector("#qs"):null}
function autoNext(){return document.querySelector(".story")?document.querySelector("#qs"):null}

home();
loadVoicePack();
</script>
